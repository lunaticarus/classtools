<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relative Clauses Quiz Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .animate-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen bg-slate-50 p-4 md:p-8 text-slate-900">
    <div id="app" class="max-w-3xl mx-auto">
        <!-- Content injected by JavaScript -->
    </div>

    <script>
        const masterQuestions = [
            // Section A: 30 Questions
            { type: 'A', q: "The student ______ won the English public speaking contest is from my class.", a: "who" },
            { type: 'A', q: "My neighbour, ______ son is a famous actor, just moved to Kowloon.", a: "whose" },
            { type: 'A', q: "This is the dictionary ______ I use for my DSE English preparation.", a: "which" },
            { type: 'A', q: "The Hong Kong Museum of History, ______ was built in 1975, attracts many tourists.", a: "which" },
            { type: 'A', q: "Do you know the girl ______ mother works as a doctor in Queen Mary Hospital?", a: "whose" },
            { type: 'A', q: "My grandfather, ______ is 85 years old, still walks to the park every morning.", a: "who" },
            { type: 'A', q: "The MTR train ______ arrived just now was completely full.", a: "which" },
            { type: 'A', q: "The Lantau Link, ______ connects Lantau Island to the rest of Hong Kong, includes the Tsing Ma Bridge.", a: "which" },
            { type: 'A', q: "That is the teacher ______ advice helped me choose my university major.", a: "whose" },
            { type: 'A', q: "Jennifer, ______ parents are both engineers, wants to study architecture.", a: "whose" },
            { type: 'A', q: "The smartphone ______ I bought last week has already stopped working.", a: "which" },
            { type: 'A', q: "Ocean Park, ______ is one of Hong Kong’s most popular attractions, recently opened a new roller coaster.", a: "which" },
            { type: 'A', q: "The firefighter ______ rescued the cat from the tree received a medal.", a: "who" },
            { type: 'A', q: "My best friend, ______ brother plays football for the Hong Kong team, is very proud.", a: "whose" },
            { type: 'A', q: "The restaurant ______ serves the best egg waffles in Causeway Bay is always crowded.", a: "which" },
            { type: 'A', q: "The Peak Tower, ______ design is unique, offers a spectacular view of Victoria Harbour.", a: "whose" },
            { type: 'A', q: "Is this the artist ______ painting won first prize in the competition?", a: "whose" },
            { type: 'A', q: "Mr. Chan, ______ has taught at our school for 20 years, is retiring next month.", a: "who" },
            { type: 'A', q: "The laptop ______ I borrowed from the library is very fast.", a: "which" },
            { type: 'A', q: "My cousin, ______ dream is to become a pilot, has just started flying lessons.", a: "whose" },
            { type: 'A', q: "The police officer ______ helped us find the way was very friendly.", a: "who" },
            { type: 'A', q: "Hong Kong Disneyland, ______ was fully booked last summer, is very expensive.", a: "which" },
            { type: 'A', q: "The woman ______ handbag was stolen reported the incident immediately.", a: "whose" },
            { type: 'A', q: "Dr. Lam, ______ research on climate change is famous worldwide, will give a lecture next week.", a: "whose" },
            { type: 'A', q: "This is the pen ______ my father used when he was a student.", a: "which" },
            { type: 'A', q: "The old man, ______ dog barks every night, lives alone on the ground floor.", a: "whose" },
            { type: 'A', q: "The song ______ they played on the radio this morning reminded me of my childhood.", a: "which" },
            { type: 'A', q: "Victoria Harbour, ______ water is famously deep, hosts the annual fireworks display.", a: "whose" },
            { type: 'A', q: "The athlete ______ broke the Hong Kong record is only 18 years old.", a: "who" },
            { type: 'A', q: "My grandmother, ______ cooking is known throughout our village, taught me how to make dumplings.", a: "whose" },

            // Section B: 30 Questions
            { type: 'B', s1: "The student is from Sha Tin.", s2: "He won the chess competition.", a: ["The student who won the chess competition is from Sha Tin.", "The student who is from Sha Tin won the chess competition."] },
            { type: 'B', s1: "My uncle lives in Canada.", s2: "His daughter is a professional violinist.", a: ["My uncle, whose daughter is a professional violinist, lives in Canada."] },
            { type: 'B', s1: "This is the book.", s2: "I read it during the summer holiday.", a: ["This is the book which I read during the summer holiday."] },
            { type: 'B', s1: "The Peak is a famous tourist spot.", s2: "It offers a panoramic view of Hong Kong.", a: ["The Peak, which offers a panoramic view of Hong Kong, is a famous tourist spot.", "The Peak, which is a famous tourist spot, offers a panoramic view of Hong Kong."] },
            { type: 'B', s1: "The woman is a dentist.", s2: "Her son studies in my class.", a: ["The woman whose son studies in my class is a dentist."] },
            { type: 'B', s1: "My father bought a car last month.", s2: "The car is very fuel-efficient.", a: ["My father bought a car last month which is very fuel-efficient.", "The car which my father bought last month is very fuel-efficient."] },
            { type: 'B', s1: "Temple Street Night Market is famous.", s2: "It is located in Kowloon.", a: ["Temple Street Night Market, which is located in Kowloon, is famous.", "Temple Street Night Market, which is famous, is located in Kowloon."] },
            { type: 'B', s1: "The boy helped me find my way.", s2: "He is from my school.", a: ["The boy who helped me find my way is from my school.", "The boy who is from my school helped me find my way."] },
            { type: 'B', s1: "My sister is studying in the UK.", s2: "Her best friend is from France.", a: ["My sister, whose best friend is from France, is studying in the UK."] },
            { type: 'B', s1: "The laptop is very expensive.", s2: "My brother wants to buy it.", a: ["The laptop which my brother wants to buy is very expensive.", "My brother wants to buy the laptop which is very expensive."] },
            { type: 'B', s1: "Dr. Wong is a famous surgeon.", s2: "His book on heart disease became a bestseller.", a: ["Dr. Wong, whose book on heart disease became a bestseller, is a famous surgeon."] },
            { type: 'B', s1: "The dog was barking loudly.", s2: "It belonged to my neighbour.", a: ["The dog which belonged to my neighbour was barking loudly.", "The dog which was barking loudly belonged to my neighbour."] },
            { type: 'B', s1: "The Hong Kong Coliseum is in Hung Hom.", s2: "Many famous singers have performed in this place.", a: ["The Hong Kong Coliseum, which many famous singers have performed in, is in Hung Hom.", "Many famous singers have performed in the Hong Kong Coliseum, which is in Hung Hom."] },
            { type: 'B', s1: "The artist painted this mural.", s2: "He is from Italy.", a: ["The artist who painted this mural is from Italy.", "The artist who is from Italy painted this mural."] },
            { type: 'B', s1: "My grandfather gave me a watch.", s2: "The watch was his father’s.", a: ["My grandfather gave me a watch which was his father's.", "The watch which my grandfather gave me was his father's."] },
            { type: 'B', s1: "The athlete broke the Asian record.", s2: "She trained for ten years.", a: ["The athlete who broke the Asian record trained for ten years.", "The athlete who trained for ten years broke the Asian record."] },
            { type: 'B', s1: "The University of Hong Kong is the oldest university in Hong Kong.", s2: "It was founded in 1911.", a: ["The University of Hong Kong, which was founded in 1911, is the oldest university in Hong Kong.", "The University of Hong Kong, which is the oldest university in Hong Kong, was founded in 1911."] },
            { type: 'B', s1: "The girl is my cousin.", s2: "Her hair is very long.", a: ["The girl whose hair is very long is my cousin."] },
            { type: 'B', s1: "Our English teacher is from the UK.", s2: "Her accent is very clear.", a: ["Our English teacher, whose accent is very clear, is from the UK."] },
            { type: 'B', s1: "The camera is very old.", s2: "My father still uses it.", a: ["The camera which my father still uses is very old.", "My father still uses the camera which is very old."] },
            { type: 'B', s1: "The Clock Tower is in Tsim Sha Tsui.", s2: "It is a declared monument.", a: ["The Clock Tower, which is in Tsim Sha Tsui, is a declared monument.", "The Clock Tower, which is a declared monument, is in Tsim Sha Tsui."] },
            { type: 'B', s1: "The man is a famous chef.", s2: "His restaurant has three Michelin stars.", a: ["The man whose restaurant has three Michelin stars is a famous chef.", "The man is a famous chef whose restaurant has three Michelin stars."] },
            { type: 'B', s1: "Jenny is moving to Japan next month.", s2: "Her parents own a restaurant in Causeway Bay.", a: ["Jenny, whose parents own a restaurant in Causeway Bay, is moving to Japan next month."] },
            { type: 'B', s1: "The phone belongs to my brother.", s2: "It is on the table.", a: ["The phone which is on the table belongs to my brother.", "The phone which belongs to my brother is on the table."] },
            { type: 'B', s1: "The Kowloon Walled City Park is very peaceful.", s2: "It was once a crowded settlement.", a: ["The Kowloon Walled City Park, which was once a crowded settlement, is very peaceful.", "The Kowloon Walled City Park, which is very peaceful, was once a crowded settlement."] },
            { type: 'B', s1: "The child is sleeping peacefully.", s2: "His mother is reading a story.", a: ["The child whose mother is reading a story is sleeping peacefully."] },
            { type: 'B', s1: "My grandmother baked these cookies.", s2: "Her recipe is a family secret.", a: ["My grandmother, whose recipe is a family secret, baked these cookies."] },
            { type: 'B', s1: "The building was damaged in the typhoon.", s2: "It is being repaired now.", a: ["The building which was damaged in the typhoon is being repaired now.", "The building which is being repaired now was damaged in the typhoon."] },
            { type: 'B', s1: "The Hong Kong Cultural Centre is located in Tsim Sha Tsui.", s2: "Its architecture is striking.", a: ["The Hong Kong Cultural Centre, whose architecture is striking, is located in Tsim Sha Tsui."] },
            { type: 'B', s1: "The musician is only 16 years old.", s2: "She composed this symphony.", a: ["The musician who composed this symphony is only 16 years old.", "The musician who is only 16 years old composed this symphony."] }
        ];

        let state = {
            view: 'menu',
            currentIndex: 0,
            activeQuestions: [],
            answers: {},
            showFeedback: false,
            passingCode: ''
        };

        const normalize = (str) => str.toLowerCase().replace(/\s+/g, ' ').trim().replace(/[.,!?;]$/, "");

        function render() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            if (state.view === 'menu') {
                app.innerHTML = `
                    <div class="bg-white rounded-3xl shadow-xl p-10 text-center border border-slate-100 animate-in">
                        <div class="w-20 h-20 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-6">
                            <i data-lucide="refresh-cw" size="40"></i>
                        </div>
                        <h1 class="text-4xl font-black text-slate-900 mb-4 tracking-tight">Randomized Challenge</h1>
                        <p class="text-slate-500 mb-8 max-w-md mx-auto leading-relaxed">
                            Answer <b>30 questions</b> (15 pronouns + 15 joinings) selected randomly. Score <b>80% (24/30)</b> to pass.
                        </p>
                        <button onclick="handleStart()" class="w-full py-5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-bold text-xl shadow-lg transition-all transform hover:-translate-y-1">
                            Start 30-Question Quiz
                        </button>
                        <div class="mt-8 flex justify-center gap-4 text-xs font-bold text-slate-400 uppercase tracking-widest">
                            <span>Section A: 15 Qs</span>
                            <span>•</span>
                            <span>Section B: 15 Qs</span>
                        </div>
                    </div>
                `;
            } else if (state.view === 'quiz') {
                const q = state.activeQuestions[state.currentIndex];
                const progress = ((state.currentIndex + 1) / state.activeQuestions.length) * 100;
                
                app.innerHTML = `
                    <div class="bg-white rounded-3xl shadow-lg p-6 md:p-10 border border-slate-100 relative overflow-hidden animate-in">
                        <div class="absolute top-0 left-0 h-1.5 bg-slate-100 w-full">
                            <div class="h-full bg-indigo-600 transition-all duration-500" style="width: ${progress}%"></div>
                        </div>

                        <div class="flex justify-between items-center mb-8 pt-4">
                            <div class="flex items-center gap-2">
                                <span class="px-3 py-1 rounded-full text-xs font-black tracking-tighter ${q.type === 'A' ? 'bg-blue-100 text-blue-600' : 'bg-emerald-100 text-emerald-600'}">
                                    ${q.type === 'A' ? 'PRONOUNS' : 'SENTENCE JOINING'}
                                </span>
                                <span class="text-sm font-bold text-slate-400">
                                    ${state.currentIndex + 1} / ${state.activeQuestions.length}
                                </span>
                            </div>
                            <button onclick="setView('menu')" class="text-slate-400 hover:text-red-500 transition-colors">
                                <i data-lucide="x-circle" size="20"></i>
                            </button>
                        </div>

                        <div id="quiz-content"></div>
                        <div id="feedback-area"></div>
                    </div>
                `;

                const content = document.getElementById('quiz-content');
                if (q.type === 'A') {
                    const parts = q.q.split('______');
                    const studentAns = state.answers[state.currentIndex] || '____';
                    let feedbackClass = 'text-indigo-600 border-indigo-200 min-w-[80px]';
                    if (state.showFeedback) {
                        feedbackClass = isCorrect(state.currentIndex) ? 'text-emerald-600 border-emerald-500' : 'text-red-500 border-red-500';
                    }

                    content.innerHTML = `
                        <div class="space-y-10">
                            <h2 class="text-2xl md:text-3xl font-medium leading-relaxed text-slate-800">
                                ${parts[0]}<span class="inline-block border-b-4 px-4 mx-1 transition-all ${feedbackClass}">${studentAns}</span>${parts[1]}
                            </h2>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                ${['who', 'which', 'whose'].map(opt => `
                                    <button onclick="handlePronounSelect('${opt}')" ${state.showFeedback ? 'disabled' : ''} 
                                        class="py-5 px-6 rounded-2xl border-2 font-black text-xl transition-all ${state.answers[state.currentIndex] === opt ? (state.showFeedback ? (isCorrect(state.currentIndex) ? 'bg-emerald-50 border-emerald-500 text-emerald-700' : 'bg-red-50 border-red-500 text-red-700') : 'bg-indigo-50 border-indigo-500 text-indigo-700') : 'bg-white border-slate-200 hover:border-slate-300 text-slate-600'}">
                                        ${opt}
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                    `;
                } else {
                    content.innerHTML = `
                        <div class="space-y-6">
                            <div class="bg-slate-50 p-6 rounded-2xl border-l-4 border-emerald-500">
                                <p class="text-xl font-bold text-slate-700">1. ${q.s1}</p>
                                <p class="text-xl font-bold text-slate-700 mt-2">2. ${q.s2}</p>
                            </div>
                            <div class="space-y-4">
                                <textarea id="sentence-input" oninput="state.userSentence = this.value" ${state.showFeedback ? 'disabled' : ''} 
                                    placeholder="Combine them into one sentence..."
                                    class="w-full p-6 border-2 border-slate-200 rounded-3xl h-32 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-50 outline-none transition-all text-xl font-medium">${state.userSentence || ''}</textarea>
                                ${!state.showFeedback ? `
                                    <button onclick="checkSentence()" class="w-full py-5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl font-bold text-lg shadow-lg transition-all">
                                        Submit Sentence
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    `;
                }

                if (state.showFeedback) {
                    const fb = document.getElementById('feedback-area');
                    const correct = isCorrect(state.currentIndex);
                    fb.innerHTML = `
                        <div class="mt-8 p-6 rounded-2xl border-2 animate-in ${correct ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-red-50 border-red-200 text-red-800'}">
                            <div class="flex items-center gap-3 mb-2">
                                <i data-lucide="${correct ? 'check-circle' : 'alert-circle'}" class="${correct ? 'text-emerald-600' : 'text-red-600'}"></i>
                                <span class="font-black uppercase tracking-widest text-sm">${correct ? 'Correct' : 'Incorrect'}</span>
                            </div>
                            <p class="text-xs font-black opacity-50 uppercase mb-1">Acceptable Answer(s):</p>
                            <div class="space-y-2">
                                ${(q.type === 'A' ? [q.a] : q.a).map(ans => `<p class="text-lg font-bold leading-tight">${ans}</p>`).join('')}
                            </div>
                            <button onclick="nextQuestion()" class="mt-6 w-full py-4 bg-slate-900 text-white rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-black transition-all">
                                ${state.currentIndex === state.activeQuestions.length - 1 ? 'Finish Quiz' : 'Next Question'} <i data-lucide="arrow-right" size="20"></i>
                            </button>
                        </div>
                    `;
                }
            } else if (state.view === 'summary') {
                const score = calculateFinalScore();
                const passed = score >= 24;

                app.innerHTML = `
                    <div class="bg-white rounded-3xl shadow-2xl p-10 text-center border border-slate-100 animate-in">
                        ${passed ? `
                            <div class="w-24 h-24 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-6">
                                <i data-lucide="trophy" size="48"></i>
                            </div>
                            <h2 class="text-4xl font-black text-slate-900 mb-2 tracking-tight">Pass Achieved!</h2>
                            <p class="text-slate-500 mb-8 text-lg">Mastery of Relative Clauses confirmed.</p>
                            
                            <div class="bg-indigo-50 border-2 border-indigo-100 rounded-3xl p-8 mb-8">
                                <div class="text-6xl font-black text-indigo-600 mb-2">${score} / 30</div>
                                <p class="text-sm font-bold uppercase tracking-widest text-indigo-400 mb-8">Verification Code Available</p>
                                
                                <div class="bg-white p-6 rounded-2xl border-2 border-indigo-200 shadow-inner inline-flex flex-col items-center w-full max-w-sm mx-auto">
                                    <p class="text-xs font-black text-slate-400 uppercase mb-3 flex items-center gap-1">
                                        <i data-lucide="lock" size="14"></i> Teacher Verification Code
                                    </p>
                                    <code class="text-2xl font-mono font-black text-slate-800 tracking-tighter bg-slate-50 px-4 py-2 rounded-lg border border-slate-100 mb-4 block w-full text-center">
                                        ${state.passingCode}
                                    </code>
                                    <button onclick="copyCode()" class="w-full py-3 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 flex items-center justify-center gap-2 transition-all active:scale-95">
                                        <i data-lucide="clipboard-check" size="18"></i> Copy Code
                                    </button>
                                </div>
                            </div>
                        ` : `
                            <div class="w-24 h-24 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-6">
                                <i data-lucide="x-circle" size="48"></i>
                            </div>
                            <h2 class="text-4xl font-black text-slate-900 mb-2">Try Again</h2>
                            <p class="text-slate-500 mb-8 text-lg">
                                Score: <span class="text-red-600 font-bold">${score} / 30</span><br />
                                You need 24 points to receive a code.
                            </p>
                        `}

                        <div class="flex flex-col gap-4">
                            <button onclick="handleStart()" class="w-full py-5 bg-slate-900 text-white rounded-2xl font-bold text-xl hover:bg-black transition-all">
                                ${passed ? 'Practice More' : 'Retake Random Quiz'}
                            </button>
                            <button onclick="setView('menu')" class="w-full py-4 text-slate-400 font-bold hover:text-slate-600 transition-all">
                                Exit to Main Menu
                            </button>
                        </div>
                    </div>
                `;
            }

            lucide.createIcons();
        }

        function setView(view) {
            state.view = view;
            render();
        }

        function handleStart() {
            const sectionA = masterQuestions.filter(q => q.type === 'A');
            const shuffledA = [...sectionA].sort(() => 0.5 - Math.random()).slice(0, 15);
            const sectionB = masterQuestions.filter(q => q.type === 'B');
            const shuffledB = [...sectionB].sort(() => 0.5 - Math.random()).slice(0, 15);

            state.activeQuestions = [...shuffledA, ...shuffledB];
            state.currentIndex = 0;
            state.answers = {};
            state.showFeedback = false;
            state.userSentence = '';
            state.view = 'quiz';
            render();
        }

        function handlePronounSelect(option) {
            if (state.showFeedback) return;
            state.answers[state.currentIndex] = option;
            state.showFeedback = true;
            render();
        }

        function checkSentence() {
            if (state.showFeedback) return;
            const input = document.getElementById('sentence-input');
            state.answers[state.currentIndex] = input.value;
            state.showFeedback = true;
            render();
        }

        function nextQuestion() {
            if (state.currentIndex < state.activeQuestions.length - 1) {
                state.currentIndex++;
                state.showFeedback = false;
                state.userSentence = '';
                render();
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            const score = calculateFinalScore();
            if (score >= 24) {
                const now = new Date();
                const year = String(now.getFullYear()).slice(-2);
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const dateStr = `${year}${month}${day}`;

                const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
                const randomAA1 = chars[Math.floor(Math.random() * 26)] + chars[Math.floor(Math.random() * 26)];
                const midPart = `${randomAA1}${score + 3}${score - 3}`;

                const hours = String(now.getHours()).padStart(2, '0');
                const mins = String(now.getMinutes()).padStart(2, '0');
                const secs = String(now.getSeconds()).padStart(2, '0');
                const randomAA2 = chars[Math.floor(Math.random() * 26)] + chars[Math.floor(Math.random() * 26)];
                const endPart = `${hours}${mins}${secs}${score}${randomAA2}`;

                state.passingCode = `${dateStr}-${midPart}-${endPart}`;
            }
            state.view = 'summary';
            render();
        }

        function calculateFinalScore() {
            let score = 0;
            state.activeQuestions.forEach((q, idx) => {
                const ans = state.answers[idx] || "";
                if (q.type === 'A') {
                    if (ans === q.a) score++;
                } else {
                    if (q.a.some(valid => normalize(ans) === normalize(valid))) score++;
                }
            });
            return score;
        }

        function isCorrect(idx) {
            const q = state.activeQuestions[idx];
            const ans = state.answers[idx] || "";
            if (q.type === 'A') return ans === q.a;
            return q.a.some(valid => normalize(ans) === normalize(valid));
        }

        function copyCode() {
            const text = `Relative Clauses Quiz Completion Code: ${state.passingCode}`;
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            const btn = event.currentTarget;
            const original = btn.innerHTML;
            btn.innerHTML = 'Copied!';
            setTimeout(() => btn.innerHTML = original, 2000);
        }

        // Initial render
        window.onload = render;
    </script>
</body>
</html>
