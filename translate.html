<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocab Manager</title>
    <style>
        :root {
            /* Apple System Colors */
            --system-blue: #007aff;
            --system-gray-bg: #f5f5f7;
            --system-card-bg: #ffffff;
            --system-border: #d2d2d7;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --radius: 12px;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--system-gray-bg);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }

        h1 {
            font-weight: 600;
            font-size: 28px;
            letter-spacing: -0.5px;
            margin-bottom: 30px;
        }

        .controls { 
            margin-bottom: 32px; 
            display: flex; 
            gap: 12px; 
            flex-wrap: wrap; 
            justify-content: center; 
        }

        /* Apple Capsule Button Style */
        .btn-secondary {
            background: var(--system-card-bg);
            border: 1px solid var(--system-border);
            padding: 10px 20px;
            border-radius: 20px; /* Capsule shape */
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .btn-secondary:hover {
            background: #fafafa;
            border-color: #acacb0;
            transform: translateY(-1px);
        }

        .btn-share { 
            background: var(--system-blue); 
            color: white; 
            border: none; 
        }
        
        .btn-share:hover {
            background: #0062cc;
            color: white;
        }

        .container { 
            width: 100%; 
            max-width: 800px; 
        }

        .vocab-row {
            display: grid;
            grid-template-columns: 50px 1fr 1fr 50px;
            background: var(--system-card-bg);
            margin-bottom: 12px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid rgba(0,0,0,0.03);
            transition: transform 0.2s ease;
        }

        .vocab-row:focus-within {
            transform: scale(1.01);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        textarea {
            padding: 18px 12px;
            border: none;
            font-size: 16px;
            outline: none;
            background: transparent;
            color: var(--text-primary);
            font-family: inherit;
            resize: none;
            overflow: hidden;
            line-height: 1.45;
            min-height: 24px;
            width: 100%;
            box-sizing: border-box;
        }

        .zh-input { 
            border-left: 1px solid #f2f2f2; 
            color: var(--text-secondary); 
        }

        .icon-btn {
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--system-border);
            transition: color 0.2s, background 0.2s;
            user-select: none;
        }

        .audio-btn:hover { color: var(--system-blue); }
        .del-btn:hover { color: #ff3b30; } /* Apple System Red */

        .hint { 
            margin-top: 40px; 
            text-align: center; 
            font-size: 13px; 
            color: var(--text-secondary); 
            line-height: 1.8;
            background: rgba(0,0,0,0.03);
            padding: 15px;
            border-radius: 12px;
        }

        .loading { color: var(--system-border) !important; font-style: italic; }
        #fileInput { display: none; }

        /* Custom icons using SVGs for that crisp look */
        .icon { width: 20px; height: 20px; fill: currentColor; }
    </style>
</head>
<body>

    <h1>Vocabulary Manager</h1>

    <div class="controls">
        <button class="btn-secondary" onclick="exportCSV()">Export CSV</button>
        <button class="btn-secondary" onclick="document.getElementById('fileInput').click()">Import CSV</button>
        <button class="btn-secondary btn-share" onclick="shareList()">Copy Share Link</button>
        <input type="file" id="fileInput" accept=".csv" onchange="importCSV(event)">
    </div>

    <div class="container">
        <div id="vocabList"></div>
        <div class="hint">
            <strong>Enter</strong>: New line &nbsp; • &nbsp; <strong>Shift + Enter / Tab</strong>: Next field <br>
            <strong>Arrows</strong>: Navigate &nbsp; • &nbsp; <strong>Ctrl + Space</strong>: Pronounce
        </div>
    </div>

    <script>
        const vocabList = document.getElementById('vocabList');

        // SVG Icons
        const audioIcon = `<svg class="icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>`;
        const deleteIcon = `<svg class="icon" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>`;

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = el.scrollHeight + 'px';
        }

        function speak(text) {
            if (!text) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.95;
            window.speechSynthesis.speak(utterance);
        }

        function createRow(enValue = "", zhValue = "") {
            const row = document.createElement('div');
            row.className = 'vocab-row';

            const audioBtn = document.createElement('div');
            audioBtn.className = "icon-btn audio-btn";
            audioBtn.innerHTML = audioIcon;

            const enInput = document.createElement('textarea');
            enInput.placeholder = "English word...";
            enInput.className = "en-input";
            enInput.rows = 1;
            enInput.value = enValue;

            const zhInput = document.createElement('textarea');
            zhInput.placeholder = "Translation...";
            zhInput.className = "zh-input";
            zhInput.rows = 1;
            zhInput.value = zhValue;

            const del = document.createElement('div');
            del.className = "icon-btn del-btn";
            del.innerHTML = deleteIcon;

            audioBtn.onclick = () => speak(enInput.value);

            enInput.addEventListener('blur', async () => {
                const word = enInput.value.trim();
                if (!word || (zhInput.value.trim() !== "" && zhInput.dataset.auto !== "true")) return;
                
                zhInput.classList.add('loading');
                zhInput.value = "Translating...";
                try {
                    const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-TW&dt=t&q=${encodeURIComponent(word)}`);
                    const data = await res.json();
                    zhInput.value = data[0][0][0];
                    zhInput.dataset.auto = "true"; 
                    autoResize(zhInput);
                } catch (e) { zhInput.value = ""; }
                finally { zhInput.classList.remove('loading'); }
            });

            [enInput, zhInput].forEach(el => {
                el.addEventListener('input', () => {
                    autoResize(el);
                    if(el === zhInput) zhInput.dataset.auto = "false";
                });
            });

            const handleKeys = (e) => {
                const allInputs = Array.from(document.querySelectorAll('textarea'));
                const index = allInputs.indexOf(e.target);

                if (e.ctrlKey && e.code === 'Space') {
                    speak(enInput.value);
                    e.preventDefault();
                }

                if ((e.key === 'Enter' && e.shiftKey) || e.key === 'Tab') {
                    e.preventDefault();
                    if (index === allInputs.length - 1 && enInput.value) {
                        addRow(true);
                    } else if (allInputs[index + 1]) {
                        allInputs[index + 1].focus();
                    }
                } else if (e.key === 'ArrowDown' && !e.shiftKey) {
                    const next = allInputs[index + 2];
                    if (next) { next.focus(); e.preventDefault(); }
                    else if (index >= allInputs.length - 2) { addRow(true); e.preventDefault(); }
                } else if (e.key === 'ArrowUp' && !e.shiftKey) {
                    const prev = allInputs[index - 2];
                    if (prev) { prev.focus(); e.preventDefault(); }
                }
            };

            enInput.onkeydown = handleKeys;
            zhInput.onkeydown = handleKeys;
            
            del.onclick = () => {
                if (document.querySelectorAll('.vocab-row').length > 1) {
                    row.style.opacity = '0';
                    row.style.transform = 'scale(0.95)';
                    setTimeout(() => row.remove(), 200);
                } else { 
                    enInput.value = ""; zhInput.value = ""; 
                    autoResize(enInput); autoResize(zhInput); 
                }
            };

            row.append(audioBtn, enInput, zhInput, del);
            setTimeout(() => { autoResize(enInput); autoResize(zhInput); }, 0);
            return row;
        }

        function addRow(focus = false, en = "", zh = "") {
            const row = createRow(en, zh);
            vocabList.appendChild(row);
            if (focus) setTimeout(() => row.querySelector('.en-input').focus(), 10);
        }

        function shareList() {
            const data = [];
            document.querySelectorAll('.vocab-row').forEach(row => {
                const inputs = row.querySelectorAll('textarea');
                if (inputs[0].value) data.push([inputs[0].value, inputs[1].value]);
            });
            const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
            const url = new URL(window.location);
            url.searchParams.set('list', encoded);
            navigator.clipboard.writeText(url.href).then(() => {
                const btn = document.querySelector('.btn-share');
                const originalText = btn.innerText;
                btn.innerText = "✓ Copied";
                setTimeout(() => btn.innerText = originalText, 2000);
            });
        }

        function loadFromURL() {
            const params = new URLSearchParams(window.location.search);
            const encoded = params.get('list');
            if (encoded) {
                try {
                    const data = JSON.parse(decodeURIComponent(escape(atob(encoded))));
                    vocabList.innerHTML = "";
                    data.forEach(item => addRow(false, item[0], item[1]));
                } catch (e) { addRow(); }
            } else { addRow(); }
        }

        function exportCSV() {
            let csv = "English,Chinese\n";
            document.querySelectorAll('.vocab-row').forEach(row => {
                const inputs = row.querySelectorAll('textarea');
                const en = inputs[0].value.replace(/,/g, "").replace(/\n/g, " ");
                const zh = inputs[1].value.replace(/,/g, "").replace(/\n/g, " ");
                if (en) csv += `${en},${zh}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'vocab_list.csv'; a.click();
        }

        function importCSV(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const lines = e.target.result.split('\n').slice(1);
                vocabList.innerHTML = "";
                lines.forEach(line => {
                    const [en, zh] = line.split(',');
                    if (en) addRow(false, en.trim(), zh ? zh.trim() : "");
                });
                if (vocabList.innerHTML === "") addRow();
            };
            reader.readAsText(file);
        }

        loadFromURL();
    </script>
</body>
</html>
