<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Line Vocab Manager</title>
    <style>
        :root {
            --primary: #3b82f6;
            --bg: #f8fafc;
            --border: #e2e8f0;
            --text: #1e293b;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .controls { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

        .btn-secondary {
            background: white;
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-secondary:hover { background: #f1f5f9; border-color: #cbd5e1; }
        .btn-share { background: var(--primary); color: white; border: none; }

        .container { width: 100%; max-width: 900px; }

        .vocab-row {
            display: grid;
            grid-template-columns: 45px 1fr 1fr 45px;
            gap: 1px;
            background: var(--border);
            margin-bottom: 8px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            align-items: stretch;
        }

        textarea {
            padding: 14px;
            border: none;
            font-size: 1rem;
            outline: none;
            background: white;
            color: var(--text);
            font-family: inherit;
            resize: none; /* Hide manual resize handle */
            overflow: hidden; /* Hide scrollbars */
            line-height: 1.5;
            min-height: 24px;
            display: block;
            width: 100%;
            box-sizing: border-box;
        }

        .zh-input { border-left: 1px solid var(--border); color: #475569; }
        textarea:focus { background: #fff; box-shadow: inset 0 0 0 2px var(--primary); z-index: 2; }

        .icon-btn {
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #94a3b8;
            font-size: 1.1rem;
            transition: 0.2s;
            user-select: none;
        }

        .audio-btn:hover { color: var(--primary); background: #eff6ff; }
        .del-btn:hover { color: #ef4444; background: #fee2e2; }

        .hint { margin-top: 20px; text-align: center; font-size: 0.85rem; color: #94a3b8; line-height: 1.6; }
        .loading { background: #f1f5f9 !important; color: #94a3b8; }
        #fileInput { display: none; }
    </style>
</head>
<body>

    <div class="controls">
        <button class="btn-secondary" onclick="exportCSV()">Export CSV</button>
        <button class="btn-secondary" onclick="document.getElementById('fileInput').click()">Import CSV</button>
        <button class="btn-secondary btn-share" onclick="shareList()">🔗 Copy Share Link</button>
        <input type="file" id="fileInput" accept=".csv" onchange="importCSV(event)">
    </div>

    <div class="container">
        <div id="vocabList"></div>
        <div class="hint">
            <b>Enter</b>: New line &nbsp; | &nbsp; <b>Shift + Enter / Tab</b>: Next field <br>
            <b>Arrows</b>: Move between rows &nbsp; | &nbsp; <b>Ctrl + Space</b>: Pronounce
        </div>
    </div>

    <script>
        const vocabList = document.getElementById('vocabList');

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = el.scrollHeight + 'px';
        }

        function speak(text) {
            if (!text) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }

        function createRow(enValue = "", zhValue = "") {
            const row = document.createElement('div');
            row.className = 'vocab-row';

            const audioBtn = document.createElement('div');
            audioBtn.className = "icon-btn audio-btn";
            audioBtn.innerHTML = "🔊";

            const enInput = document.createElement('textarea');
            enInput.placeholder = "English...";
            enInput.className = "en-input";
            enInput.rows = 1;
            enInput.value = enValue;

            const zhInput = document.createElement('textarea');
            zhInput.placeholder = "Translation...";
            zhInput.className = "zh-input";
            zhInput.rows = 1;
            zhInput.value = zhValue;

            const del = document.createElement('div');
            del.className = "icon-btn del-btn";
            del.innerHTML = "×";

            audioBtn.onclick = () => speak(enInput.value);

            // Trigger translation
            enInput.addEventListener('blur', async () => {
                const word = enInput.value.trim();
                if (!word || (zhInput.value.trim() !== "" && zhInput.dataset.auto !== "true")) return;
                
                zhInput.classList.add('loading');
                zhInput.value = "Translating...";
                try {
                    const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-TW&dt=t&q=${encodeURIComponent(word)}`);
                    const data = await res.json();
                    zhInput.value = data[0][0][0];
                    zhInput.dataset.auto = "true"; 
                    autoResize(zhInput);
                } catch (e) { zhInput.value = "Error"; }
                finally { zhInput.classList.remove('loading'); }
            });

            // Resize listeners
            [enInput, zhInput].forEach(el => {
                el.addEventListener('input', () => {
                    autoResize(el);
                    if(el === zhInput) zhInput.dataset.auto = "false";
                });
            });

            const handleKeys = (e) => {
                const allInputs = Array.from(document.querySelectorAll('textarea'));
                const index = allInputs.indexOf(e.target);

                if (e.ctrlKey && e.code === 'Space') {
                    speak(enInput.value);
                    e.preventDefault();
                }

                if ((e.key === 'Enter' && e.shiftKey) || e.key === 'Tab') {
                    e.preventDefault();
                    if (index === allInputs.length - 1 && enInput.value) {
                        addRow(true);
                    } else if (allInputs[index + 1]) {
                        allInputs[index + 1].focus();
                    }
                } else if (e.key === 'ArrowDown' && !e.shiftKey) {
                    const next = allInputs[index + 2];
                    if (next) { next.focus(); e.preventDefault(); }
                    else if (index >= allInputs.length - 2) { addRow(true); e.preventDefault(); }
                } else if (e.key === 'ArrowUp' && !e.shiftKey) {
                    const prev = allInputs[index - 2];
                    if (prev) { prev.focus(); e.preventDefault(); }
                }
            };

            enInput.onkeydown = handleKeys;
            zhInput.onkeydown = handleKeys;
            
            del.onclick = () => {
                if (document.querySelectorAll('.vocab-row').length > 1) row.remove();
                else { enInput.value = ""; zhInput.value = ""; autoResize(enInput); autoResize(zhInput); }
            };

            row.append(audioBtn, enInput, zhInput, del);
            
            // Initial resize after being added to DOM
            setTimeout(() => { autoResize(enInput); autoResize(zhInput); }, 0);
            
            return row;
        }

        function addRow(focus = false, en = "", zh = "") {
            const row = createRow(en, zh);
            vocabList.appendChild(row);
            if (focus) setTimeout(() => row.querySelector('.en-input').focus(), 10);
        }

        function shareList() {
            const data = [];
            document.querySelectorAll('.vocab-row').forEach(row => {
                const inputs = row.querySelectorAll('textarea');
                if (inputs[0].value) data.push([inputs[0].value, inputs[1].value]);
            });
            const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
            const url = new URL(window.location);
            url.searchParams.set('list', encoded);
            navigator.clipboard.writeText(url.href).then(() => alert("Share link copied!"));
        }

        function loadFromURL() {
            const params = new URLSearchParams(window.location.search);
            const encoded = params.get('list');
            if (encoded) {
                try {
                    const data = JSON.parse(decodeURIComponent(escape(atob(encoded))));
                    vocabList.innerHTML = "";
                    data.forEach(item => addRow(false, item[0], item[1]));
                } catch (e) { addRow(); }
            } else { addRow(); }
        }

        function exportCSV() {
            let csv = "English,Chinese\n";
            document.querySelectorAll('.vocab-row').forEach(row => {
                const inputs = row.querySelectorAll('textarea');
                // Replace internal newlines with spaces for CSV safety
                const en = inputs[0].value.replace(/,/g, "").replace(/\n/g, " ");
                const zh = inputs[1].value.replace(/,/g, "").replace(/\n/g, " ");
                if (en) csv += `${en},${zh}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'vocab_list.csv'; a.click();
        }

        function importCSV(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const lines = e.target.result.split('\n').slice(1);
                vocabList.innerHTML = "";
                lines.forEach(line => {
                    const [en, zh] = line.split(',');
                    if (en) addRow(false, en.trim(), zh ? zh.trim() : "");
                });
                if (vocabList.innerHTML === "") addRow();
            };
            reader.readAsText(file);
        }

        loadFromURL();
    </script>
</body>
</html>
