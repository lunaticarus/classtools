<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocab Manager</title>
    <style>
        :root {
            --system-blue: #007aff;
            --system-gray-bg: #f5f5f7;
            --system-card-bg: #ffffff;
            --system-border: #d2d2d7;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --radius: 12px;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            background-color: var(--system-gray-bg);
            color: var(--text-primary);
            margin: 0;
            padding: 80px 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }

        /* Minimal Top Right Header */
        header {
            position: fixed;
            top: 0;
            right: 0;
            left: 0;
            height: 60px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 24px;
            background: rgba(245, 245, 247, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 100;
        }

        .controls { 
            display: flex; 
            gap: 8px; 
        }

        /* Minimal Icon Buttons */
        .btn-icon {
            background: transparent;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--system-blue);
            transition: background 0.2s;
        }

        .btn-icon:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .btn-icon svg {
            width: 20px;
            height: 20px;
            stroke-width: 2;
        }

        .container { 
            width: 100%; 
            max-width: 700px; 
            margin-top: 20px;
        }

        .vocab-row {
            display: grid;
            grid-template-columns: 44px 1fr 1fr 44px;
            background: var(--system-card-bg);
            margin-bottom: 8px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 0.5px solid rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        }

        .vocab-row:focus-within {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            transform: translateY(-1px);
        }

        textarea {
            padding: 16px 8px;
            border: none;
            font-size: 15px;
            outline: none;
            background: transparent;
            color: var(--text-primary);
            font-family: inherit;
            resize: none;
            overflow: hidden;
            line-height: 1.4;
            min-height: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .zh-input { 
            color: var(--text-secondary); 
            border-left: 0.5px solid #f0f0f0;
        }

        .icon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #c1c1c6;
            transition: color 0.2s;
        }

        .audio-btn:hover { color: var(--system-blue); }
        .del-btn:hover { color: #ff3b30; }

        .hint { 
            margin-top: 40px; 
            font-size: 12px; 
            color: var(--text-secondary); 
            text-align: center;
            opacity: 0.6;
        }

        #fileInput { display: none; }

        @media (max-width: 600px) {
            .vocab-row { grid-template-columns: 40px 1fr 1fr 40px; }
            header { padding: 0 12px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="controls">
            <button class="btn-icon" onclick="addRow(true)" title="New Entry">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <button class="btn-icon" onclick="document.getElementById('fileInput').click()" title="Import CSV">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 15V3m0 0L8 7m4-4l4 4M2 17l.621 2.485A2 2 0 004.561 21h14.878a2 2 0 001.94-1.515L22 17"/></svg>
            </button>
            <button class="btn-icon" onclick="exportCSV()" title="Export CSV">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3v12m0 0l4-4m-4 4l-4-4M2 17l.621 2.485A2 2 0 004.561 21h14.878a2 2 0 001.94-1.515L22 17"/></svg>
            </button>
            <button class="btn-icon" onclick="shareList()" title="Copy Share Link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
            </button>
            <input type="file" id="fileInput" accept=".csv" onchange="importCSV(event)">
        </div>
    </header>

    <div class="container">
        <div id="vocabList"></div>
        <div class="hint">
            Entries auto-save to the URL. Use Tab or Arrow keys to move between fields.
        </div>
    </div>

    <script>
        const vocabList = document.getElementById('vocabList');

        const audioIcon = `<svg style="width:18px;height:18px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 010 7.07M19.07 4.93a10 10 0 010 14.14"/></svg>`;
        const deleteIcon = `<svg style="width:18px;height:18px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 18L18 6M6 6l12 12"/></svg>`;

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = el.scrollHeight + 'px';
        }

        function speak(text) {
            if (!text) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }

        function createRow(enValue = "", zhValue = "") {
            const row = document.createElement('div');
            row.className = 'vocab-row';

            const audioBtn = document.createElement('div');
            audioBtn.className = "icon-btn audio-btn";
            audioBtn.innerHTML = audioIcon;

            const enInput = document.createElement('textarea');
            enInput.placeholder = "Word";
            enInput.className = "en-input";
            enInput.value = enValue;

            const zhInput = document.createElement('textarea');
            zhInput.placeholder = "Translation";
            zhInput.className = "zh-input";
            zhInput.value = zhValue;

            const del = document.createElement('div');
            del.className = "icon-btn del-btn";
            del.innerHTML = deleteIcon;

            audioBtn.onclick = () => speak(enInput.value);

            enInput.addEventListener('blur', async () => {
                const word = enInput.value.trim();
                if (!word || (zhInput.value.trim() !== "" && zhInput.dataset.auto !== "true")) return;
                zhInput.placeholder = "Translating...";
                try {
                    const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-TW&dt=t&q=${encodeURIComponent(word)}`);
                    const data = await res.json();
                    zhInput.value = data[0][0][0];
                    zhInput.dataset.auto = "true"; 
                    autoResize(zhInput);
                } catch (e) { zhInput.placeholder = "Translation"; }
            });

            [enInput, zhInput].forEach(el => {
                el.addEventListener('input', () => {
                    autoResize(el);
                    if(el === zhInput) zhInput.dataset.auto = "false";
                });
            });

            const handleKeys = (e) => {
                const allInputs = Array.from(document.querySelectorAll('textarea'));
                const index = allInputs.indexOf(e.target);

                if (e.ctrlKey && e.code === 'Space') {
                    speak(enInput.value);
                    e.preventDefault();
                }

                if (e.key === 'Tab') {
                    if (index === allInputs.length - 1 && enInput.value) {
                        e.preventDefault();
                        addRow(true);
                    }
                } else if (e.key === 'ArrowDown' && !e.shiftKey) {
                    const next = allInputs[index + 2];
                    if (next) { next.focus(); e.preventDefault(); }
                    else if (index >= allInputs.length - 2) { addRow(true); e.preventDefault(); }
                } else if (e.key === 'ArrowUp' && !e.shiftKey) {
                    const prev = allInputs[index - 2];
                    if (prev) { prev.focus(); e.preventDefault(); }
                }
            };

            enInput.onkeydown = handleKeys;
            zhInput.onkeydown = handleKeys;
            
            del.onclick = () => {
                if (document.querySelectorAll('.vocab-row').length > 1) {
                    row.style.opacity = '0';
                    setTimeout(() => row.remove(), 150);
                } else { 
                    enInput.value = ""; zhInput.value = ""; 
                    autoResize(enInput); autoResize(zhInput); 
                }
            };

            row.append(audioBtn, enInput, zhInput, del);
            setTimeout(() => { autoResize(enInput); autoResize(zhInput); }, 0);
            return row;
        }

        function addRow(focus = false, en = "", zh = "") {
            const row = createRow(en, zh);
            vocabList.appendChild(row);
            if (focus) setTimeout(() => row.querySelector('.en-input').focus(), 10);
        }

        function shareList() {
            const data = [];
            document.querySelectorAll('.vocab-row').forEach(row => {
                const inputs = row.querySelectorAll('textarea');
                if (inputs[0].value) data.push([inputs[0].value, inputs[1].value]);
            });
            const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
            const url = new URL(window.location);
            url.searchParams.set('list', encoded);
            navigator.clipboard.writeText(url.href).then(() => alert("Link copied to clipboard"));
        }

        function loadFromURL() {
            const params = new URLSearchParams(window.location.search);
            const encoded = params.get('list');
            if (encoded) {
                try {
                    const data = JSON.parse(decodeURIComponent(escape(atob(encoded))));
                    vocabList.innerHTML = "";
                    data.forEach(item => addRow(false, item[0], item[1]));
                } catch (e) { addRow(); }
            } else { addRow(); }
        }

        function exportCSV() {
            let csv = "English,Chinese\n";
            document.querySelectorAll('.vocab-row').forEach(row => {
                const inputs = row.querySelectorAll('textarea');
                const en = inputs[0].value.replace(/,/g, "").replace(/\n/g, " ");
                const zh = inputs[1].value.replace(/,/g, "").replace(/\n/g, " ");
                if (en) csv += `${en},${zh}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'vocab.csv'; a.click();
        }

        function importCSV(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const lines = e.target.result.split('\n').slice(1);
                vocabList.innerHTML = "";
                lines.forEach(line => {
                    const [en, zh] = line.split(',');
                    if (en) addRow(false, en.trim(), zh ? zh.trim() : "");
                });
                if (vocabList.innerHTML === "") addRow();
            };
            reader.readAsText(file);
        }

        loadFromURL();
    </script>
</body>
</html>
