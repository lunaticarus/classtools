<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocab Simple</title>
    <style>
        :root { --primary: #3b82f6; --bg: #f8fafc; --border: #e2e8f0; --text: #1e293b; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
        
        /* Simplified Buttons */
        .controls { margin-bottom: 20px; display: flex; gap: 8px; }
        .btn { background: white; border: 1px solid var(--border); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600; color: var(--text); transition: 0.2s; }
        .btn:hover { background: #f1f5f9; border-color: #cbd5e1; }
        .btn-primary { background: var(--primary); color: white; border: none; }

        .container { width: 100%; max-width: 850px; }
        .vocab-row { 
            display: grid; grid-template-columns: 40px 1fr 1fr 40px; 
            gap: 1px; background: var(--border); margin-bottom: 6px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border);
        }
        
        textarea { 
            padding: 12px; border: none; font-size: 1rem; outline: none; background: white; color: var(--text); 
            font-family: inherit; resize: none; overflow: hidden; line-height: 1.4; min-height: 20px;
        }
        .zh-input { border-left: 1px solid var(--border); color: #475569; }
        textarea:focus { background: #fff; box-shadow: inset 0 0 0 2px var(--primary); z-index: 2; }

        .icon { background: white; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #cbd5e1; transition: 0.2s; user-select: none; }
        .audio-btn:hover { color: var(--primary); }
        .del-btn:hover { color: #ef4444; background: #fee2e2; }

        .hint { margin-top: 20px; font-size: 0.75rem; color: #94a3b8; }
        .loading { background: #f8fafc !important; opacity: 0.6; }
        #fileInput { display: none; }
    </style>
</head>
<body>

    <div class="controls">
        <button class="btn" onclick="exportCSV()">Export</button>
        <button class="btn" onclick="document.getElementById('fileInput').click()">Import</button>
        <button class="btn btn-primary" onclick="shareList()">Share</button>
        <input type="file" id="fileInput" accept=".csv" onchange="importCSV(event)">
    </div>

    <div class="container" id="vocabList"></div>

    <div class="hint">
        <b>↑ / ↓</b>: Move between rows &nbsp; | &nbsp; <b>Enter</b>: New line &nbsp; | &nbsp; <b>Ctrl + Space</b>: Pronounce
    </div>

    <script>
        const vocabList = document.getElementById('vocabList');

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = el.scrollHeight + 'px';
        }

        function speak(text) {
            if (!text) return;
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US'; u.rate = 0.9;
            window.speechSynthesis.speak(u);
        }

        function createRow(en = "", zh = "") {
            const row = document.createElement('div');
            row.className = 'vocab-row';

            const audio = document.createElement('div');
            audio.className = "icon audio-btn"; audio.innerHTML = "🔊";
            
            const enIn = document.createElement('textarea');
            enIn.placeholder = "English"; enIn.value = en;

            const zhIn = document.createElement('textarea');
            zhIn.placeholder = "Chinese"; zhIn.className = "zh-input"; zhIn.value = zh;

            const del = document.createElement('div');
            del.className = "icon del-btn"; del.innerHTML = "×";

            audio.onclick = () => speak(enIn.value);

            // Translate on blur
            enIn.addEventListener('blur', async () => {
                const val = enIn.value.trim();
                if (!val || (zhIn.value.trim() && zhIn.dataset.auto !== "true")) return;
                zhIn.classList.add('loading');
                try {
                    const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-TW&dt=t&q=${encodeURIComponent(val)}`);
                    const data = await res.json();
                    zhIn.value = data[0][0][0];
                    zhIn.dataset.auto = "true";
                    autoResize(zhIn);
                } catch(e) {} finally { zhIn.classList.remove('loading'); }
            });

            // Keyboard: Strictly Arrows for navigation
            const handleKeys = (e) => {
                const boxes = Array.from(document.querySelectorAll('textarea'));
                const idx = boxes.indexOf(e.target);

                if (e.ctrlKey && e.code === 'Space') { speak(enIn.value); e.preventDefault(); }

                if (e.key === 'ArrowDown') {
                    // Check if we are at the last line of the textarea
                    const isLastLine = e.target.selectionEnd === e.target.value.length;
                    if (isLastLine) {
                        const next = boxes[idx + 2]; // Jump to same side in next row
                        if (next) { next.focus(); e.preventDefault(); }
                        else if (idx >= boxes.length - 2 && enIn.value) { addRow(true); e.preventDefault(); }
                    }
                } else if (e.key === 'ArrowUp') {
                    const isFirstLine = e.target.selectionStart === 0;
                    if (isFirstLine) {
                        const prev = boxes[idx - 2];
                        if (prev) { prev.focus(); e.preventDefault(); }
                    }
                }
            };

            [enIn, zhIn].forEach(el => {
                el.onkeydown = handleKeys;
                el.addEventListener('input', () => { autoResize(el); if(el === zhIn) zhIn.dataset.auto = "false"; });
            });

            del.onclick = () => {
                if (document.querySelectorAll('.vocab-row').length > 1) row.remove();
                else { enIn.value = ""; zhIn.value = ""; autoResize(enIn); autoResize(zhIn); }
            };

            row.append(audio, enIn, zhIn, del);
            setTimeout(() => { autoResize(enIn); autoResize(zhIn); }, 0);
            return row;
        }

        function addRow(focus = false, en = "", zh = "") {
            const row = createRow(en, zh);
            vocabList.appendChild(row);
            if (focus) setTimeout(() => row.querySelector('textarea').focus(), 10);
        }

        // CSV & Share functions
        function exportCSV() {
            let csv = "English,Chinese\n";
            document.querySelectorAll('.vocab-row').forEach(r => {
                const t = r.querySelectorAll('textarea');
                if (t[0].value) csv += `${t[0].value.replace(/,/g,"").replace(/\n/g," ")},${t[1].value.replace(/,/g,"").replace(/\n/g," ")}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'list.csv'; a.click();
        }

        function importCSV(e) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const lines = ev.target.result.split('\n').slice(1);
                vocabList.innerHTML = "";
                lines.forEach(l => { const [en, zh] = l.split(','); if(en) addRow(false, en.trim(), zh?zh.trim():""); });
                if(!vocabList.innerHTML) addRow();
            };
            reader.readAsText(e.target.files[0]);
        }

        function shareList() {
            const data = [];
            document.querySelectorAll('.vocab-row').forEach(r => {
                const t = r.querySelectorAll('textarea');
                if(t[0].value) data.push([t[0].value, t[1].value]);
            });
            const url = new URL(window.location);
            url.searchParams.set('list', btoa(unescape(encodeURIComponent(JSON.stringify(data)))));
            navigator.clipboard.writeText(url.href).then(() => alert("Copied!"));
        }

        const p = new URLSearchParams(window.location.search).get('list');
        if (p) { try { JSON.parse(decodeURIComponent(escape(atob(p)))).forEach(i => addRow(false, i[0], i[1])); } catch(e){ addRow(); } }
        else { addRow(); }
    </script>
</body>
</html>
