<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Midnight Command Center</title>
    <style>
        :root {
            --bg: #000000;
            --glass: rgba(28, 28, 30, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --accent: #FF9F0A; 
            --text: #FFFFFF;
        }

        body, html {
            margin: 0; padding: 0;
            height: 100%; width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            background-color: var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        #main-wrapper {
            width: 100%; height: 100%;
            padding: 40px;
            display: grid;
            grid-template-columns: 1fr 1.5fr; /* Clock & Weather on left, Calendar on right */
            grid-template-rows: auto 1fr;
            gap: 40px;
            transition: transform 0.5s ease-in-out;
        }

        /* Left Column: Time and Weather */
        .left-col {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            gap: 20px;
        }

        #time { font-size: 7.5rem; font-weight: 700; letter-spacing: -4px; margin: 0; line-height: 0.9; }
        #date { font-size: 2rem; color: var(--accent); font-weight: 500; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 2px; }

        /* Weather: No Border / Transparent */
        .weather-wrap {
            width: 100%;
            margin-top: 20px;
        }

        /* Right Column: Calendar Glass Card */
        .calendar-container {
            grid-row: span 2;
            background: var(--glass);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        iframe { 
            width: 100%; height: 100%; border: none; border-radius: 20px; 
            /* High-end dark mode inversion for Google Calendar */
            filter: invert(0.92) hue-rotate(180deg) brightness(0.85) contrast(1.1);
        }

        /* Subtle Breathing Animation for Burn-In Protection */
        @keyframes breathe {
            0% { opacity: 1; }
            50% { opacity: 0.88; }
            100% { opacity: 1; }
        }
        .burn-protect { animation: breathe 12s ease-in-out infinite; }
    </style>
</head>
<body>

<div id="main-wrapper" class="burn-protect">
    
    <div class="left-col">
        <header>
            <p id="time">00:00</p>
            <p id="date">LOADING...</p>
        </header>

        <div class="weather-wrap">
            <!-- YOUR NEW WEATHER CODE: NO BORDER, 3 DAYS, DARK THEME -->
            <a class="weatherwidget-io" href="https://forecast7.com/en/22d28114d16/hong-kong-island/" data-label_1="HONG KONG" data-days="3" data-theme="dark" >HONG KONG</a>
            <script>
            !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0];if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src='https://weatherwidget.io/js/widget.min.js';fjs.parentNode.insertBefore(js,fjs);}}(document,'script','weatherwidget-io-js');
            </script>
        </div>
    </div>

    <div class="calendar-container">
        <iframe id="calendar-frame" src=""></iframe>
    </div>

</div>

<script>
    const CALENDAR_URL = "https://calendar.google.com/calendar/embed?src=896001db082e5071015413796c2ba5363d9bc130c4efd91880ec39031a724d54%40group.calendar.google.com&ctz=Asia%2FHong_Kong&mode=AGENDA&showTitle=0&showNav=0&showDate=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0";

    // Update Calendar with Cache Buster
    function refreshCalendar() {
        const frame = document.getElementById('calendar-frame');
        const cacheBuster = "&t=" + new Date().getTime();
        frame.src = CALENDAR_URL + cacheBuster;
    }

    // Update Clock and Date
    function updateClock() {
        var now = new Date();
        var h = now.getHours(), m = now.getMinutes();
        var ampm = h >= 12 ? 'PM' : 'AM';
        h = h % 12 || 12;
        m = m < 10 ? '0'+m : m;
        document.getElementById('time').innerText = h + ":" + m + " " + ampm;
        
        var options = { weekday: 'long', month: 'short', day: 'numeric' };
        document.getElementById('date').innerText = now.toLocaleDateString('en-US', options);
    }

    // Burn-in Pixel Shifter
    function shiftPixels() {
        const wrapper = document.getElementById('main-wrapper');
        const x = Math.floor(Math.random() * 6) - 3; // -3 to +3px
        const y = Math.floor(Math.random() * 6) - 3; 
        wrapper.style.transform = `translate(${x}px, ${y}px)`;
    }

    // Run on startup
    updateClock();
    refreshCalendar();

    // Set intervals
    setInterval(updateClock, 1000);              // Clock: 1s
    setInterval(refreshCalendar, 900000);        // Calendar Sync: 15min
    setInterval(shiftPixels, 1800000);           // Burn-in protection: 30min
    
    // Page Refresh: Every 12 hours for memory stability
    setInterval(() => { location.reload(); }, 43200000);
</script>

</body>
</html>
