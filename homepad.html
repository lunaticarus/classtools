<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Midnight Command</title>
    <style>
        :root {
            --bg: #000000;
            --glass: rgba(28, 28, 30, 0.6);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #FF9F0A; 
            --text: #FFFFFF;
            --dim: rgba(255, 255, 255, 0.4);
        }

        body, html {
            margin: 0; padding: 0;
            height: 100%; width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            background-color: var(--bg);
            color: var(--text);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #main-wrapper {
            flex: 1;
            padding: 40px 60px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            transition: transform 0.8s ease-in-out;
        }

        /* 1. TOP SECTION: TIME & DATE */
        .header-section {
            text-align: center;
        }
        #time { font-size: 8rem; font-weight: 700; letter-spacing: -5px; margin: 0; }
        #date { font-size: 2rem; color: var(--accent); font-weight: 500; margin-top: -10px; text-transform: uppercase; }

        /* 2. MIDDLE SECTION: CALENDAR */
        .calendar-section {
            flex: 1;
            background: var(--glass);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--border);
            border-radius: 35px;
            padding: 15px;
            overflow: hidden;
        }
        iframe { 
            width: 100%; height: 100%; border: none; border-radius: 20px; 
            filter: invert(0.92) hue-rotate(180deg) brightness(0.9);
        }

        /* 3. BOTTOM SECTION: WEATHER */
        .weather-section {
            padding: 0 10px;
        }

        /* 4. FOOTER: INDONESIA BAR */
        footer {
            height: 60px;
            background: rgba(15, 15, 15, 0.8);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            font-size: 0.9rem;
            color: var(--dim);
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        footer b { color: var(--text); font-weight: 600; margin-left: 5px; }

        /* Burn-in Animation */
        @keyframes breathe {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }
        .burn-protect { animation: breathe 15s ease-in-out infinite; }
    </style>
</head>
<body>

<div id="main-wrapper" class="burn-protect">
    <div class="header-section">
        <p id="time">00:00</p>
        <p id="date">LOADING...</p>
    </div>

    <div class="calendar-section">
        <iframe id="calendar-frame" src=""></iframe>
    </div>

    <div class="weather-section">
        <a class="weatherwidget-io" href="https://forecast7.com/en/22d28114d16/hong-kong-island/" data-label_1="HONG KONG" data-days="3" data-theme="dark" >HONG KONG</a>
    </div>
</div>

<footer>
    <span>JKT: <b id="jkt-time">--:--</b></span>
    <span>Weather: <b>30°C Partly Cloudy</b></span>
    <span>Rate: <b>1 HKD = 2,248 IDR</b></span>
</footer>

<script>
    const CALENDAR_URL = "https://calendar.google.com/calendar/embed?src=896001db082e5071015413796c2ba5363d9bc130c4efd91880ec39031a724d54%40group.calendar.google.com&ctz=Asia%2FHong_Kong&mode=AGENDA&showTitle=0&showNav=0&showDate=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0";

    function refreshCalendar() {
        const frame = document.getElementById('calendar-frame');
        frame.src = CALENDAR_URL + "&t=" + new Date().getTime();
    }

    function updateClocks() {
        const now = new Date();
        
        // HK Time
        let h = now.getHours(), m = now.getMinutes();
        let ampm = h >= 12 ? 'PM' : 'AM';
        h = h % 12 || 12;
        m = m < 10 ? '0'+m : m;
        document.getElementById('time').innerText = `${h}:${m} ${ampm}`;
        document.getElementById('date').innerText = now.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });

        // Jakarta Time (UTC+7)
        const jktOptions = { timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit', hour12: false };
        document.getElementById('jkt-time').innerText = now.toLocaleTimeString('en-GB', jktOptions);
    }

    function shiftPixels() {
        const wrapper = document.getElementById('main-wrapper');
        const x = Math.floor(Math.random() * 8) - 4;
        const y = Math.floor(Math.random() * 8) - 4;
        wrapper.style.transform = `translate(${x}px, ${y}px)`;
    }

    updateClocks();
    refreshCalendar();

    setInterval(updateClocks, 1000);
    setInterval(refreshCalendar, 900000);
    setInterval(shiftPixels, 1800000);
    
    // Auto-refresh weather script
    !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0];if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src='https://weatherwidget.io/js/widget.min.js';fjs.parentNode.insertBefore(js,fjs);}}(document,'script','weatherwidget-io-js');
</script>

</body>
</html>
