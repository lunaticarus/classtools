<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Midnight Dashboard</title>
    <style>
        :root {
            --bg: #000000;
            --glass: rgba(28, 28, 30, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --accent: #FF9F0A; 
            --text: #FFFFFF;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            margin: 0; padding: 0;
            height: 100%; width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            background-color: var(--bg);
            color: var(--text);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Burn-in Protection Container */
        #main-wrapper {
            width: 100%;
            height: 100%;
            padding: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto 1fr;
            gap: 20px;
            transition: transform 0.5s ease-in-out; /* For the pixel shift */
        }

        /* Header: Time & Date */
        header {
            grid-column: span 2;
            text-align: left;
            padding-left: 10px;
            margin-bottom: 10px;
        }

        #time { font-size: 6rem; font-weight: 700; letter-spacing: -3px; margin: 0; line-height: 1; }
        #date { font-size: 1.8rem; color: var(--accent); font-weight: 500; margin-top: 5px; text-transform: uppercase; letter-spacing: 2px; }

        /* Glass Cards */
        .card {
            background: var(--glass);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        /* Weather Card */
        .weather-container {
            grid-column: 1;
        }

        /* Calendar Card */
        .calendar-container {
            grid-column: 2;
            grid-row: 2;
        }

        /* Routine/Task Card (fills remaining space) */
        .task-container {
            grid-column: 1;
            grid-row: 2;
        }

        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            border-radius: 18px; 
            /* Inverts Google's white to a Dark Mode look */
            filter: invert(0.9) hue-rotate(180deg) brightness(0.8); 
        }

        h3 { font-size: 1rem; color: var(--accent); margin-top: 0; text-transform: uppercase; letter-spacing: 1px; }

        .task-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .task-item:last-child { border: none; }
    </style>
</head>
<body>

<div id="main-wrapper">
    <header>
        <p id="time">00:00</p>
        <p id="date">LOADING DATE</p>
    </header>

    <div class="card weather-container">
        <a class="weatherwidget-io" href="https://forecast7.com/en/22d28114d16/hong-kong-island/" data-label_1="HONG KONG" data-theme="orange" data-basecolor="#1c1c1e" data-accent="rgba(255, 255, 255, 0)" >HONG KONG</a>
        <script>
        !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0];if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src='https://weatherwidget.io/js/widget.min.js';fjs.parentNode.insertBefore(js,fjs);}}(document,'script','weatherwidget-io-js');
        </script>
    </div>

    <div class="card task-container">
        <h3>Daily Focus</h3>
        <div class="task-item"><span>Laundry</span><b>Bed Linens</b></div>
        <div class="task-item"><span>Cleaning</span><b>Kitchen Deep Clean</b></div>
        <div class="task-item"><span>Plants</span><b>Water Balcony</b></div>
        <div class="task-item"><span>Status</span><b id="burn-status" style="color:rgba(255,255,255,0.3)">Protection Active</b></div>
    </div>

    <div class="card calendar-container">
        <!-- 2-Day Agenda View via Google Calendar -->
        <iframe src="https://calendar.google.com/calendar/embed?src=896001db082e5071015413796c2ba5363d9bc130c4efd91880ec39031a724d54%40group.calendar.google.com&ctz=Asia%2FHong_Kong&mode=AGENDA&showTitle=0&showNav=0&showDate=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0"></iframe>
    </div>
</div>

<script>
    // 1. Clock and Date Logic
    function updateClock() {
        var now = new Date();
        var h = now.getHours();
        var m = now.getMinutes();
        var ampm = h >= 12 ? 'PM' : 'AM';
        h = h % 12 || 12;
        m = m < 10 ? '0'+m : m;
        document.getElementById('time').innerText = h + ":" + m + " " + ampm;
        
        var options = { weekday: 'long', month: 'short', day: 'numeric' };
        document.getElementById('date').innerText = now.toLocaleDateString('en-US', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. Anti-Burn-In Pixel Shifter
    // Shifts the entire UI by 1-3 pixels every 30 minutes
    function preventBurnIn() {
        const wrapper = document.getElementById('main-wrapper');
        const x = Math.floor(Math.random() * 5) - 2; // -2 to +2 pixels
        const y = Math.floor(Math.random() * 5) - 2; 
        wrapper.style.transform = `translate(${x}px, ${y}px)`;
        
        console.log("Anti-Burn-In: Shifted UI to prevent static pixel fatigue.");
    }
    
    // Initial run and then every 30 mins (1800000ms)
    setInterval(preventBurnIn, 1800000);

    // 3. Hourly Page Refresh (Ensures Calendar & Weather Stay Current)
    setInterval(() => {
        location.reload();
    }, 3600000);
</script>

</body>
</html>
