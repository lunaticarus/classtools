<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Glassmorphic Home</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.4); /* Transparent white */
            --glass-stroke: rgba(255, 255, 255, 0.5);
            --accent: #FF9F0A; 
            --text-main: #FFFFFF; /* White text for glass contrast */
            --text-sec: rgba(255, 255, 255, 0.7);
            --nav-glass: rgba(0, 0, 0, 0.3);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            margin: 0; padding: 0;
            height: 100%; width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            /* Update 'bg.jpg' to your wallpaper filename */
            background: url('bg.jpg') no-repeat center center fixed; 
            background-size: cover;
            background-color: #2c2c2e; /* Fallback */
            color: var(--text-main);
            overflow: hidden;
        }

        /* The Glass Panel Overlay */
        .glass-container {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.2); /* Tint the wallpaper darker */
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        /* Navigation - Floating Glass Pill */
        nav {
            position: fixed;
            bottom: 25px; /* Moved to bottom like a Mac Dock/VisionOS bar */
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            height: 70px;
            display: flex;
            background: var(--nav-glass);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-stroke);
            border-radius: 35px;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .tab-btn {
            flex: 1;
            border: none;
            background: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-sec);
            font-size: 0.7rem;
            font-weight: 600;
            gap: 4px;
        }

        .tab-btn svg { width: 22px; height: 22px; fill: currentColor; }
        .tab-btn.active { color: var(--text-main); }
        .tab-btn.active svg { fill: var(--accent); filter: drop-shadow(0 0 5px var(--accent)); }

        main {
            height: calc(100vh - 100px);
            overflow-y: auto;
            padding: 30px 20px;
        }

        .content-section { display: none; animation: glassFade 0.4s ease; }
        .content-section.active { display: block; }

        @keyframes glassFade { from { opacity: 0; filter: blur(10px); } to { opacity: 1; filter: blur(0); } }

        /* Glass Cards */
        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-stroke);
            border-radius: 24px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .clock-section { text-align: center; margin-bottom: 30px; text-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        #time { font-size: 6rem; font-weight: 700; letter-spacing: -2px; margin: 0; }
        #date { font-size: 1.8rem; font-weight: 400; opacity: 0.9; margin: 0; }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .list-item:last-child { border: none; }
        .item-label { color: var(--text-sec); font-size: 1rem; }
        .item-value { font-weight: 600; font-size: 1.1rem; }

        iframe { width: 100%; height: 500px; border: none; border-radius: 20px; filter: invert(0.9) hue-rotate(180deg); opacity: 0.8; } /* Inverts Google's white bg to dark mode */

        h2 { font-size: 1.6rem; font-weight: 700; margin-top: 0; letter-spacing: -0.5px; }
    </style>
</head>
<body>

<div class="glass-container">
    <main>
        <!-- HOME SECTION -->
        <section id="home" class="content-section active">
            <div class="clock-section">
                <p id="time">00:00</p>
                <p id="date">Friday, May 15</p>
            </div>

            <div class="card" style="padding: 10px;">
                <a class="weatherwidget-io" href="https://forecast7.com/en/22d28114d16/hong-kong-island/" data-label_1="HONG KONG" data-theme="orange" data-basecolor="rgba(255, 255, 255, 0)" data-accent="rgba(255, 255, 255, 0)" >HONG KONG</a>
                <script>
                !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0];if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src='https://weatherwidget.io/js/widget.min.js';fjs.parentNode.insertBefore(js,fjs);}}(document,'script','weatherwidget-io-js');
                </script>
            </div>

            <div class="card">
                <h2 style="color: var(--accent)">Household Tasks</h2>
                <div class="list-item"><span class="item-label">Laundry</span><span class="item-value">Bed Linens Today</span></div>
                <div class="list-item"><span class="item-label">Plants</span><span class="item-value">Water Balcony</span></div>
            </div>
        </section>

        <!-- CALENDAR SECTION -->
        <section id="calendar" class="content-section">
            <div class="card" style="padding: 10px; height: 600px;">
                <iframe src="https://calendar.google.com/calendar/embed?src=896001db082e5071015413796c2ba5363d9bc130c4efd91880ec39031a724d54%40group.calendar.google.com&ctz=Asia%2FHong_Kong&mode=AGENDA&showTitle=0&showNav=0&showDate=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0"></iframe>
            </div>
        </section>

        <!-- RECIPES SECTION -->
        <section id="recipes" class="content-section">
            <div class="card">
                <h2>🍳 Recipe Cards</h2>
                <div class="list-item"><div><div class="item-value">Steamed Fish</div><div class="item-label">10 min steam + Soy Sauce</div></div></div>
                <div class="list-item"><div><div class="item-value">Chicken Soup</div><div class="item-label">2 hours simmer</div></div></div>
            </div>
        </section>

        <!-- INFO SECTION -->
        <section id="info" class="content-section">
            <div class="card">
                <h2>🏠 Home Info</h2>
                <div class="list-item"><span class="item-label">WiFi</span><span class="item-value">Apple_Guest_WiFi</span></div>
                <div class="list-item"><span class="item-label">Security</span><span class="item-value">+852 2XXX XXXX</span></div>
            </div>
        </section>
    </main>

    <nav>
        <button class="tab-btn active" onclick="openTab('home')">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>HOME</span>
        </button>
        <button class="tab-btn" onclick="openTab('calendar')">
            <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>
            <span>SCHEDULE</span>
        </button>
        <button class="tab-btn" onclick="openTab('recipes')">
            <svg viewBox="0 0 24 24"><path d="M18 11h-5V6h5v5zm-6 6h-5v-5h5v5zm6 0h-5v-5h5v5zm-6-6h-5V6h5v5z"/></svg>
            <span>RECIPES</span>
        </button>
        <button class="tab-btn" onclick="openTab('info')">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
            <span>INFO</span>
        </button>
    </nav>
</div>

<script>
    function updateClock() {
        var now = new Date();
        var h = now.getHours();
        var m = now.getMinutes();
        var ampm = h >= 12 ? 'PM' : 'AM';
        h = h % 12 || 12;
        m = m < 10 ? '0'+m : m;
        document.getElementById('time').innerText = h + ":" + m + " " + ampm;
        var options = { weekday: 'long', month: 'short', day: 'numeric' };
        document.getElementById('date').innerText = now.toLocaleDateString('en-US', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    function openTab(tabId) {
        var sections = document.getElementsByClassName('content-section');
        var buttons = document.getElementsByClassName('tab-btn');
        for (var i = 0; i < sections.length; i++) {
            sections[i].classList.remove('active');
            buttons[i].classList.remove('active');
        }
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }
</script>

</body>
</html>
