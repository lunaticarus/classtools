<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Timer</title>
    <style>
        /* Liquid Glass Design System Tokens */
        :root {
            /* High Transparency Glass Fills */
            --glass-bg-primary: rgba(255, 255, 255, 0.08);
            --glass-bg-card: rgba(255, 255, 255, 0.06);
            --glass-bg-hover: rgba(255, 255, 255, 0.18);
            --glass-bg-input: rgba(255, 255, 255, 0.12);
            
            /* Glass Border Highlights */
            --glass-border-light: rgba(255, 255, 255, 0.18);
            --glass-border-strong: rgba(255, 255, 255, 0.3);
            
            /* Depth Shadows */
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --glass-shadow-sm: 0 4px 16px 0 rgba(0, 0, 0, 0.25);
            
            /* Typography & System Colors */
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.85);
            --text-muted: rgba(255, 255, 255, 0.65);
            --accent-blue: #0a84ff;
            --accent-green: #30d158;
            --accent-orange: #ff9f0a;
            --accent-red: #ff453a;
            
            /* System Border Radius */
            --radius-container: 20px;
            --radius-element: 12px;
            --radius-full: 9999px;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        html, body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1f1c2c;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        /* Fixed Mobile Safari Compatibility Background */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: linear-gradient(135deg, #1f1c2c 0%, #928dab 50%, #2c3e50 100%);
            z-index: -2;
            pointer-events: none;
            transform: translateZ(0);
        }

        /* Ambient Dynamic Background Canvas */
        #liquidCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            z-index: -1;
            pointer-events: none;
            filter: blur(40px);
            opacity: 0.75;
            transform: translateZ(0);
        }

        /* Glass Header Container */
        header {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%) translateZ(0);
            width: calc(100% - 32px);
            max-width: 760px;
            height: 64px;
            background: var(--glass-bg-primary);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border-light);
            border-radius: var(--radius-container);
            box-shadow: var(--glass-shadow-sm);
            z-index: 900;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            transition: all 0.3s ease;
        }

        header.hidden-ui {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -20px) translateZ(0);
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            letter-spacing: -0.3px;
        }

        .top-nav { 
            display: flex; 
            gap: 8px; 
            align-items: center; 
        }

        /* Glass Nav Icon Button Component */
        .icon-nav-btn {
            background: var(--glass-bg-primary);
            border: 1px solid var(--glass-border-light);
            color: var(--text-main);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: var(--radius-element);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transform: translateZ(0);
            transition: all 0.2s ease;
            outline: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .icon-nav-btn:hover:not(:disabled) {
            background: var(--glass-bg-hover);
            border-color: var(--glass-border-strong);
        }

        .icon-nav-btn:active:not(:disabled) {
            transform: scale(0.95) translateZ(0);
        }

        .icon-nav-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .icon-nav-btn svg { width: 18px; height: 18px; fill: currentColor; }

        /* Timer Main Card Container */
        .container {
            width: calc(100% - 32px);
            max-width: 580px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .timer-card {
            width: 100%;
            background: var(--glass-bg-card);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border-light);
            border-radius: var(--radius-container);
            box-shadow: var(--glass-shadow);
            padding: clamp(24px, 5vh, 45px) 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transform: translateZ(0);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .timer-card:hover {
            background: var(--glass-bg-hover);
            border-color: var(--glass-border-strong);
        }

        /* Continuous Flashing Glass Alert */
        .timer-card.flashing-alert {
            animation: glassPulse 0.8s infinite alternate ease-in-out;
        }

        @keyframes glassPulse {
            0% {
                background: rgba(255, 69, 58, 0.28);
                border-color: rgba(255, 69, 58, 0.8);
                box-shadow: 0 0 30px rgba(255, 69, 58, 0.4);
            }
            100% {
                background: rgba(255, 159, 10, 0.32);
                border-color: rgba(255, 159, 10, 0.9);
                box-shadow: 0 0 40px rgba(255, 159, 10, 0.5);
            }
        }

        .timer-ring-wrapper {
            position: relative;
            width: clamp(210px, 32vh, 280px);
            height: clamp(210px, 32vh, 280px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .progress-ring {
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            width: 100%; height: 100%;
        }

        .progress-ring-bg { stroke: rgba(255, 255, 255, 0.1); stroke-width: 8; }
        .progress-ring-path {
            stroke: var(--accent-blue);
            stroke-width: 8;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.2s linear, stroke 0.4s ease;
        }

        .digital-display {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .time-text {
            font-size: clamp(48px, 8vh, 66px);
            font-weight: 700;
            letter-spacing: -1.5px;
            color: var(--text-main);
            font-variant-numeric: tabular-nums;
            line-height: 1;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            transition: font-size 0.2s ease;
        }

        .time-text.has-hours {
            font-size: clamp(36px, 6vh, 50px);
            letter-spacing: -1px;
        }

        .mode-label-text {
            margin-top: 8px;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        /* Center Dock Component */
        .bottom-dock {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateZ(0);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--glass-bg-primary);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 4px 12px;
            height: 38px;
            border-radius: var(--radius-full);
            border: 1px solid var(--glass-border-light);
            box-shadow: var(--glass-shadow);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .bottom-dock.hidden-ui {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, 20px) translateZ(0);
        }

        .dock-btn {
            background: transparent;
            color: var(--text-main);
            border: 1px solid transparent;
            padding: 6px 14px;
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
            user-select: none;
            outline: none;
        }

        .dock-btn:hover {
            background: var(--glass-bg-hover);
            border-color: var(--glass-border-light);
        }

        .dock-btn:active {
            transform: scale(0.95);
        }

        .dock-btn.primary {
            background: rgba(10, 132, 255, 0.25);
            border-color: rgba(10, 132, 255, 0.4);
            color: #ffffff;
        }

        .dock-btn.primary:hover {
            background: rgba(10, 132, 255, 0.4);
            border-color: rgba(10, 132, 255, 0.6);
        }

        .dock-divider {
            width: 1px;
            height: 18px;
            background: var(--glass-border-light);
            margin: 0 2px;
        }

        /* Glass Modal Component */
        #modalOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .action-modal {
            background: rgba(20, 20, 30, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 24px;
            border-radius: var(--radius-container);
            text-align: center;
            border: 1px solid var(--glass-border-light);
            box-shadow: var(--glass-shadow);
            width: 320px;
            max-width: calc(100vw - 32px);
            animation: modalPopCenter 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes modalPopCenter {
            from { opacity: 0; transform: scale(0.94) translateY(8px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes inputShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); border-color: var(--accent-red); }
            75% { transform: translateX(5px); border-color: var(--accent-red); }
        }

        .input-error {
            animation: inputShake 0.28s ease;
        }

        .action-modal p {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 14px;
        }

        /* Preset Pills Grid */
        .preset-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 16px;
        }

        .preset-pill {
            background: var(--glass-bg-primary);
            border: 1px solid var(--glass-border-light);
            padding: 8px 0;
            border-radius: var(--radius-element);
            font-weight: 600;
            font-size: 13px;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .preset-pill:hover {
            background: var(--glass-bg-hover);
            border-color: var(--glass-border-strong);
            color: var(--accent-blue);
        }

        .time-inputs {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
            margin-bottom: 18px;
        }

        .time-field-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .time-field-group span {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .modal-time-input {
            width: 64px;
            padding: 8px 4px;
            border-radius: var(--radius-element);
            border: 1px solid var(--glass-border-light);
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            background: var(--glass-bg-input);
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
            font-variant-numeric: tabular-nums;
            user-select: text;
            -webkit-user-select: text;
        }

        .modal-time-input:focus {
            border-color: var(--glass-border-strong);
            background: rgba(255, 255, 255, 0.2);
        }

        .glass-btn-full {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border-radius: var(--radius-element);
            background: rgba(10, 132, 255, 0.25);
            border: 1px solid rgba(10, 132, 255, 0.4);
            color: #ffffff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .glass-btn-full:hover {
            background: rgba(10, 132, 255, 0.4);
            border-color: rgba(10, 132, 255, 0.6);
        }

        .glass-btn-cancel {
            width: 100%;
            padding: 10px;
            font-size: 13.5px;
            border-radius: var(--radius-element);
            background: var(--glass-bg-primary);
            border: 1px solid var(--glass-border-light);
            color: var(--text-main);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .glass-btn-cancel:hover {
            background: var(--glass-bg-hover);
            border-color: var(--glass-border-strong);
        }

        .hidden { display: none !important; }

        #appVersion { 
            position: fixed; 
            right: 12px; 
            bottom: 4px; 
            font-size: 10px; 
            font-weight: 500; 
            color: var(--text-muted); 
            pointer-events: none; 
            z-index: 2000; 
        }

        @media (max-width: 600px) {
            header { width: calc(100% - 24px); padding: 0 14px; top: 12px; }
            header h1 { font-size: 18px; }
            .icon-nav-btn { padding: 6px 10px; }
            .bottom-dock { bottom: 16px; }
        }
    </style>
</head>
<body>

    <!-- Ambient Dynamic Background Canvas -->
    <canvas id="liquidCanvas"></canvas>

    <!-- Glass Header Wrapper -->
    <header id="appHeader">
        <h1>Timer</h1>
        <nav class="top-nav">
            <button class="icon-nav-btn" id="modeNavBtn" onclick="toggleMode()" title="Toggle Timer Mode (Count Down / Count Up)">
                <svg viewBox="0 0 24 24"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg>
            </button>
            <button class="icon-nav-btn" id="soundToggleBtn" onclick="toggleSound()" title="Toggle Mute Sound">
                <svg id="soundIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </button>
        </nav>
    </header>

    <div class="container">
        <div class="timer-card" id="timerCard" onclick="handleCardClick()" title="Click to toggle Focus Mode or clear alert">
            <div class="timer-ring-wrapper">
                <svg class="progress-ring" viewBox="0 0 120 120">
                    <circle class="progress-ring-bg" cx="60" cy="60" r="52" fill="transparent" />
                    <circle id="progressRingPath" class="progress-ring-path" cx="60" cy="60" r="52" fill="transparent" />
                </svg>
                <div class="digital-display">
                    <div id="timeDisplay" class="time-text">05:00</div>
                    <div id="modeDisplay" class="mode-label-text">Count Down</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Center Floating Glass Dock -->
    <div id="dockActions" class="bottom-dock">
        <button id="startBtn" class="dock-btn primary" onclick="toggleTimer()">
            <span id="startBtnIcon">▶</span> <span id="startBtnText">Start</span>
        </button>
        <button class="dock-btn" onclick="resetTimer()">Reset</button>
        <div class="dock-divider" id="dockSetDivider"></div>
        <button class="dock-btn" id="dockSetBtn" onclick="openSetModal()">Set</button>
    </div>

    <div id="appVersion">v4.5 | Liquid Glass</div>

    <!-- Set Time Glass Modal -->
    <div id="modalOverlay" onpointerdown="if (event.target === this) closeSetModal()">
        <div class="action-modal">
            <p>Set Countdown Time</p>
            
            <div class="preset-grid">
                <div class="preset-pill" onclick="applyQuickPreset(60)">1m</div>
                <div class="preset-pill" onclick="applyQuickPreset(120)">2m</div>
                <div class="preset-pill" onclick="applyQuickPreset(300)">5m</div>
                <div class="preset-pill" onclick="applyQuickPreset(600)">10m</div>
                <div class="preset-pill" onclick="applyQuickPreset(900)">15m</div>
                <div class="preset-pill" onclick="applyQuickPreset(1800)">30m</div>
            </div>

            <div class="time-inputs">
                <div class="time-field-group">
                    <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" data-max="99" id="inputHours" class="modal-time-input" placeholder="00" value="00">
                    <span>HRS</span>
                </div>
                <span style="font-weight: 700; font-size: 16px; color: var(--text-muted); margin-top: 4px;">:</span>
                <div class="time-field-group">
                    <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" data-max="59" id="inputMins" class="modal-time-input" placeholder="05" value="05">
                    <span>MIN</span>
                </div>
                <span style="font-weight: 700; font-size: 16px; color: var(--text-muted); margin-top: 4px;">:</span>
                <div class="time-field-group">
                    <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" data-max="59" id="inputSecs" class="modal-time-input" placeholder="00" value="00">
                    <span>SEC</span>
                </div>
            </div>

            <div style="display:flex; flex-direction:column; gap:8px;">
                <button class="glass-btn-full" onclick="applySetTime()">Set Duration</button>
                <button class="glass-btn-cancel" onclick="closeSetModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        /* Ambient Dynamic Background Canvas Engine */
        const canvas = document.getElementById('liquidCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, dpr;
        let blobRafId = null;
        
        function resizeCanvas() {
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        
        window.addEventListener('resize', () => {
            const currentDpr = Math.min(window.devicePixelRatio || 1, 2);
            if (canvas.width !== window.innerWidth * currentDpr || canvas.height !== window.innerHeight * currentDpr) {
                resizeCanvas();
            }
        });
        resizeCanvas();

        const blobs = [
            { x: 0.2, y: 0.3, r: 0.45, color: 'rgba(100, 140, 255, 0.6)', vx: 0.0005, vy: 0.0004 },
            { x: 0.8, y: 0.2, r: 0.5, color: 'rgba(180, 100, 255, 0.55)', vx: -0.0004, vy: 0.0005 },
            { x: 0.5, y: 0.8, r: 0.4, color: 'rgba(255, 120, 180, 0.5)', vx: 0.0003, vy: -0.0004 }
        ];

        function animateBlobs() {
            if (document.hidden) {
                blobRafId = null;
                return;
            }
            ctx.clearRect(0, 0, width, height);
            blobs.forEach(b => {
                b.x = Math.min(1, Math.max(0, b.x + b.vx));
                b.y = Math.min(1, Math.max(0, b.y + b.vy));
                if (b.x <= 0 || b.x >= 1) b.vx *= -1;
                if (b.y <= 0 || b.y >= 1) b.vy *= -1;

                const grad = ctx.createRadialGradient(
                    b.x * width, b.y * height, 0,
                    b.x * width, b.y * height, b.r * Math.max(width, height)
                );
                grad.addColorStop(0, b.color);
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(b.x * width, b.y * height, b.r * Math.max(width, height), 0, Math.PI * 2);
                ctx.fill();
            });
            blobRafId = requestAnimationFrame(animateBlobs);
        }
        blobRafId = requestAnimationFrame(animateBlobs);

        /* Inline Web Worker for Unthrottled Background Ticks (bfcache-safe) */
        let tickerWorker = null;

        function initTickerWorker() {
            if (tickerWorker) return;
            try {
                const workerBlob = new Blob([`
                    let id = null;
                    self.onmessage = (e) => {
                        if (e.data === 'start') {
                            clearInterval(id);
                            id = setInterval(() => self.postMessage('tick'), 200);
                        } else if (e.data === 'stop') {
                            clearInterval(id);
                            id = null;
                        }
                    };
                `], { type: 'application/javascript' });
                const workerUrl = URL.createObjectURL(workerBlob);
                tickerWorker = new Worker(workerUrl);
                URL.revokeObjectURL(workerUrl);
                tickerWorker.onmessage = () => syncTimer();
            } catch (e) {
                tickerWorker = null;
            }
        }
        initTickerWorker();

        window.addEventListener('pagehide', () => {
            if (tickerWorker) {
                tickerWorker.terminate();
                tickerWorker = null;
            }
            if (blobRafId) {
                cancelAnimationFrame(blobRafId);
                blobRafId = null;
            }
            stopKeepAlive();
            if (audioCtx && audioCtx.state === 'running') {
                audioCtx.suspend().catch(() => {});
            }
        });

        window.addEventListener('pageshow', (e) => {
            if (e.persisted) {
                initTickerWorker();
                if (!blobRafId && !document.hidden) {
                    blobRafId = requestAnimationFrame(animateBlobs);
                }
                if (isRunning) {
                    startTicker();
                    requestWakeLock();
                    startKeepAlive();
                    syncTimer();
                }
            }
        });

        /* Screen Wake Lock (Prevents iPad/Laptop Sleep During Active Timers) */
        let wakeLockSentinel = null;

        async function requestWakeLock() {
            if (!('wakeLock' in navigator) || wakeLockSentinel || document.hidden) return;
            try {
                wakeLockSentinel = await navigator.wakeLock.request('screen');
                wakeLockSentinel.addEventListener('release', () => {
                    wakeLockSentinel = null;
                    if (isRunning && !document.hidden) {
                        requestWakeLock();
                    }
                });
            } catch (e) {}
        }

        function releaseWakeLock() {
            if (wakeLockSentinel) {
                const sentinel = wakeLockSentinel;
                wakeLockSentinel = null;
                sentinel.release().catch(() => {});
            }
        }

        /* Timer Logic Engine (Millisecond-Accurate) */
        let mode = 'countdown'; 
        let initialMs = 300000; 
        let remainingMs = 300000;
        let elapsedMs = 0;
        let targetTimestamp = null;
        let isRunning = false;
        let fallbackInterval = null;
        let soundEnabled = true;
        let isFocusMode = false;
        let isAlertFlashing = false;
        let alertDismissedAt = 0;
        let lastRenderedSec = null;

        const ringPath = document.getElementById('progressRingPath');
        const ringRadius = 52;
        const circumference = 2 * Math.PI * ringRadius;
        ringPath.style.strokeDasharray = `${circumference} ${circumference}`;

        function isSessionInProgress() {
            if (isRunning) return true;
            if (mode === 'countdown') return remainingMs > 0 && remainingMs < initialMs;
            return elapsedMs > 0;
        }

        function setRunningUIState(running) {
            document.getElementById('startBtnIcon').innerText = running ? '⏸' : '▶';
            document.getElementById('startBtnText').innerText = running ? 'Pause' : 'Start';
            const modeBtn = document.getElementById('modeNavBtn');
            const locked = isSessionInProgress();
            modeBtn.disabled = locked;
            modeBtn.title = locked
                ? 'Reset timer to switch mode'
                : 'Toggle Timer Mode (Count Down / Count Up)';
        }

        /* Lazy Web Audio Synthesizer & Silent Audio Keep-Alive */
        let audioCtx = null;
        let keepAliveOsc = null;
        let keepAliveGain = null;
        let isStartingKeepAlive = false;

        function handleAudioStateChange() {
            if (audioCtx && audioCtx.state === 'running' && isRunning && soundEnabled && !keepAliveOsc) {
                startKeepAlive();
            }
        }

        function getAudioCtx() {
            if (!audioCtx || audioCtx.state === 'closed') {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) return null;
                audioCtx = new AudioContextClass();
                if (typeof audioCtx.addEventListener === 'function') {
                    audioCtx.addEventListener('statechange', handleAudioStateChange);
                } else {
                    audioCtx.onstatechange = handleAudioStateChange;
                }
            }
            return audioCtx;
        }

        function unlockAudio() {
            const ctx = getAudioCtx();
            if (!ctx) return;
            if (ctx.state !== 'running') {
                ctx.resume().catch(() => {});
            }
            if (ctx.state === 'running') {
                window.removeEventListener('pointerdown', unlockAudio);
                window.removeEventListener('keydown', unlockAudio);
            }
        }
        window.addEventListener('pointerdown', unlockAudio);
        window.addEventListener('keydown', unlockAudio);

        // Generates an inaudible 18.5kHz carrier wave to prevent HDMI/Bluetooth/PA hardware gates from sleeping
        async function startKeepAlive() {
            if (!soundEnabled || keepAliveOsc || isStartingKeepAlive) return;
            const ctx = getAudioCtx();
            if (!ctx) return;
            isStartingKeepAlive = true;
            try {
                if (ctx.state !== 'running') {
                    await ctx.resume();
                }
                if (!isRunning || !soundEnabled || keepAliveOsc) return;

                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(18500, now);
                gain.gain.setValueAtTime(0.00001, now);
                gain.gain.exponentialRampToValueAtTime(0.002, now + 0.05);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.onended = () => {
                    try { osc.disconnect(); gain.disconnect(); } catch (e) {}
                };
                osc.start(now);

                keepAliveOsc = osc;
                keepAliveGain = gain;
            } catch (e) {
            } finally {
                isStartingKeepAlive = false;
            }
        }

        function stopKeepAlive() {
            if (keepAliveOsc) {
                const osc = keepAliveOsc;
                const gain = keepAliveGain;
                const ctx = audioCtx;
                keepAliveOsc = null;
                keepAliveGain = null;
                try {
                    const now = ctx ? ctx.currentTime : 0;
                    gain.gain.cancelScheduledValues(now);
                    gain.gain.setTargetAtTime(0.00001, now, 0.01);
                    osc.stop(now + 0.05);
                } catch (e) {
                    try { osc.stop(); osc.disconnect(); gain.disconnect(); } catch (err) {}
                }
            }
        }

        async function playLoudChime() {
            stopKeepAlive();
            if (!soundEnabled) return;
            const ctx = getAudioCtx();
            if (!ctx) return;
            try {
                if (ctx.state !== 'running') {
                    await ctx.resume();
                }
                const now = ctx.currentTime + 0.02;
                
                const chimePattern = [
                    { time: 0.0, freqs: [659.25, 830.61] },
                    { time: 0.3, freqs: [830.61, 987.77] },
                    { time: 0.6, freqs: [987.77, 1318.51] },
                    { time: 1.2, freqs: [659.25, 830.61, 1318.51] },
                    { time: 1.8, freqs: [830.61, 987.77, 1318.51] }
                ];

                chimePattern.forEach(note => {
                    note.freqs.forEach(freq => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + note.time);
                        
                        gain.gain.setValueAtTime(0, now + note.time);
                        gain.gain.linearRampToValueAtTime(0.4, now + note.time + 0.04);
                        gain.gain.exponentialRampToValueAtTime(0.0001, now + note.time + 0.9);
                        
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        
                        osc.start(now + note.time);
                        osc.stop(now + note.time + 0.9);
                    });
                });
            } catch(e) {}
        }

        function triggerFlashingAlert() {
            isAlertFlashing = true;
            document.getElementById('timerCard').classList.add('flashing-alert');
            updateDisplay(true);
        }

        function clearFlashingAlert() {
            if (isAlertFlashing) {
                alertDismissedAt = Date.now();
            }
            isAlertFlashing = false;
            document.getElementById('timerCard').classList.remove('flashing-alert');
            updateDisplay(true);
        }

        function handleCardClick() {
            if (isAlertFlashing) {
                clearFlashingAlert();
            } else if (Date.now() - alertDismissedAt > 400) {
                toggleFocusMode();
            }
        }

        function formatTime(totalSec) {
            const hrs = Math.floor(totalSec / 3600);
            const mins = Math.floor((totalSec % 3600) / 60);
            const secs = totalSec % 60;

            const pad = (num) => String(num).padStart(2, '0');
            if (hrs > 0) return `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
            return `${pad(mins)}:${pad(secs)}`;
        }

        function setRingOffsetImmediate(offset) {
            ringPath.style.transition = 'stroke 0.4s ease';
            ringPath.style.strokeDashoffset = isNaN(offset) ? 0 : offset;
            requestAnimationFrame(() => {
                ringPath.style.transition = '';
            });
        }

        function updateDisplay(force = false) {
            const timeDisplay = document.getElementById('timeDisplay');

            if (mode === 'countdown') {
                const progress = initialMs > 0 ? (remainingMs / initialMs) : 0;
                const offset = circumference - (progress * circumference);
                if (force) {
                    setRingOffsetImmediate(offset);
                } else {
                    ringPath.style.strokeDashoffset = isNaN(offset) ? 0 : offset;
                }

                const displaySecs = Math.ceil(remainingMs / 1000);
                if (!force && displaySecs === lastRenderedSec) return;
                lastRenderedSec = displaySecs;

                const formatted = formatTime(displaySecs);
                timeDisplay.innerText = formatted;
                timeDisplay.classList.toggle('has-hours', displaySecs >= 3600);
                
                if (isAlertFlashing) {
                    document.title = "00:00 Time's Up! - Timer";
                } else if (isRunning) {
                    document.title = `${formatted} - Timer`;
                } else if (remainingMs < initialMs && remainingMs > 0) {
                    document.title = `${formatted} (Paused) - Timer`;
                } else {
                    document.title = "Timer";
                }
                
                if (remainingMs <= 0 && initialMs > 0) {
                    ringPath.style.stroke = 'var(--accent-red)';
                } else if (displaySecs <= 15) {
                    ringPath.style.stroke = 'var(--accent-red)';
                } else if (displaySecs <= 60) {
                    ringPath.style.stroke = 'var(--accent-orange)';
                } else {
                    ringPath.style.stroke = 'var(--accent-blue)';
                }
            } else {
                const spinProgress = ((elapsedMs / 1000) % 60) / 60;
                const offset = circumference - (spinProgress * circumference);
                if (force) {
                    setRingOffsetImmediate(offset);
                } else {
                    ringPath.style.strokeDashoffset = offset;
                }

                const displaySecs = Math.floor(elapsedMs / 1000);
                if (!force && displaySecs === lastRenderedSec) return;
                lastRenderedSec = displaySecs;

                const formatted = formatTime(displaySecs);
                timeDisplay.innerText = formatted;
                timeDisplay.classList.toggle('has-hours', displaySecs >= 3600);
                
                if (isRunning) {
                    document.title = `${formatted} (Up) - Timer`;
                } else if (elapsedMs > 0) {
                    document.title = `${formatted} (Paused) - Timer`;
                } else {
                    document.title = "Timer";
                }
                
                ringPath.style.stroke = 'var(--accent-green)';
            }
        }

        function startTicker() {
            initTickerWorker();
            if (tickerWorker) {
                tickerWorker.postMessage('start');
            } else {
                clearInterval(fallbackInterval);
                fallbackInterval = setInterval(syncTimer, 200);
            }
        }

        function stopTicker() {
            if (tickerWorker) {
                tickerWorker.postMessage('stop');
            }
            clearInterval(fallbackInterval);
            fallbackInterval = null;
        }

        function syncTimer() {
            if (!isRunning) return;
            const now = Date.now();

            const ctx = getAudioCtx();
            if (soundEnabled && ctx && ctx.state !== 'running') {
                ctx.resume().catch(() => {});
            }

            if (mode === 'countdown') {
                remainingMs = Math.max(0, targetTimestamp - now);
                updateDisplay();

                if (remainingMs <= 0) {
                    isRunning = false;
                    stopTicker();
                    releaseWakeLock();
                    setRunningUIState(false);
                    playLoudChime();
                    triggerFlashingAlert();
                }
            } else {
                elapsedMs = Math.max(0, now - targetTimestamp);
                updateDisplay();
            }
        }

        function toggleTimer() {
            if (document.activeElement) document.activeElement.blur();
            const ctx = getAudioCtx();
            if (ctx && ctx.state !== 'running') { ctx.resume().catch(() => {}); }
            if (isAlertFlashing) clearFlashingAlert();

            if (isRunning) {
                pauseTimer();
            } else {
                if (mode === 'countdown' && remainingMs <= 0) {
                    remainingMs = initialMs;
                }
                startTimer();
            }
        }

        function startTimer() {
            if (mode === 'countdown' && remainingMs <= 0) return;
            
            clearFlashingAlert();
            isRunning = true;
            setRunningUIState(true);

            if (mode === 'countdown') {
                targetTimestamp = Date.now() + remainingMs;
            } else {
                targetTimestamp = Date.now() - elapsedMs;
            }
            
            startKeepAlive();
            requestWakeLock();
            startTicker();
            updateDisplay(true);
        }

        function pauseTimer() {
            if (isRunning) {
                const now = Date.now();
                if (mode === 'countdown') {
                    remainingMs = Math.max(0, targetTimestamp - now);
                } else {
                    elapsedMs = Math.max(0, now - targetTimestamp);
                }
            }
            isRunning = false;
            stopTicker();
            stopKeepAlive();
            releaseWakeLock();
            setRunningUIState(false);
            updateDisplay(true);
        }

        function resetTimer() {
            if (document.activeElement) document.activeElement.blur();
            clearFlashingAlert();
            isRunning = false;
            stopTicker();
            stopKeepAlive();
            releaseWakeLock();
            remainingMs = initialMs;
            elapsedMs = 0;
            targetTimestamp = null;
            setRunningUIState(false);
            updateDisplay(true);
        }

        // Instant sync, wake-lock re-acquisition & background canvas resume on tab focus return
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                if (!blobRafId) {
                    blobRafId = requestAnimationFrame(animateBlobs);
                }
                if (isRunning) {
                    syncTimer();
                    requestWakeLock();
                }
            }
        });

        function toggleSound() {
            if (document.activeElement) document.activeElement.blur();
            soundEnabled = !soundEnabled;
            if (!soundEnabled) {
                stopKeepAlive();
            } else if (isRunning) {
                startKeepAlive();
            }
            const iconPath = soundEnabled 
                ? 'M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z'
                : 'M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z';
            document.getElementById('soundIcon').innerHTML = `<path d="${iconPath}"/>`;
        }

        function toggleMode() {
            if (document.activeElement) document.activeElement.blur();
            if (isSessionInProgress()) return;
            const nextMode = mode === 'countdown' ? 'countup' : 'countdown';
            switchMode(nextMode);
        }

        function switchMode(newMode) {
            mode = newMode;
            clearFlashingAlert();
            pauseTimer();
            
            document.getElementById('modeDisplay').innerText = mode === 'countdown' ? 'Count Down' : 'Count Up';
            
            const setElements = [
                document.getElementById('dockSetDivider'),
                document.getElementById('dockSetBtn')
            ];
            
            setElements.forEach(el => {
                if (el) {
                    if (mode === 'countdown') el.classList.remove('hidden');
                    else el.classList.add('hidden');
                }
            });

            resetTimer();
        }

        function toggleFocusMode() {
            isFocusMode = !isFocusMode;
            const elements = [
                document.getElementById('appHeader'),
                document.getElementById('dockActions')
            ];

            elements.forEach(el => {
                if (el) {
                    if (isFocusMode) el.classList.add('hidden-ui');
                    else el.classList.remove('hidden-ui');
                }
            });
        }

        /* Modal Dialog Controls & Input Sanitization (iOS Safari Touch-Safe) */
        const timeInputs = Array.from(document.querySelectorAll('.modal-time-input'));
        timeInputs.forEach((inp, idx) => {
            inp.addEventListener('focus', () => {
                setTimeout(() => {
                    try { inp.setSelectionRange(0, inp.value.length); } catch (e) {}
                }, 0);
            });
            inp.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && inp.value.length === 0 && idx > 0) {
                    e.preventDefault();
                    const prev = timeInputs[idx - 1];
                    prev.focus();
                    setTimeout(() => {
                        try { prev.setSelectionRange(0, prev.value.length); } catch (err) {}
                    }, 0);
                }
            });
            inp.addEventListener('input', () => {
                const digits = inp.value.replace(/\D/g, '').slice(0, 2);
                if (inp.value !== digits) inp.value = digits;
                if (digits.length === 2 && idx < timeInputs.length - 1) {
                    const next = timeInputs[idx + 1];
                    next.focus();
                    setTimeout(() => {
                        try { next.setSelectionRange(0, next.value.length); } catch (e) {}
                    }, 0);
                }
            });
            inp.addEventListener('blur', () => {
                const max = Number(inp.dataset.max) || 59;
                const val = Math.min(max, Math.max(0, Math.floor(Number(inp.value) || 0)));
                inp.value = String(val).padStart(2, '0');
            });
        });

        function openSetModal() {
            if (document.activeElement) document.activeElement.blur();
            clearFlashingAlert();
            pauseTimer();
            
            const totalInitialSecs = Math.round(initialMs / 1000);
            const hrs = Math.floor(totalInitialSecs / 3600);
            const mins = Math.floor((totalInitialSecs % 3600) / 60);
            const secs = totalInitialSecs % 60;
            
            document.getElementById('inputHours').value = String(hrs).padStart(2, '0');
            document.getElementById('inputMins').value = String(mins).padStart(2, '0');
            document.getElementById('inputSecs').value = String(secs).padStart(2, '0');
            
            document.getElementById('modalOverlay').style.display = 'flex';
            const minInput = document.getElementById('inputMins');
            requestAnimationFrame(() => {
                minInput.focus();
                setTimeout(() => {
                    try { minInput.setSelectionRange(0, minInput.value.length); } catch (e) {}
                }, 0);
            });
        }

        function closeSetModal() {
            if (document.activeElement) document.activeElement.blur();
            document.getElementById('modalOverlay').style.display = 'none';
        }

        function applyQuickPreset(sec) {
            initialMs = sec * 1000;
            if (mode !== 'countdown') switchMode('countdown');
            else resetTimer();
            closeSetModal();
        }

        function applySetTime() {
            const hrs = Math.min(99, Math.max(0, Math.floor(Number(document.getElementById('inputHours').value) || 0)));
            const mins = Math.min(59, Math.max(0, Math.floor(Number(document.getElementById('inputMins').value) || 0)));
            const secs = Math.min(59, Math.max(0, Math.floor(Number(document.getElementById('inputSecs').value) || 0)));

            document.getElementById('inputHours').value = String(hrs).padStart(2, '0');
            document.getElementById('inputMins').value = String(mins).padStart(2, '0');
            document.getElementById('inputSecs').value = String(secs).padStart(2, '0');

            const total = (hrs * 3600) + (mins * 60) + secs;
            if (total <= 0) {
                timeInputs.forEach(inp => {
                    inp.classList.remove('input-error');
                    void inp.offsetWidth;
                    inp.classList.add('input-error');
                });
                return;
            }

            initialMs = total * 1000;
            if (mode !== 'countdown') switchMode('countdown');
            else resetTimer();
            closeSetModal();
        }

        // Keyboard shortcuts: Modal Enter/Escape & Global Spacebar Start/Pause
        document.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            const modalOpen = document.getElementById('modalOverlay').style.display === 'flex';
            if (modalOpen) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    applySetTime();
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    closeSetModal();
                }
            } else if (e.code === 'Space') {
                e.preventDefault();
                if (isAlertFlashing) {
                    clearFlashingAlert();
                } else {
                    toggleTimer();
                }
            }
        });

        // Initialize
        updateDisplay(true);
    </script>
</body>
