<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Timer</title>
    <style>
        /* Liquid Glass Design System Tokens */
        :root {
            /* High Transparency Glass Fills */
            --glass-bg-primary: rgba(255, 255, 255, 0.08);
            --glass-bg-card: rgba(255, 255, 255, 0.06);
            --glass-bg-hover: rgba(255, 255, 255, 0.18);
            --glass-bg-input: rgba(255, 255, 255, 0.12);
            
            /* Glass Border Highlights */
            --glass-border-light: rgba(255, 255, 255, 0.18);
            --glass-border-strong: rgba(255, 255, 255, 0.3);
            
            /* Depth Shadows */
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --glass-shadow-sm: 0 4px 16px 0 rgba(0, 0, 0, 0.25);
            
            /* Typography & System Colors */
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.85);
            --text-muted: rgba(255, 255, 255, 0.65);
            --accent-blue: #0a84ff;
            --accent-green: #30d158;
            --accent-orange: #ff9f0a;
            --accent-red: #ff453a;
            
            /* System Border Radius */
            --radius-container: 20px;
            --radius-element: 12px;
            --radius-full: 9999px;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: fixed;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1f1c2c;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        /* Fixed Mobile Safari Compatibility Background */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #1f1c2c 0%, #928dab 50%, #2c3e50 100%);
            z-index: -2;
            pointer-events: none;
            transform: translateZ(0);
        }

        /* Ambient Dynamic Background Canvas */
        #liquidCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            filter: blur(40px);
            opacity: 0.75;
            transform: translateZ(0);
        }

        /* Glass Header Container */
        header {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%) translateZ(0);
            width: calc(100% - 32px);
            max-width: 760px;
            height: 64px;
            background: var(--glass-bg-primary);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border-light);
            border-radius: var(--radius-container);
            box-shadow: var(--glass-shadow-sm);
            z-index: 900;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            transition: all 0.3s ease;
        }

        header.hidden-ui {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -20px) translateZ(0);
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            letter-spacing: -0.3px;
        }

        .top-nav { 
            display: flex; 
            gap: 8px; 
            align-items: center; 
        }

        /* Glass Nav Icon Button Component */
        .icon-nav-btn {
            background: var(--glass-bg-primary);
            border: 1px solid var(--glass-border-light);
            color: var(--text-main);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: var(--radius-element);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transform: translateZ(0);
            transition: all 0.2s ease;
            outline: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .icon-nav-btn:hover {
            background: var(--glass-bg-hover);
            border-color: var(--glass-border-strong);
        }

        .icon-nav-btn:active {
            transform: scale(0.95) translateZ(0);
        }

        .icon-nav-btn svg { width: 18px; height: 18px; fill: currentColor; }

        /* Timer Main Card Container */
        .container {
            width: calc(100% - 32px);
            max-width: 580px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .timer-card {
            width: 100%;
            background: var(--glass-bg-card);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border-light);
            border-radius: var(--radius-container);
            box-shadow: var(--glass-shadow);
            padding: clamp(24px, 5vh, 45px) 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transform: translateZ(0);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .timer-card:hover {
            background: var(--glass-bg-hover);
            border-color: var(--glass-border-strong);
        }

        /* Continuous Flashing Glass Alert */
        .timer-card.flashing-alert {
            animation: glassPulse 0.8s infinite alternate ease-in-out;
        }

        @keyframes glassPulse {
            0% {
                background: rgba(255, 69, 58, 0.28);
                border-color: rgba(255, 69, 58, 0.8);
                box-shadow: 0 0 30px rgba(255, 69, 58, 0.4);
            }
            100% {
                background: rgba(255, 159, 10, 0.32);
                border-color: rgba(255, 159, 10, 0.9);
                box-shadow: 0 0 40px rgba(255, 159, 10, 0.5);
            }
        }

        .timer-ring-wrapper {
            position: relative;
            width: clamp(210px, 32vh, 280px);
            height: clamp(210px, 32vh, 280px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .progress-ring {
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            width: 100%; height: 100%;
        }

        .progress-ring-bg { stroke: rgba(255, 255, 255, 0.1); stroke-width: 8; }
        .progress-ring-path {
            stroke: var(--accent-blue);
            stroke-width: 8;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.3s linear, stroke 0.4s ease;
        }

        .digital-display {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .time-text {
            font-size: clamp(48px, 8vh, 66px);
            font-weight: 700;
            letter-spacing: -1.5px;
            color: var(--text-main);
            font-variant-numeric: tabular-nums;
            line-height: 1;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .mode-label-text {
            margin-top: 8px;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        /* Center Dock Component */
        .bottom-dock {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateZ(0);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--glass-bg-primary);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 4px 12px;
            height: 38px;
            border-radius: var(--radius-full);
            border: 1px solid var(--glass-border-light);
            box-shadow: var(--glass-shadow);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .bottom-dock.hidden-ui {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, 20px) translateZ(0);
        }

        .dock-btn {
            background: transparent;
            color: var(--text-main);
            border: 1px solid transparent;
            padding: 6px 14px;
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
            user-select: none;
            outline: none;
        }

        .dock-btn:hover {
            background: var(--glass-bg-hover);
            border-color: var(--glass-border-light);
        }

        .dock-btn:active {
            transform: scale(0.95);
        }

        .dock-btn.primary {
            background: rgba(10, 132, 255, 0.25);
            border-color: rgba(10, 132, 255, 0.4);
            color: #ffffff;
        }

        .dock-btn.primary:hover {
            background: rgba(10, 132, 255, 0.4);
            border-color: rgba(10, 132, 255, 0.6);
        }

        .dock-divider {
            width: 1px;
            height: 18px;
            background: var(--glass-border-light);
            margin: 0 2px;
        }

        /* Glass Modal Component */
        #modalOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .action-modal {
            background: rgba(20, 20, 30, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 24px;
            border-radius: var(--radius-container);
            text-align: center;
            border: 1px solid var(--glass-border-light);
            box-shadow: var(--glass-shadow);
            width: 320px;
            max-width: calc(100vw - 32px);
            animation: modalPopCenter 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes modalPopCenter {
            from { opacity: 0; transform: scale(0.94) translateY(8px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .action-modal p {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 14px;
        }

        /* Preset Pills Grid */
        .preset-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 16px;
        }

        .preset-pill {
            background: var(--glass-bg-primary);
            border: 1px solid var(--glass-border-light);
            padding: 8px 0;
            border-radius: var(--radius-element);
            font-weight: 600;
            font-size: 13px;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .preset-pill:hover {
            background: var(--glass-bg-hover);
            border-color: var(--glass-border-strong);
            color: var(--accent-blue);
        }

        .time-inputs {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
            margin-bottom: 18px;
        }

        .time-field-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .time-field-group span {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .modal-time-input {
            width: 64px;
            padding: 8px 4px;
            border-radius: var(--radius-element);
            border: 1px solid var(--glass-border-light);
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            background: var(--glass-bg-input);
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
            font-variant-numeric: tabular-nums;
        }

        .modal-time-input:focus {
            border-color: var(--glass-border-strong);
            background: rgba(255, 255, 255, 0.2);
        }

        .glass-btn-full {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border-radius: var(--radius-element);
            background: rgba(10, 132, 255, 0.25);
            border: 1px solid rgba(10, 132, 255, 0.4);
            color: #ffffff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .glass-btn-full:hover {
            background: rgba(10, 132, 255, 0.4);
            border-color: rgba(10, 132, 255, 0.6);
        }

        .glass-btn-cancel {
            width: 100%;
            padding: 10px;
            font-size: 13.5px;
            border-radius: var(--radius-element);
            background: var(--glass-bg-primary);
            border: 1px solid var(--glass-border-light);
            color: var(--text-main);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .glass-btn-cancel:hover {
            background: var(--glass-bg-hover);
            border-color: var(--glass-border-strong);
        }

        .hidden { display: none !important; }

        #appVersion { 
            position: fixed; 
            right: 12px; 
            bottom: 4px; 
            font-size: 10px; 
            font-weight: 500; 
            color: var(--text-muted); 
            pointer-events: none; 
            z-index: 2000; 
        }

        @media (max-width: 600px) {
            header { width: calc(100% - 24px); padding: 0 14px; top: 12px; }
            header h1 { font-size: 18px; }
            .icon-nav-btn { padding: 6px 10px; }
            .bottom-dock { bottom: 16px; }
        }
    </style>
</head>
<body>

    <!-- Ambient Dynamic Background Canvas -->
    <canvas id="liquidCanvas"></canvas>

    <!-- Glass Header Wrapper -->
    <header id="appHeader">
        <h1>Timer</h1>
        <nav class="top-nav">
            <button class="icon-nav-btn" id="modeNavBtn" onclick="toggleMode()" title="Toggle Timer Mode (Count Down / Count Up)">
                <svg viewBox="0 0 24 24"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg>
            </button>
            <button class="icon-nav-btn" id="soundToggleBtn" onclick="toggleSound()" title="Toggle Mute Sound">
                <svg id="soundIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </button>
        </nav>
    </header>

    <div class="container">
        <div class="timer-card" id="timerCard" onclick="handleCardClick()" title="Click to toggle Focus Mode or clear alert">
            <div class="timer-ring-wrapper">
                <svg class="progress-ring" viewBox="0 0 120 120">
                    <circle class="progress-ring-bg" cx="60" cy="60" r="52" fill="transparent" />
                    <circle id="progressRingPath" class="progress-ring-path" cx="60" cy="60" r="52" fill="transparent" />
                </svg>
                <div class="digital-display">
                    <div id="timeDisplay" class="time-text">05:00</div>
                    <div id="modeDisplay" class="mode-label-text">Count Down</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Center Floating Glass Dock -->
    <div id="dockActions" class="bottom-dock">
        <button id="startBtn" class="dock-btn primary" onclick="toggleTimer()">
            ▶ <span id="startBtnText">Start</span>
        </button>
        <button class="dock-btn" onclick="resetTimer()">Reset</button>
        <div class="dock-divider" id="dockSetDivider"></div>
        <button class="dock-btn" id="dockSetBtn" onclick="openSetModal()">Set</button>
    </div>

    <div id="appVersion">v3.1 | Liquid Glass</div>

    <!-- Set Time Glass Modal -->
    <div id="modalOverlay" onclick="closeSetModal()">
        <div class="action-modal" onclick="event.stopPropagation()">
            <p>Set Countdown Time</p>
            
            <div class="preset-grid">
                <div class="preset-pill" onclick="applyQuickPreset(60)">1m</div>
                <div class="preset-pill" onclick="applyQuickPreset(120)">2m</div>
                <div class="preset-pill" onclick="applyQuickPreset(300)">5m</div>
                <div class="preset-pill" onclick="applyQuickPreset(600)">10m</div>
                <div class="preset-pill" onclick="applyQuickPreset(900)">15m</div>
                <div class="preset-pill" onclick="applyQuickPreset(1800)">30m</div>
            </div>

            <div class="time-inputs">
                <div class="time-field-group">
                    <input type="number" id="inputHours" class="modal-time-input" min="0" max="23" placeholder="00" value="00">
                    <span>HRS</span>
                </div>
                <span style="font-weight: 700; font-size: 16px; color: var(--text-muted); margin-top: 4px;">:</span>
                <div class="time-field-group">
                    <input type="number" id="inputMins" class="modal-time-input" min="0" max="59" placeholder="05" value="05">
                    <span>MIN</span>
                </div>
                <span style="font-weight: 700; font-size: 16px; color: var(--text-muted); margin-top: 4px;">:</span>
                <div class="time-field-group">
                    <input type="number" id="inputSecs" class="modal-time-input" min="0" max="59" placeholder="00" value="00">
                    <span>SEC</span>
                </div>
            </div>

            <div style="display:flex; flex-direction:column; gap:8px;">
                <button class="glass-btn-full" onclick="applySetTime()">Set Duration</button>
                <button class="glass-btn-cancel" onclick="closeSetModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        /* Ambient Dynamic Background Canvas Engine */
        const canvas = document.getElementById('liquidCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, dpr;
        
        function resizeCanvas() {
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
        }
        
        window.addEventListener('resize', () => {
            if (canvas.width !== window.innerWidth * (window.devicePixelRatio || 1)) {
                resizeCanvas();
            }
        });
        resizeCanvas();

        const blobs = [
            { x: 0.2, y: 0.3, r: 0.45, color: 'rgba(100, 140, 255, 0.6)', vx: 0.0005, vy: 0.0004 },
            { x: 0.8, y: 0.2, r: 0.5, color: 'rgba(180, 100, 255, 0.55)', vx: -0.0004, vy: 0.0005 },
            { x: 0.5, y: 0.8, r: 0.4, color: 'rgba(255, 120, 180, 0.5)', vx: 0.0003, vy: -0.0004 }
        ];

        function animateBlobs() {
            ctx.clearRect(0, 0, width, height);
            blobs.forEach(b => {
                b.x += b.vx; b.y += b.vy;
                if (b.x < 0 || b.x > 1) b.vx *= -1;
                if (b.y < 0 || b.y > 1) b.vy *= -1;

                const grad = ctx.createRadialGradient(
                    b.x * width, b.y * height, 0,
                    b.x * width, b.y * height, b.r * Math.max(width, height)
                );
                grad.addColorStop(0, b.color);
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(b.x * width, b.y * height, b.r * Math.max(width, height), 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(animateBlobs);
        }
        animateBlobs();

        /* Timer Logic Engine */
        let mode = 'countdown'; 
        let initialSeconds = 300; 
        let remainingSeconds = 300;
        let countUpSeconds = 0;
        let isRunning = false;
        let timerInterval = null;
        let soundEnabled = true;
        let isFocusMode = false;
        let isAlertFlashing = false;

        const ringPath = document.getElementById('progressRingPath');
        const ringRadius = 52;
        const circumference = 2 * Math.PI * ringRadius;
        ringPath.style.strokeDasharray = `${circumference} ${circumference}`;

        /* Web Audio Synthesizer */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playLoudChime() {
            if (!soundEnabled) return;
            try {
                if (audioCtx.state === 'suspended') { audioCtx.resume(); }
                const now = audioCtx.currentTime;
                
                const chimePattern = [
                    { time: 0.0, freqs: [659.25, 830.61] },
                    { time: 0.3, freqs: [830.61, 987.77] },
                    { time: 0.6, freqs: [987.77, 1318.51] },
                    { time: 1.2, freqs: [659.25, 830.61, 1318.51] },
                    { time: 1.8, freqs: [830.61, 987.77, 1318.51] }
                ];

                chimePattern.forEach(note => {
                    note.freqs.forEach(freq => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + note.time);
                        
                        gain.gain.setValueAtTime(0, now + note.time);
                        gain.gain.linearRampToValueAtTime(0.4, now + note.time + 0.04);
                        gain.gain.exponentialRampToValueAtTime(0.0001, now + note.time + 0.9);
                        
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        
                        osc.start(now + note.time);
                        osc.stop(now + note.time + 0.9);
                    });
                });
            } catch(e) {}
        }

        function triggerFlashingAlert() {
            isAlertFlashing = true;
            document.getElementById('timerCard').classList.add('flashing-alert');
        }

        function clearFlashingAlert() {
            isAlertFlashing = false;
            document.getElementById('timerCard').classList.remove('flashing-alert');
        }

        function handleCardClick() {
            if (isAlertFlashing) {
                clearFlashingAlert();
            } else {
                toggleFocusMode();
            }
        }

        function formatTime(totalSec) {
            const hrs = Math.floor(totalSec / 3600);
            const mins = Math.floor((totalSec % 3600) / 60);
            const secs = totalSec % 60;

            const pad = (num) => String(num).padStart(2, '0');
            if (hrs > 0) return `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
            return `${pad(mins)}:${pad(secs)}`;
        }

        function updateDisplay() {
            const timeDisplay = document.getElementById('timeDisplay');

            if (mode === 'countdown') {
                timeDisplay.innerText = formatTime(remainingSeconds);
                const progress = remainingSeconds / initialSeconds;
                const offset = circumference - (progress * circumference);
                ringPath.style.strokeDashoffset = isNaN(offset) ? 0 : offset;
                
                if (remainingSeconds === 0 && initialSeconds > 0) {
                    ringPath.style.stroke = 'var(--accent-red)';
                } else if (remainingSeconds <= 15) {
                    ringPath.style.stroke = 'var(--accent-red)';
                } else if (remainingSeconds <= 60) {
                    ringPath.style.stroke = 'var(--accent-orange)';
                } else {
                    ringPath.style.stroke = 'var(--accent-blue)';
                }
            } else {
                timeDisplay.innerText = formatTime(countUpSeconds);
                const spinProgress = (countUpSeconds % 60) / 60;
                ringPath.style.strokeDashoffset = circumference - (spinProgress * circumference);
                ringPath.style.stroke = 'var(--accent-green)';
            }
        }

        function toggleTimer() {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            if (isAlertFlashing) clearFlashingAlert();

            if (isRunning) pauseTimer();
            else startTimer();
        }

        function startTimer() {
            if (mode === 'countdown' && remainingSeconds <= 0) return;
            
            clearFlashingAlert();
            isRunning = true;
            document.getElementById('startBtnText').innerText = "Pause";
            
            timerInterval = setInterval(() => {
                if (mode === 'countdown') {
                    if (remainingSeconds > 0) {
                        remainingSeconds--;
                        updateDisplay();
                        if (remainingSeconds === 0) {
                            pauseTimer();
                            playLoudChime();
                            triggerFlashingAlert();
                        }
                    }
                } else {
                    countUpSeconds++;
                    updateDisplay();
                }
            }, 1000);
            
            updateDisplay();
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            document.getElementById('startBtnText').innerText = "Start";
            updateDisplay();
        }

        function resetTimer() {
            clearFlashingAlert();
            pauseTimer();
            remainingSeconds = initialSeconds;
            countUpSeconds = 0;
            updateDisplay();
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const iconPath = soundEnabled 
                ? 'M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z'
                : 'M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z';
            document.getElementById('soundIcon').innerHTML = `<path d="${iconPath}"/>`;
        }

        function toggleMode() {
            const nextMode = mode === 'countdown' ? 'countup' : 'countdown';
            switchMode(nextMode);
        }

        function switchMode(newMode) {
            mode = newMode;
            clearFlashingAlert();
            pauseTimer();
            
            document.getElementById('modeDisplay').innerText = mode === 'countdown' ? 'Count Down' : 'Count Up';
            
            const setElements = [
                document.getElementById('dockSetDivider'),
                document.getElementById('dockSetBtn')
            ];
            
            setElements.forEach(el => {
                if (el) {
                    if (mode === 'countdown') el.classList.remove('hidden');
                    else el.classList.add('hidden');
                }
            });

            resetTimer();
        }

        function toggleFocusMode() {
            isFocusMode = !isFocusMode;
            const elements = [
                document.getElementById('appHeader'),
                document.getElementById('dockActions')
            ];

            elements.forEach(el => {
                if (el) {
                    if (isFocusMode) el.classList.add('hidden-ui');
                    else el.classList.remove('hidden-ui');
                }
            });
        }

        /* Modal Dialog Controls */
        function openSetModal() {
            clearFlashingAlert();
            pauseTimer();
            
            const hrs = Math.floor(initialSeconds / 3600);
            const mins = Math.floor((initialSeconds % 3600) / 60);
            const secs = initialSeconds % 60;
            
            document.getElementById('inputHours').value = String(hrs).padStart(2, '0');
            document.getElementById('inputMins').value = String(mins).padStart(2, '0');
            document.getElementById('inputSecs').value = String(secs).padStart(2, '0');
            
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function closeSetModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }

        function applyQuickPreset(sec) {
            initialSeconds = sec;
            if (mode !== 'countdown') switchMode('countdown');
            else resetTimer();
            closeSetModal();
        }

        function applySetTime() {
            const hrs = parseInt(document.getElementById('inputHours').value) || 0;
            const mins = parseInt(document.getElementById('inputMins').value) || 0;
            const secs = parseInt(document.getElementById('inputSecs').value) || 0;

            const total = (hrs * 3600) + (mins * 60) + secs;
            if (total > 0) {
                initialSeconds = total;
                if (mode !== 'countdown') switchMode('countdown');
                else resetTimer();
            }
            closeSetModal();
        }

        // Initialize
        updateDisplay();
    </script>
</body>
</html>
