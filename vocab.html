<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vocab</title>
    <style>
        /* Liquid Glass Design System Tokens */
        :root {
            /* High Transparency Glass Fills */
            --glass-bg-primary: rgba(255, 255, 255, 0.08);
            --glass-bg-card: rgba(255, 255, 255, 0.06);
            --glass-bg-hover: rgba(255, 255, 255, 0.18);
            --glass-bg-input: rgba(255, 255, 255, 0.12);
            
            /* Glass Border Highlights */
            --glass-border-light: rgba(255, 255, 255, 0.18);
            --glass-border-strong: rgba(255, 255, 255, 0.3);
            
            /* Depth Shadows */
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --glass-shadow-sm: 0 4px 16px 0 rgba(0, 0, 0, 0.25);
            
            /* Typography & System Colors */
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.85);
            --text-muted: rgba(255, 255, 255, 0.65);
            --accent-blue: #0a84ff;
            --accent-green: #30d158;
            --accent-red: #ff453a;
            
            /* System Border Radius */
            --radius-container: 20px;
            --radius-element: 12px;
            --radius-full: 9999px;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1f1c2c;
            color: var(--text-main);
            min-height: 100vh;
            padding: 100px 20px 120px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        /* Fixed Mobile Safari Compatibility Background */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #1f1c2c 0%, #928dab 50%, #2c3e50 100%);
            z-index: -2;
            pointer-events: none;
            transform: translateZ(0);
        }

        /* Ambient Dynamic Background Canvas */
        #liquidCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            filter: blur(40px);
            opacity: 0.75;
            transform: translateZ(0);
        }

        /* Glass Header Container */
        header {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%) translateZ(0);
            width: calc(100% - 32px);
            max-width: 760px;
            height: 64px;
            background: var(--glass-bg-primary);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border-light);
            border-radius: var(--radius-container);
            box-shadow: var(--glass-shadow-sm);
            z-index: 900;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            letter-spacing: -0.3px;
        }

        .top-nav { 
            display: flex; 
            gap: 8px; 
            align-items: center; 
        }

        /* Glass Button Components */
        .glass-btn {
            background: var(--glass-bg-primary);
            border: 1px solid var(--glass-border-light);
            color: var(--text-main);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 14px;
            border-radius: var(--radius-element);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transform: translateZ(0);
            transition: all 0.2s ease;
            outline: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
            user-select: none;
        }

        .glass-btn:hover {
            background: var(--glass-bg-hover);
            border-color: var(--glass-border-strong);
        }

        .glass-btn:active {
            transform: scale(0.96) translateZ(0);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .glass-btn.btn-full {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            border-radius: var(--radius-element);
        }

        .glass-btn.primary {
            background: rgba(10, 132, 255, 0.25);
            border-color: rgba(10, 132, 255, 0.4);
            color: #ffffff;
        }

        .glass-btn.primary:hover {
            background: rgba(10, 132, 255, 0.4);
            border-color: rgba(10, 132, 255, 0.6);
        }

        /* Main Container Views */
        .container {
            width: 100%;
            max-width: 620px;
            display: none;
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .container.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Edit Mode Row Cards */
        .vocab-row {
            display: grid;
            grid-template-columns: 36px 1fr 1fr 36px;
            align-items: center;
            background: var(--glass-bg-card);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transform: translateZ(0);
            margin-bottom: 10px;
            border-radius: var(--radius-element);
            border: 1px solid var(--glass-border-light);
            box-shadow: var(--glass-shadow-sm);
            padding: 4px 8px;
            transition: all 0.25s ease;
        }

        .vocab-row:focus-within {
            border-color: var(--glass-border-strong);
            background: var(--glass-bg-hover);
            box-shadow: 0 0 16px rgba(255, 255, 255, 0.15);
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: none;
            background: transparent;
            color: var(--text-main);
            font-family: inherit;
            font-size: 14.5px;
            font-weight: 500;
            outline: none;
            resize: none;
            overflow: hidden;
            line-height: 1.4;
        }

        textarea::placeholder { color: var(--text-muted); }

        .zh-input {
            border-left: 1px solid var(--glass-border-light);
            color: var(--text-sub);
        }

        .icon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s ease;
            background: transparent;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: var(--radius-full);
        }

        .icon-btn:hover { color: var(--text-main); background: var(--glass-bg-hover); }
        .audio-btn:hover { color: var(--accent-blue); }
        .del-btn:hover { color: var(--accent-red); }

        /* Flashcard Mode Component */
        .card-scene {
            width: 100%;
            height: 320px;
            perspective: 1200px;
            margin: 10px auto 0 auto;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .card-inner.is-flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-container);
            background: var(--glass-bg-card);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border-light);
            box-shadow: var(--glass-shadow);
            padding: 30px;
            font-size: 32px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .card-back {
            transform: rotateY(180deg);
            color: var(--text-sub);
        }

        .card-audio-trigger {
            position: absolute;
            top: 16px;
            right: 16px;
            color: var(--text-muted);
            padding: 8px;
            border-radius: var(--radius-full);
            background: var(--glass-bg-primary);
            border: 1px solid var(--glass-border-light);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .card-audio-trigger:hover {
            color: var(--accent-blue);
            background: var(--glass-bg-hover);
            transform: scale(1.1);
        }

        .card-controls {
            margin-top: 24px;
            display: flex;
            justify-content: center;
            gap: 16px;
            align-items: center;
        }

        .shuffle-label {
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text-sub);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
        }

        input[type="checkbox"] {
            accent-color: var(--accent-blue);
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        /* Spell Mode Component */
        .spell-row {
            background: var(--glass-bg-card);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 12px 16px;
            border-radius: var(--radius-element);
            border: 1px solid var(--glass-border-light);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--glass-shadow-sm);
        }

        .spell-translation {
            width: 35%;
            font-size: 14.5px;
            font-weight: 600;
            color: var(--text-sub);
        }

        .spell-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--glass-border-light);
            border-radius: var(--radius-element);
            outline: none;
            font-family: inherit;
            font-size: 14px;
            background: var(--glass-bg-input);
            color: var(--text-main);
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .spell-input:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: var(--glass-border-strong);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .spell-input.wrong {
            border-color: var(--accent-red);
            color: var(--accent-red);
            background: rgba(255, 69, 58, 0.15);
        }

        .score-box {
            background: rgba(48, 209, 88, 0.15);
            color: var(--accent-green);
            padding: 18px;
            border-radius: var(--radius-container);
            margin-bottom: 20px;
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            border: 1px solid rgba(48, 209, 88, 0.3);
            backdrop-filter: blur(8px);
            box-shadow: var(--glass-shadow-sm);
        }

        /* Action Modal (Cloud Loader) */
        #modalOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .action-modal {
            background: rgba(20, 20, 30, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 24px;
            border-radius: var(--radius-container);
            text-align: center;
            border: 1px solid var(--glass-border-light);
            box-shadow: var(--glass-shadow);
            width: 320px;
            animation: modalPop 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .action-modal p {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 16px;
        }

        .modal-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: var(--radius-element);
            border: 1px solid var(--glass-border-light);
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            background: var(--glass-bg-input);
            color: var(--text-main);
            outline: none;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .modal-input:focus {
            border-color: var(--glass-border-strong);
            background: rgba(255, 255, 255, 0.2);
        }

        .recent-item {
            padding: 10px 12px;
            background: var(--glass-bg-primary);
            margin-bottom: 6px;
            border-radius: var(--radius-element);
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s ease;
            border: 1px solid var(--glass-border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-sub);
        }

        .recent-item:hover {
            background: var(--glass-bg-hover);
            color: var(--text-main);
            border-color: var(--glass-border-strong);
        }

        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.94) translateY(8px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Floating Baseline Synchronized Elements */
        .mode-hub {
            position: fixed; 
            bottom: 20px; 
            left: 24px;
            z-index: 1100;
        }

        .mode-trigger {
            background: var(--glass-bg-primary);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transform: translateZ(0);
            padding: 8px 16px;
            height: 38px;
            display: inline-flex;
            align-items: center;
            border-radius: var(--radius-full);
            border: 1px solid var(--glass-border-light);
            box-shadow: var(--glass-shadow-sm);
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            font-size: 13.5px;
            transition: all 0.2s ease;
            user-select: none;
        }

        .mode-trigger:hover {
            background: var(--glass-bg-hover);
            border-color: var(--glass-border-strong);
        }

        .mode-options {
            display: none;
            position: absolute;
            bottom: 46px;
            left: 0;
            flex-direction: column;
            background: rgba(20, 20, 30, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transform: translateZ(0);
            padding: 8px;
            border-radius: var(--radius-container);
            border: 1px solid var(--glass-border-light);
            box-shadow: var(--glass-shadow);
            min-width: 180px;
            gap: 4px;
        }

        .mode-options.show { display: flex; }

        .mode-link {
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: var(--radius-element);
            cursor: pointer;
            transition: background 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .mode-link:hover { background: var(--glass-bg-hover); }

        .status-counter {
            position: fixed; 
            bottom: 20px; 
            right: 24px;
            height: 38px;
            display: inline-flex;
            align-items: center;
            font-weight: 600; 
            color: var(--text-sub); 
            font-size: 13px;
            z-index: 900; 
            pointer-events: none;
            background: var(--glass-bg-primary);
            padding: 8px 16px; 
            border-radius: var(--radius-full);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transform: translateZ(0);
            border: 1px solid var(--glass-border-light);
            box-shadow: var(--glass-shadow-sm);
        }

        .hint {
            margin-top: 24px;
            text-align: center;
            font-size: 12.5px;
            color: var(--text-muted);
            font-weight: 500;
            line-height: 1.6;
        }

        .icon { width: 18px; height: 18px; fill: currentColor; }
        .icon-large { width: 22px; height: 22px; fill: currentColor; }

        #appVersion { 
            position: fixed; 
            right: 12px; 
            bottom: 4px; 
            font-size: 10px; 
            font-weight: 500; 
            color: var(--text-muted); 
            pointer-events: none; 
            z-index: 2000; 
        }

        @media (max-width: 600px) {
            body { padding-left: 12px; padding-right: 12px; padding-top: 90px; }
            header { width: calc(100% - 24px); padding: 0 14px; top: 12px; }
            header h1 { font-size: 18px; }
            .mode-hub { left: 12px; bottom: 16px; }
            .status-counter { right: 12px; bottom: 16px; }
            .glass-btn { padding: 6px 10px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <!-- Ambient Dynamic Background Canvas -->
    <canvas id="liquidCanvas"></canvas>

    <!-- Glass Header Wrapper -->
    <header>
        <h1>Vocab</h1>
        <nav class="top-nav">
            <button id="resetBtn" class="glass-btn" onclick="handleReset()">New</button>
            <button id="saveBtn" class="glass-btn" onclick="saveToCloud(event)">Save</button>
            <button class="glass-btn" onclick="showLoadModal(event)">Load</button>
        </nav>
    </header>

    <!-- Load List Modal -->
    <div id="modalOverlay" onclick="this.style.display='none'">
        <div class="action-modal" onclick="event.stopPropagation()">
            <p>Load Vocab List</p>
            <input type="text" id="loadIdInput" class="modal-input" placeholder="ENTER LIST ID">
            <div id="recentListsContainer" style="margin-bottom:14px; text-align:left;"></div>
            <div style="display:flex; flex-direction:column; gap:8px;">
                <button class="glass-btn primary btn-full" onclick="loadFromCloud()">Load List</button>
                <button class="glass-btn btn-full" onclick="document.getElementById('modalOverlay').style.display='none'">Cancel</button>
            </div>
        </div>
    </div>

    <!-- View Mode Containers -->
    <div id="editContainer" class="container active">
        <div id="vocabList"></div>
        <div class="hint"><b>Paste Multiple Lines</b> Auto-creates Rows &nbsp;•&nbsp; <b>Enter/Tab</b> Next Item &nbsp;•&nbsp; <b>Esc</b> Speak</div>
    </div>

    <div id="flashContainer" class="container">
        <div class="card-scene">
            <div class="card-inner" id="flashcard" onclick="flipCard()">
                <div class="card-face card-front">
                    <div class="card-audio-trigger" onclick="playCardAudio(event)"></div>
                    <span id="frontText">...</span>
                </div>
                <div class="card-face card-back">
                    <span id="backText">...</span>
                </div>
            </div>
        </div>
        <div class="card-controls">
            <button class="glass-btn" onclick="prevCard()">← Prev</button>
            <label class="shuffle-label">
                <input type="checkbox" id="shuffleToggle" onchange="startFlashcards()"> Shuffle
            </label>
            <button class="glass-btn primary" onclick="nextCard()">Next →</button>
        </div>
    </div>

    <div id="spellContainer" class="container">
        <div id="scoreDisplay" class="score-box" style="display:none"></div>
        <div id="spellList"></div>
        <div style="display:flex; justify-content:center; gap:12px; margin-top:24px;">
            <button id="spellSubmit" class="glass-btn primary" onclick="submitSpell()">Submit</button>
            <button id="spellRestart" class="glass-btn" style="display:none" onclick="startSpellMode()">Restart</button>
        </div>
    </div>

    <!-- Class & Mode Switcher Hub (Bottom-Left) -->
    <div class="mode-hub">
        <div class="mode-trigger" id="modeTrigger" onclick="toggleModeMenu(event)">Edit Mode</div>
        <div class="mode-options" id="modeOptions">
            <div class="mode-link" onclick="switchMode('edit')">Edit Mode</div>
            <div class="mode-link" onclick="switchMode('flash')">Flashcard Mode</div>
            <div class="mode-link" onclick="switchMode('spell')">Spell Mode</div>
        </div>
    </div>

    <div class="status-counter" id="vocabCounter">0 Vocab Items</div>
    <div id="appVersion">v3.1 | Liquid Glass</div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzP-a4wulSmMV2wi9kq4Y8TnA8FYCo7N3wn5YE0kk7TPC01PMQglDeeL_LGrj6fIUX1Dw/exec";
        let currentListId = null;

        /* Ambient Dynamic Background Canvas Engine */
        const canvas = document.getElementById('liquidCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, dpr;
        
        function resizeCanvas() {
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
        }
        
        window.addEventListener('resize', () => {
            if (canvas.width !== window.innerWidth * (window.devicePixelRatio || 1)) {
                resizeCanvas();
            }
        });
        resizeCanvas();

        const blobs = [
            { x: 0.2, y: 0.3, r: 0.45, color: 'rgba(100, 140, 255, 0.6)', vx: 0.0005, vy: 0.0004 },
            { x: 0.8, y: 0.2, r: 0.5, color: 'rgba(180, 100, 255, 0.55)', vx: -0.0004, vy: 0.0005 },
            { x: 0.5, y: 0.8, r: 0.4, color: 'rgba(255, 120, 180, 0.5)', vx: 0.0003, vy: -0.0004 }
        ];

        function animateBlobs() {
            ctx.clearRect(0, 0, width, height);
            blobs.forEach(b => {
                b.x += b.vx; b.y += b.vy;
                if (b.x < 0 || b.x > 1) b.vx *= -1;
                if (b.y < 0 || b.y > 1) b.vy *= -1;

                const grad = ctx.createRadialGradient(
                    b.x * width, b.y * height, 0,
                    b.x * width, b.y * height, b.r * Math.max(width, height)
                );
                grad.addColorStop(0, b.color);
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(b.x * width, b.y * height, b.r * Math.max(width, height), 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(animateBlobs);
        }
        animateBlobs();

        /* Vocabulary Application Logic */
        const vocabList = document.getElementById('vocabList');
        let currentMode = 'edit';
        let flashData = [];
        let flashIdx = 0;

        const audioIcon = `<svg class="icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>`;
        const audioIconLarge = `<svg class="icon-large" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>`;
        const deleteIcon = `<svg class="icon" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>`;

        function updateStatus() {
            const count = document.querySelectorAll('.vocab-row').length;
            const hasData = Array.from(document.querySelectorAll('.en-input')).some(i => i.value.trim() !== "");
            const actualCount = hasData ? count : 0;
            let displayCount = `${actualCount} Vocab Item${actualCount !== 1 ? 's' : ''}`;
            if (currentListId) displayCount += ` • ID: ${currentListId}`;
            
            document.getElementById('vocabCounter').innerText = displayCount;
            let label = "Edit Mode";
            if(currentMode === 'flash') label = "Flashcard Mode";
            if(currentMode === 'spell') label = "Spell Mode";
            document.getElementById('modeTrigger').innerText = label;
        }

        function closeAllMenus() {
            const modeOptions = document.getElementById('modeOptions');
            if (modeOptions) modeOptions.classList.remove('show');
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.mode-hub')) {
                closeAllMenus();
            }
        });

        function toggleModeMenu(e) {
            if (e) e.stopPropagation();
            document.getElementById('modeOptions').classList.toggle('show');
        }

        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
            closeAllMenus();
            if(mode === 'edit') document.getElementById('editContainer').classList.add('active');
            else if(mode === 'flash') { document.getElementById('flashContainer').classList.add('active'); startFlashcards(); }
            else if(mode === 'spell') { document.getElementById('spellContainer').classList.add('active'); startSpellMode(); }
            updateStatus();
        }

        function getRawData() {
            const data = [];
            document.querySelectorAll('.vocab-row').forEach(row => {
                const en = row.querySelector('.en-input').value.trim();
                const zh = row.querySelector('.zh-input').value.trim();
                if (en) data.push({ en, zh });
            });
            return data;
        }

        function saveToCache() {
            const data = getRawData().map(i => [i.en, i.zh]);
            localStorage.setItem('appleVocabData', JSON.stringify({id: currentListId, list: data}));
            updateStatus();
        }

        /* Cloud Sync Implementation */
        async function saveToCloud(e) {
            if (e) e.stopPropagation();
            const data = getRawData();
            if (data.length === 0) return alert("List is empty! Add vocabulary items first.");
            
            const btn = document.getElementById('saveBtn');
            const orig = btn.innerText;
            btn.innerText = "Saving...";
            
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'text/plain;charset=utf-8'},
                    body: JSON.stringify({ vocab: data })
                });
                const result = await res.json();
                
                if (result.status === 'success') {
                    currentListId = result.listId;
                    updateRecentLists(currentListId);
                    saveToCache(); 
                    alert("List saved! Generated List ID: " + currentListId);
                } else {
                    alert("Error saving list: " + result.message);
                }
            } catch(err) {
                alert("Network request sent to Apps Script backend.");
            } finally {
                btn.innerText = orig;
            }
        }

        function showLoadModal(e) {
            if (e) e.stopPropagation();
            const recents = JSON.parse(localStorage.getItem('recentVocabLists') || '[]');
            const container = document.getElementById('recentListsContainer');
            
            if (recents.length > 0) {
                container.innerHTML = `<p style="font-size:11px; color:var(--text-muted); margin-bottom:6px; font-weight:600;">RECENT LISTS:</p>` + 
                    recents.map(id => `<div class="recent-item" onclick="document.getElementById('loadIdInput').value='${id}'"><span>List ID:</span> <span>${id}</span></div>`).join('');
            } else {
                container.innerHTML = "";
            }
            
            document.getElementById('loadIdInput').value = '';
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        async function loadFromCloud() {
            const id = document.getElementById('loadIdInput').value.trim().toUpperCase();
            if (!id) return;
            
            const btn = document.querySelector('.action-modal .primary');
            const orig = btn.innerText;
            btn.innerText = "Loading...";
            
            try {
                const res = await fetch(`${API_URL}?listId=${encodeURIComponent(id)}`);
                const result = await res.json();
                
                if (result.status === 'success') {
                    vocabList.innerHTML = "";
                    const d = result.data;
                    if (d.length > 0) d.forEach(item => addRow(false, item.en, item.zh));
                    else addRow(true);
                    
                    currentListId = id;
                    updateRecentLists(id);
                    saveToCache();
                    document.getElementById('modalOverlay').style.display = 'none';
                } else {
                    alert("Load failed: " + (result.message || "ID not found"));
                }
            } catch(err) {
                alert("Error loading list from cloud: " + err);
            } finally {
                btn.innerText = orig;
            }
        }

        function updateRecentLists(id) {
            let recents = JSON.parse(localStorage.getItem('recentVocabLists') || '[]');
            recents = recents.filter(item => item !== id);
            recents.unshift(id);
            if (recents.length > 5) recents.pop();
            localStorage.setItem('recentVocabLists', JSON.stringify(recents));
        }

        function handleReset() { 
            if(confirm("Clear all items and create a new vocabulary list?")) { 
                vocabList.innerHTML = ""; 
                currentListId = null;
                localStorage.removeItem('appleVocabData'); 
                addRow(true); 
            } 
        }

        /* Flashcard Mode Logic */
        function startFlashcards() {
            flashData = getRawData();
            if (flashData.length === 0) { 
                document.getElementById('frontText').innerText = "Empty List"; 
                document.getElementById('backText').innerText = "Add items in Edit Mode";
                return; 
            }
            if (document.getElementById('shuffleToggle').checked) flashData = [...flashData].sort(() => Math.random() - 0.5);
            flashIdx = 0; 
            showCard();
        }

        function showCard() { 
            const cardInner = document.getElementById('flashcard');
            cardInner.classList.remove('is-flipped');
            document.getElementById('frontText').innerText = flashData[flashIdx].en; 
            document.getElementById('backText').innerText = flashData[flashIdx].zh; 
            document.querySelectorAll('.card-audio-trigger').forEach(el => el.innerHTML = audioIconLarge);
        }

        function flipCard() { 
            if (flashData.length === 0) return; 
            document.getElementById('flashcard').classList.toggle('is-flipped');
        }

        function playCardAudio(e) { 
            e.stopPropagation(); 
            if (flashData[flashIdx]) speak(flashData[flashIdx].en); 
        }

        function nextCard() { 
            if (flashData.length === 0) return; 
            flashIdx = (flashIdx + 1) % flashData.length; 
            showCard(); 
        }

        function prevCard() { 
            if (flashData.length === 0) return; 
            flashIdx = (flashIdx - 1 + flashData.length) % flashData.length; 
            showCard(); 
        }

        /* Spelling Mode Logic */
        let spellSessionData = [];
        function startSpellMode() {
            const raw = getRawData();
            if (raw.length === 0) return;
            spellSessionData = [...raw].sort(() => Math.random() - 0.5);
            const listEl = document.getElementById('spellList');
            listEl.innerHTML = "";
            document.getElementById('scoreDisplay').style.display = "none";
            document.getElementById('spellRestart').style.display = "none";
            document.getElementById('spellSubmit').style.display = "block";
            spellSessionData.forEach((item, i) => {
                const row = document.createElement('div');
                row.className = "spell-row";
                row.innerHTML = `<div class="icon-btn audio-btn" onclick="speak('${item.en.replace(/'/g, "\\'")}')">${audioIcon}</div>
                    <div class="spell-translation">${item.zh}</div>
                    <input type="text" class="spell-input" data-idx="${i}" placeholder="Type English...">`;
                listEl.appendChild(row);
            });
        }

        function submitSpell() {
            const inputs = document.querySelectorAll('.spell-input');
            let score = 0;
            inputs.forEach(input => {
                const idx = input.dataset.idx;
                const userVal = input.value.trim().toLowerCase();
                const correctVal = spellSessionData[idx].en.toLowerCase();
                if (userVal === correctVal) { 
                    score++; 
                    input.style.borderColor = "var(--accent-green)"; 
                } else { 
                    input.classList.add('wrong'); 
                    input.value = `${userVal || '??'} → ${spellSessionData[idx].en}`; 
                }
                input.disabled = true;
            });
            document.getElementById('scoreDisplay').innerText = `Result: ${score} / ${spellSessionData.length}`;
            document.getElementById('scoreDisplay').style.display = "block";
            document.getElementById('spellSubmit').style.display = "none";
            document.getElementById('spellRestart').style.display = "block";
        }

        function autoResize(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
        
        function speak(text) { 
            if (!text) return; 
            window.speechSynthesis.cancel(); 
            const u = new SpeechSynthesisUtterance(text); 
            u.lang = 'en-US'; 
            u.rate = 0.9; 
            window.speechSynthesis.speak(u); 
        }

        function createRow(en = "", zh = "") {
            const row = document.createElement('div');
            row.className = 'vocab-row';
            row.innerHTML = `<div class="icon-btn audio-btn">${audioIcon}</div>
                <textarea class="en-input" placeholder="Vocab Item" rows="1">${en}</textarea>
                <textarea class="zh-input" placeholder="Translation" rows="1">${zh}</textarea>
                <div class="icon-btn del-btn">${deleteIcon}</div>`;
            
            const enInput = row.querySelector('.en-input');
            const zhInput = row.querySelector('.zh-input');
            
            row.querySelector('.audio-btn').onclick = () => speak(enInput.value);
            row.querySelector('.del-btn').onclick = () => { 
                if(document.querySelectorAll('.vocab-row').length > 1) { 
                    row.remove(); 
                    saveToCache(); 
                } else { 
                    enInput.value=""; 
                    zhInput.value=""; 
                    saveToCache(); 
                } 
            };
            
            enInput.addEventListener('paste', (e) => {
                const pasteData = (e.clipboardData || window.clipboardData).getData('text');
                if (!pasteData || (!pasteData.includes('\n') && !pasteData.includes('\t'))) return; 
                
                e.preventDefault();
                const lines = pasteData.split(/\r?\n/).filter(line => line.trim() !== '');
                
                lines.forEach((line, index) => {
                    let enStr = line;
                    let zhStr = "";
                    
                    if (line.includes('\t')) {
                        const parts = line.split('\t');
                        enStr = parts[0];
                        zhStr = parts[1] || "";
                    } else if (line.includes(',') && line.split(',').length === 2) {
                        const parts = line.split(',');
                        enStr = parts[0];
                        zhStr = parts[1];
                    }

                    enStr = enStr.trim();
                    zhStr = zhStr.trim();

                    if (index === 0) {
                        enInput.value = enStr;
                        zhInput.value = zhStr;
                        setTimeout(() => { autoResize(enInput); autoResize(zhInput); }, 0);
                    } else {
                        addRow(false, enStr, zhStr);
                    }
                });
                saveToCache();
            });

            enInput.addEventListener('blur', async () => {
                if(!enInput.value.trim() && !zhInput.value.trim() && document.querySelectorAll('.vocab-row').length > 1) { 
                    row.remove(); 
                    saveToCache(); 
                    return; 
                }
                if(enInput.value && !zhInput.value) {
                    zhInput.value = "...";
                    try {
                        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-TW&dt=t&q=${encodeURIComponent(enInput.value)}`);
                        const d = await res.json(); 
                        zhInput.value = d[0][0][0]; 
                        autoResize(zhInput); 
                        saveToCache();
                    } catch(e) { zhInput.value = ""; }
                }
            });

            [enInput, zhInput].forEach(el => el.oninput = () => { autoResize(el); saveToCache(); });
            
            enInput.onkeydown = (e) => {
                if(e.key === 'Escape') { speak(enInput.value); e.preventDefault(); }
                if(e.key === 'Enter' || e.key === 'Tab') { 
                    e.preventDefault(); 
                    const next = row.nextElementSibling?.querySelector('.en-input'); 
                    if(next) next.focus(); 
                    else if(enInput.value) addRow(true); 
                }
                if(e.key === 'ArrowRight') zhInput.focus();
                if(e.key === 'ArrowDown') row.nextElementSibling?.querySelector('.en-input')?.focus();
                if(e.key === 'ArrowUp') row.previousElementSibling?.querySelector('.en-input')?.focus();
            };

            zhInput.onkeydown = (e) => {
                if(e.key === 'ArrowLeft') enInput.focus();
                if(e.key === 'ArrowDown') row.nextElementSibling?.querySelector('.zh-input')?.focus();
                if(e.key === 'ArrowUp') row.previousElementSibling?.querySelector('.zh-input')?.focus();
            };

            setTimeout(() => { autoResize(enInput); autoResize(zhInput); }, 0);
            return row;
        }

        function addRow(focus = false, en = "", zh = "") {
            const row = createRow(en, zh);
            vocabList.appendChild(row);
            if(focus) setTimeout(() => row.querySelector('.en-input').focus(), 10);
            saveToCache();
        }

        // Initialize App
        const cached = localStorage.getItem('appleVocabData');
        if(cached) {
            try {
                const parsed = JSON.parse(cached);
                if (Array.isArray(parsed)) {
                    if (parsed.length > 0) parsed.forEach(i => addRow(false, i[0], i[1]));
                    else addRow(true);
                } else {
                    currentListId = parsed.id || null;
                    if (parsed.list && parsed.list.length > 0) parsed.list.forEach(i => addRow(false, i[0], i[1]));
                    else addRow(true);
                }
            } catch(e) { addRow(true); }
        } else { addRow(true); }
        
        updateStatus();
    </script>
</body>
</html>
