<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scoreboard</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background-color: #111;
    }

    .scoreboard {
      display: flex;
      width: 100vw;
      height: 100vh;
      box-sizing: border-box;
      position: relative;
    }

    .column {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      position: relative;
      box-sizing: border-box;
      background-size: 100% auto;
      background-position: bottom;
      background-repeat: no-repeat;
      transition: box-shadow 0.25s ease, filter 0.3s ease;
    }

    .column.red    { background-color: #c0524d; }
    .column.purple { background-color: #5a3275; }
    .column.yellow { background-color: #e1b970; }
    .column.green  { background-color: #588849; }

    /* Leader highlight */
    .column.leader {
      box-shadow: inset 0 0 45px rgba(255, 255, 255, 0.28);
    }

    /* Winner Spotlight mode (Key: W) */
    body.winner-mode .column:not(.leader) {
      filter: brightness(0.35) saturate(0.6);
    }
    body.winner-mode .column.leader {
      box-shadow: inset 0 0 80px rgba(255, 215, 0, 0.55);
    }

    /* Top control buttons */
    .buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 3;
      opacity: 0.25;
      transition: opacity 0.15s ease;
    }

    .column:hover .buttons {
      opacity: 1;
    }

    /* Audience Display mode or 'H' toggle hides all buttons & info icon */
    body.hide-controls .buttons,
    body.audience-mode .buttons,
    body.hide-controls #info-btn,
    body.audience-mode #info-btn {
      opacity: 0 !important;
      pointer-events: none;
    }

    .button-row {
      display: flex;
      justify-content: center;
    }

    button {
      background-color: transparent;
      border: 1px solid white;
      color: white;
      padding: 6px 12px;
      margin: 4px;
      cursor: pointer;
      font-size: 15px;
      user-select: none;
      touch-action: manipulation;
      transition: background-color 0.1s, color 0.1s, transform 0.05s;
    }

    button:hover {
      background-color: white;
      color: black;
    }

    button:active {
      transform: scale(0.94);
    }

    /* Subtle top-right (i) manual button */
    #info-btn {
      position: fixed;
      top: 12px;
      right: 12px;
      width: 28px;
      height: 28px;
      padding: 0;
      margin: 0;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.75);
      background: rgba(0, 0, 0, 0.2);
      color: white;
      font-family: Georgia, serif;
      font-style: italic;
      font-weight: bold;
      font-size: 15px;
      line-height: 26px;
      text-align: center;
      opacity: 0.3;
      z-index: 15;
      transition: opacity 0.2s ease, background-color 0.15s ease, color 0.15s ease;
    }

    #info-btn:hover {
      opacity: 1;
      background: white;
      color: black;
    }

    /* Shortcuts / Manual Modal */
    #help-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 30;
    }

    #help-modal.open {
      opacity: 1;
      pointer-events: auto;
    }

    .help-card {
      background: #1c1c1e;
      color: #f5f5f7;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 12px;
      padding: 24px 28px;
      max-width: 460px;
      width: 90%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    .help-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding-bottom: 10px;
    }

    .help-header h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.3px;
    }

    #close-help {
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      padding: 0;
      margin: 0;
      font-size: 16px;
      line-height: 28px;
    }

    #close-help:hover {
      background: #fff;
      color: #000;
    }

    .help-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .help-table td {
      padding: 8px 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .help-table tr:last-child td {
      border-bottom: none;
    }

    .help-table td:last-child {
      text-align: right;
      color: #bbb;
    }

    kbd {
      display: inline-block;
      padding: 2px 7px;
      font-family: monospace;
      font-size: 12px;
      color: #fff;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 4px;
    }

    /* Center score display */
    .score-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding-bottom: 12vh;
      z-index: 2;
      position: relative;
    }

    .crown {
      font-size: clamp(26px, 2.8vw, 46px);
      height: 1.2em;
      margin-bottom: 4px;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
    }

    .column.leader .crown {
      opacity: 1;
      transform: translateY(0);
    }

    .score-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .score {
      font-size: clamp(48px, 6.5vw, 130px);
      font-weight: bold;
      color: white;
      text-align: center;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.35);
      user-select: none;
      cursor: pointer;
      will-change: transform;
      font-variant-numeric: tabular-nums;
    }

    .score-update {
      animation: scoreAnimation 0.22s ease-out;
    }

    @keyframes scoreAnimation {
      0% { transform: scale(1); }
      50% { transform: scale(1.14); }
      100% { transform: scale(1); }
    }

    /* Floating +100 / -10 delta badge */
    .delta-badge {
      position: absolute;
      top: -15px;
      font-size: clamp(20px, 2vw, 34px);
      font-weight: bold;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      pointer-events: none;
      animation: floatUp 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .delta-badge.negative {
      color: #ffd1d1;
    }

    @keyframes floatUp {
      0%   { opacity: 1; transform: translateY(0) scale(0.9); }
      100% { opacity: 0; transform: translateY(-48px) scale(1.1); }
    }

    /* Confetti canvas overlay */
    #confetti-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 10;
    }

    /* Subtle shortcut HUD toast */
    #toast {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 20;
    }
    #toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <canvas id="confetti-canvas"></canvas>
  <div id="toast"></div>

  <!-- Top-right (i) Info Button -->
  <button id="info-btn" title="Controls & Shortcuts (?)">i</button>

  <!-- Shortcuts / Manual Overlay -->
  <div id="help-modal">
    <div class="help-card">
      <div class="help-header">
        <h2>Scoreboard Controls & Shortcuts</h2>
        <button id="close-help" title="Close (Esc)">✕</button>
      </div>
      <table class="help-table">
        <tr>
          <td>Set exact score</td>
          <td><kbd>Double-Click</kbd> any score</td>
        </tr>
        <tr>
          <td>Open synced audience screen</td>
          <td><kbd>P</kbd></td>
        </tr>
        <tr>
          <td>Winner spotlight & confetti</td>
          <td><kbd>W</kbd></td>
        </tr>
        <tr>
          <td>Hide / show control buttons</td>
          <td><kbd>H</kbd></td>
        </tr>
        <tr>
          <td>Toggle fullscreen</td>
          <td><kbd>F</kbd></td>
        </tr>
        <tr>
          <td>Mute / unmute sound effects</td>
          <td><kbd>M</kbd></td>
        </tr>
        <tr>
          <td>Reset all 4 teams to 0</td>
          <td><kbd>Shift</kbd> + <kbd>R</kbd></td>
        </tr>
        <tr>
          <td>Toggle this manual</td>
          <td><kbd>?</kbd> or <kbd>Esc</kbd></td>
        </tr>
      </table>
    </div>
  </div>

  <div class="scoreboard">
    <div class="column red" id="col-red">
      <div class="buttons">
        <div class="button-row">
          <button data-team="red" data-pts="100">+100</button>
          <button data-team="red" data-pts="10">+10</button>
          <button data-team="red" data-pts="1">+1</button>
        </div>
        <div class="button-row">
          <button data-team="red" data-pts="-100">-100</button>
          <button data-team="red" data-pts="-10">-10</button>
          <button data-team="red" data-pts="-1">-1</button>
        </div>
        <div class="button-row">
          <button data-team="red" data-action="undo">Undo</button>
          <button data-team="red" data-action="reset">Reset</button>
        </div>
      </div>
      <div class="score-container">
        <div class="crown">👑</div>
        <div class="score-wrapper" id="wrap-red">
          <div class="score" id="red-score" title="Double-click to set exact score">0</div>
        </div>
      </div>
    </div>

    <div class="column purple" id="col-purple">
      <div class="buttons">
        <div class="button-row">
          <button data-team="purple" data-pts="100">+100</button>
          <button data-team="purple" data-pts="10">+10</button>
          <button data-team="purple" data-pts="1">+1</button>
        </div>
        <div class="button-row">
          <button data-team="purple" data-pts="-100">-100</button>
          <button data-team="purple" data-pts="-10">-10</button>
          <button data-team="purple" data-pts="-1">-1</button>
        </div>
        <div class="button-row">
          <button data-team="purple" data-action="undo">Undo</button>
          <button data-team="purple" data-action="reset">Reset</button>
        </div>
      </div>
      <div class="score-container">
        <div class="crown">👑</div>
        <div class="score-wrapper" id="wrap-purple">
          <div class="score" id="purple-score" title="Double-click to set exact score">0</div>
        </div>
      </div>
    </div>

    <div class="column yellow" id="col-yellow">
      <div class="buttons">
        <div class="button-row">
          <button data-team="yellow" data-pts="100">+100</button>
          <button data-team="yellow" data-pts="10">+10</button>
          <button data-team="yellow" data-pts="1">+1</button>
        </div>
        <div class="button-row">
          <button data-team="yellow" data-pts="-100">-100</button>
          <button data-team="yellow" data-pts="-10">-10</button>
          <button data-team="yellow" data-pts="-1">-1</button>
        </div>
        <div class="button-row">
          <button data-team="yellow" data-action="undo">Undo</button>
          <button data-team="yellow" data-action="reset">Reset</button>
        </div>
      </div>
      <div class="score-container">
        <div class="crown">👑</div>
        <div class="score-wrapper" id="wrap-yellow">
          <div class="score" id="yellow-score" title="Double-click to set exact score">0</div>
        </div>
      </div>
    </div>

    <div class="column green" id="col-green">
      <div class="buttons">
        <div class="button-row">
          <button data-team="green" data-pts="100">+100</button>
          <button data-team="green" data-pts="10">+10</button>
          <button data-team="green" data-pts="1">+1</button>
        </div>
        <div class="button-row">
          <button data-team="green" data-pts="-100">-100</button>
          <button data-team="green" data-pts="-10">-10</button>
          <button data-team="green" data-pts="-1">-1</button>
        </div>
        <div class="button-row">
          <button data-team="green" data-action="undo">Undo</button>
          <button data-team="green" data-action="reset">Reset</button>
        </div>
      </div>
      <div class="score-container">
        <div class="crown">👑</div>
        <div class="score-wrapper" id="wrap-green">
          <div class="score" id="green-score" title="Double-click to set exact score">0</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const teams = ['red', 'purple', 'yellow', 'green'];
    const STORAGE_KEY = 'lst_scoreboard_v2';
    const IMG_CACHE_KEY = 'lst_scoreboard_imgs_v1';
    const isAudienceWindow = new URLSearchParams(window.location.search).get('audience') === '1';

    if (isAudienceWindow) {
      document.body.classList.add('audience-mode');
    }

    let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
      red: 0, purple: 0, yellow: 0, green: 0
    };
    const displayed = { ...state };
    const animFrames = { red: null, purple: null, yellow: null, green: null };
    const history = { red: [], purple: [], yellow: [], green: [] };
    let isMuted = false;

    const scoreEls = {};
    const colEls = {};
    const wrapEls = {};
    teams.forEach(t => {
      scoreEls[t] = document.getElementById(t + '-score');
      colEls[t] = document.getElementById('col-' + t);
      wrapEls[t] = document.getElementById('wrap-' + t);
    });

    // Help Modal Controls
    const helpModal = document.getElementById('help-modal');
    const infoBtn = document.getElementById('info-btn');
    const closeHelpBtn = document.getElementById('close-help');

    function toggleHelp(force) {
      if (isAudienceWindow) return;
      helpModal.classList.toggle('open', force);
    }

    infoBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      toggleHelp();
    });

    closeHelpBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      toggleHelp(false);
    });

    helpModal.addEventListener('pointerdown', (e) => {
      if (e.target === helpModal) toggleHelp(false);
    });

    // Toast notification helper
    const toastEl = document.getElementById('toast');
    let toastTimer = null;
    function showToast(msg) {
      if (isAudienceWindow) return;
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
    }

    // Offline Image Caching
    const imageUrls = {
      red: 'https://www.lstyoungkhl.edu.hk/sites/default/files/ExamTimer/score/1.png',
      purple: 'https://www.lstyoungkhl.edu.hk/sites/default/files/ExamTimer/score/2.png',
      yellow: 'https://www.lstyoungkhl.edu.hk/sites/default/files/ExamTimer/score/3.png',
      green: 'https://www.lstyoungkhl.edu.hk/sites/default/files/ExamTimer/score/4.png'
    };

    function loadAndCacheImages() {
      let cached = {};
      try { cached = JSON.parse(localStorage.getItem(IMG_CACHE_KEY)) || {}; } catch (e) {}

      teams.forEach(team => {
        if (cached[team]) {
          colEls[team].style.backgroundImage = `url('${cached[team]}')`;
        } else {
          colEls[team].style.backgroundImage = `url('${imageUrls[team]}')`;
          fetch(imageUrls[team])
            .then(r => r.blob())
            .then(blob => new Promise(res => {
              const reader = new FileReader();
              reader.onloadend = () => res(reader.result);
              reader.readAsDataURL(blob);
            }))
            .then(dataUrl => {
              try {
                const latest = JSON.parse(localStorage.getItem(IMG_CACHE_KEY)) || {};
                latest[team] = dataUrl;
                localStorage.setItem(IMG_CACHE_KEY, JSON.stringify(latest));
              } catch (e) {}
            })
            .catch(() => {});
        }
      });
    }
    loadAndCacheImages();

    // Dual-Window Sync via BroadcastChannel
    const channel = ('BroadcastChannel' in window) ? new BroadcastChannel('lst_scoreboard_sync') : null;
    if (channel) {
      channel.onmessage = (e) => {
        if (e.data && e.data.type === 'SYNC') {
          const prev = { ...state };
          state = e.data.state;
          if (e.data.winnerMode !== undefined) {
            document.body.classList.toggle('winner-mode', e.data.winnerMode);
            if (e.data.winnerMode) launchConfetti();
          }
          teams.forEach(t => {
            if (state[t] !== prev[t]) {
              const delta = state[t] - prev[t];
              spawnDeltaBadge(t, delta);
              animateNumber(t, state[t]);
            }
          });
          updateLeaders();
        }
      };
    }

    let saveTimer = null;
    function broadcastAndSave(winnerMode) {
      if (channel) {
        channel.postMessage({ type: 'SYNC', state, winnerMode });
      }
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
      }, 250);
    }

    // Web Audio Chimes
    let audioCtx = null;
    function playTone(type) {
      if (isMuted || isAudienceWindow) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;
        if (type === 'up') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.1);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (type === 'down') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(329.63, now);
          osc.frequency.exponentialRampToValueAtTime(220.00, now + 0.12);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
          osc.start(now);
          osc.stop(now + 0.14);
        } else if (type === 'fanfare') {
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g);
            g.connect(audioCtx.destination);
            o.type = 'triangle';
            o.frequency.setValueAtTime(freq, now + idx * 0.08);
            g.gain.setValueAtTime(0.12, now + idx * 0.08);
            g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.35);
            o.start(now + idx * 0.08);
            o.stop(now + idx * 0.08 + 0.35);
          });
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(261.63, now);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          osc.start(now);
          osc.stop(now + 0.15);
        }
      } catch (e) {}
    }

    // Rolling Number Counter & Floating Delta Indicator
    function animateNumber(team, target) {
      if (animFrames[team]) cancelAnimationFrame(animFrames[team]);
      const start = displayed[team];
      const diff = target - start;
      if (diff === 0) {
        scoreEls[team].textContent = target;
        return;
      }

      const el = scoreEls[team];
      el.classList.remove('score-update');
      requestAnimationFrame(() => el.classList.add('score-update'));

      const duration = Math.abs(diff) >= 50 ? 240 : 120;
      const startTime = performance.now();

      function step(now) {
        const progress = Math.min((now - startTime) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        displayed[team] = Math.round(start + diff * eased);
        el.textContent = displayed[team];
        if (progress < 1) {
          animFrames[team] = requestAnimationFrame(step);
        } else {
          displayed[team] = target;
          el.textContent = target;
          animFrames[team] = null;
        }
      }
      animFrames[team] = requestAnimationFrame(step);
    }

    function spawnDeltaBadge(team, delta) {
      if (!delta) return;
      const badge = document.createElement('div');
      badge.className = 'delta-badge' + (delta < 0 ? ' negative' : '');
      badge.textContent = delta > 0 ? `+${delta}` : `${delta}`;
      wrapEls[team].appendChild(badge);
      setTimeout(() => badge.remove(), 750);
    }

    function updateLeaders() {
      const maxScore = Math.max(...teams.map(t => state[t]));
      teams.forEach(team => {
        colEls[team].classList.toggle('leader', maxScore > 0 && state[team] === maxScore);
      });
    }

    function applyScoreChange(team, newVal, soundType = null) {
      const delta = newVal - state[team];
      state[team] = newVal;
      spawnDeltaBadge(team, delta);
      animateNumber(team, newVal);
      updateLeaders();
      broadcastAndSave();
      if (soundType) playTone(soundType);
    }

    // Instant Pointerdown Button Handling
    document.querySelector('.scoreboard').addEventListener('pointerdown', (e) => {
      if (isAudienceWindow) return;
      const btn = e.target.closest('button');
      if (!btn) return;
      e.preventDefault();

      const team = btn.dataset.team;
      if (btn.dataset.pts) {
        const points = parseInt(btn.dataset.pts, 10);
        history[team].push(state[team]);
        applyScoreChange(team, state[team] + points, points > 0 ? 'up' : 'down');
      } else if (btn.dataset.action === 'undo') {
        if (history[team].length === 0) return;
        applyScoreChange(team, history[team].pop(), 'reset');
      } else if (btn.dataset.action === 'reset') {
        if (state[team] === 0) return;
        setTimeout(() => {
          if (confirm(`Reset ${team.toUpperCase()} score to 0?`)) {
            history[team].push(state[team]);
            applyScoreChange(team, 0, 'reset');
          }
        }, 0);
      }
    });

    // Double-click score to enter exact custom value
    teams.forEach(team => {
      scoreEls[team].addEventListener('dblclick', () => {
        if (isAudienceWindow) return;
        const input = prompt(`Enter exact score for ${team.toUpperCase()}:`, state[team]);
        if (input === null) return;
        const parsed = parseInt(input.trim(), 10);
        if (!isNaN(parsed) && parsed !== state[team]) {
          history[team].push(state[team]);
          applyScoreChange(team, parsed, parsed > state[team] ? 'up' : 'down');
        }
      });
    });

    // Confetti Burst
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let confettiAnim = null;

    function launchConfetti() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const colors = ['#ffffff', '#ffd700', '#ff6b6b', '#4ecdc4', '#ffe66d'];
      const maxScore = Math.max(...teams.map(t => state[t]));

      const leaderIndices = teams
        .map((t, i) => (maxScore > 0 && state[t] === maxScore ? i : -1))
        .filter(i => i !== -1);
      const targetCols = leaderIndices.length ? leaderIndices : [0, 1, 2, 3];

      particles = [];
      for (let i = 0; i < 160; i++) {
        const colIdx = targetCols[i % targetCols.length];
        const colWidth = canvas.width / 4;
        particles.push({
          x: colIdx * colWidth + Math.random() * colWidth,
          y: -20 - Math.random() * canvas.height * 0.5,
          w: 8 + Math.random() * 6,
          h: 4 + Math.random() * 4,
          vx: (Math.random() - 0.5) * 4,
          vy: 3 + Math.random() * 5,
          rot: Math.random() * 360,
          vRot: (Math.random() - 0.5) * 10,
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }

      if (confettiAnim) cancelAnimationFrame(confettiAnim);
      function renderConfetti() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = 0;
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.vRot;
          if (p.y < canvas.height + 20) active++;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rot * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        });
        if (active > 0) {
          confettiAnim = requestAnimationFrame(renderConfetti);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      confettiAnim = requestAnimationFrame(renderConfetti);
    }

    // Keyboard Shortcuts
    document.addEventListener('keydown', (e) => {
      if (isAudienceWindow) return;
      const key = e.key.toLowerCase();

      if (key === 'escape' && helpModal.classList.contains('open')) {
        toggleHelp(false);
        return;
      }

      if (e.key === '?' || e.key === '/') {
        toggleHelp();
      } else if (key === 'h') {
        const hidden = document.body.classList.toggle('hide-controls');
        showToast(hidden ? 'Controls Hidden (Press H to show)' : 'Controls Visible');
      } else if (key === 'f') {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      } else if (key === 'm') {
        isMuted = !isMuted;
        showToast(isMuted ? 'Sound Muted' : 'Sound Unmuted');
      } else if (key === 'w') {
        const active = document.body.classList.toggle('winner-mode');
        if (active) {
          launchConfetti();
          playTone('fanfare');
          showToast('Winner Spotlight ON (Press W to exit)');
        } else {
          showToast('Winner Spotlight OFF');
        }
        broadcastAndSave(active);
      } else if (key === 'p') {
        const url = new URL(window.location.href);
        url.searchParams.set('audience', '1');
        window.open(url.toString(), 'ScoreboardAudience', 'width=1280,height=720');
        showToast('Opened Synced Audience Window');
      } else if (key === 'r' && e.shiftKey) {
        if (confirm('Reset ALL 4 teams to 0?')) {
          teams.forEach(t => {
            history[t].push(state[t]);
            state[t] = 0;
            animateNumber(t, 0);
          });
          document.body.classList.remove('winner-mode');
          updateLeaders();
          broadcastAndSave(false);
          playTone('reset');
          showToast('All Scores Reset');
        }
      }
    });

    // Initial render
    teams.forEach(t => { scoreEls[t].textContent = state[t]; });
    updateLeaders();
  </script>
</body>
</html>
