<!DOCTYPE html>
<html>
<head>
  <title>Scoreboard</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .scoreboard {
      display: flex;
      width: 100vw;
      height: 100vh;
      box-sizing: border-box;
    }

    .column {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      position: relative;
      box-sizing: border-box;
      background-size: 100% auto;
      background-position: bottom;
      background-repeat: no-repeat;
    }

    .column.red    { background-color: #c0524d; background-image: url('https://www.lstyoungkhl.edu.hk/sites/default/files/ExamTimer/score/1.png'); }
    .column.purple { background-color: #5a3275; background-image: url('https://www.lstyoungkhl.edu.hk/sites/default/files/ExamTimer/score/2.png'); }
    .column.yellow { background-color: #e1b970; background-image: url('https://www.lstyoungkhl.edu.hk/sites/default/files/ExamTimer/score/3.png'); }
    .column.green  { background-color: #588849; background-image: url('https://www.lstyoungkhl.edu.hk/sites/default/files/ExamTimer/score/4.png'); }

    .buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .button-row {
      display: flex;
      justify-content: center;
    }

    button {
      background-color: transparent;
      border: 1px solid white;
      color: white;
      padding: 5px 10px;
      margin: 5px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s, color 0.3s;
    }

    button:hover {
      background-color: white;
      color: black;
    }

    .score-container {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .score {
      font-size: 60px;
      font-weight: bold;
      color: white;
      text-align: center;
    }

    .score-update {
      animation: scoreAnimation 0.3s;
    }

    @keyframes scoreAnimation {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="scoreboard">
    <div class="column red">
      <div class="buttons">
        <div class="button-row">
          <button onclick="addPoints('red', 100)">+100</button>
          <button onclick="addPoints('red', 10)">+10</button>
          <button onclick="addPoints('red', 1)">+1</button>
        </div>
        <div class="button-row">
          <button onclick="addPoints('red', -100)">-100</button>
          <button onclick="addPoints('red', -10)">-10</button>
          <button onclick="addPoints('red', -1)">-1</button>
        </div>
        <div class="reset-button">
          <button onclick="resetScore('red')">Reset</button>
        </div>
      </div>
      <div class="score-container">
        <div class="score" id="red-score">0</div>
      </div>
    </div>
    <div class="column purple">
      <div class="buttons">
        <div class="button-row">
          <button onclick="addPoints('purple', 100)">+100</button>
          <button onclick="addPoints('purple', 10)">+10</button>
          <button onclick="addPoints('purple', 1)">+1</button>
        </div>
        <div class="button-row">
          <button onclick="addPoints('purple', -100)">-100</button>
          <button onclick="addPoints('purple', -10)">-10</button>
          <button onclick="addPoints('purple', -1)">-1</button>
        </div>
        <div class="reset-button">
          <button onclick="resetScore('purple')">Reset</button>
        </div>
      </div>
      <div class="score-container">
        <div class="score" id="purple-score">0</div>
      </div>
    </div>
    <div class="column yellow">
      <div class="buttons">
        <div class="button-row">
          <button onclick="addPoints('yellow', 100)">+100</button>
          <button onclick="addPoints('yellow', 10)">+10</button>
          <button onclick="addPoints('yellow', 1)">+1</button>
        </div>
        <div class="button-row">
          <button onclick="addPoints('yellow', -100)">-100</button>
          <button onclick="addPoints('yellow', -10)">-10</button>
          <button onclick="addPoints('yellow', -1)">-1</button>
        </div>
        <div class="reset-button">
          <button onclick="resetScore('yellow')">Reset</button>
        </div>
      </div>
      <div class="score-container">
        <div class="score" id="yellow-score">0</div>
      </div>
    </div>
    <div class="column green">
      <div class="buttons">
        <div class="button-row">
          <button onclick="addPoints('green', 100)">+100</button>
          <button onclick="addPoints('green', 10)">+10</button>
          <button onclick="addPoints('green', 1)">+1</button>
        </div>
        <div class="button-row">
          <button onclick="addPoints('green', -100)">-100</button>
          <button onclick="addPoints('green', -10)">-10</button>
          <button onclick="addPoints('green', -1)">-1</button>
        </div>
        <div class="reset-button">
          <button onclick="resetScore('green')">Reset</button>
        </div>
      </div>
      <div class="score-container">
        <div class="score" id="green-score">0</div>
      </div>
    </div>
  </div>
  <script>
    function addPoints(team, points) {
      var scoreElement = document.getElementById(team + '-score');
      var currentScore = parseInt(scoreElement.textContent, 10);
      scoreElement.textContent = currentScore + points;
      scoreElement.classList.add('score-update');
      setTimeout(() => {
        scoreElement.classList.remove('score-update');
      }, 300);
    }
    function resetScore(team) {
      var scoreElement = document.getElementById(team + '-score');
      scoreElement.textContent = 0;
      scoreElement.classList.add('score-update');
      setTimeout(() => {
        scoreElement.classList.remove('score-update');
      }, 300);
    }
  </script>
</body>
</html>
