<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4-House Scoreboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #111827; color: #fff; height: 100vh; display: flex; }
    .board { display: grid; grid-template-columns: repeat(4, 1fr); width: 100%; height: 100%; gap: 8px; padding: 8px; }
    .team { display: flex; flex-direction: column; border-radius: 12px; padding: 20px; justify-content: space-between; }
    .team:nth-child(1) { background: #dc2626; } /* Red House */
    .team:nth-child(2) { background: #eab308; color: #111; } /* Yellow House */
    .team:nth-child(3) { background: #2563eb; } /* Blue House */
    .team:nth-child(4) { background: #16a34a; } /* Green House */
    .controls { display: flex; flex-direction: column; gap: 10px; }
    .btn-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .btn-single { display: flex; justify-content: center; }
    button {
      padding: 10px; font-size: 1.1rem; font-weight: bold; border: none;
      border-radius: 6px; cursor: pointer; background: rgba(255,255,255,0.2); color: inherit;
    }
    button:hover { background: rgba(255,255,255,0.35); }
    .score-box { flex: 1; display: flex; align-items: center; justify-content: center; }
    .score { font-size: 9vw; font-weight: 800; line-height: 1; user-select: none; }
  </style>
</head>
<body>
  <div class="board" id="board"></div>

  <script>
    const teams = ["House A", "House B", "House C", "House D"];
    const scores = JSON.parse(localStorage.getItem("scoreboard_scores")) || [0, 0, 0, 0];
    const board = document.getElementById("board");

    function saveAndRender() {
      localStorage.setItem("scoreboard_scores", JSON.stringify(scores));
      document.querySelectorAll(".score").forEach((el, i) => el.textContent = scores[i]);
    }

    function updateScore(index, delta) {
      scores[index] += delta;
      saveAndRender();
    }

    function resetScore(index) {
      scores[index] = 0;
      saveAndRender();
    }

    teams.forEach((name, idx) => {
      const card = document.createElement("div");
      card.className = "team";
      card.innerHTML = `
        <div class="controls">
          <div class="btn-group">
            <button onclick="updateScore(${idx}, 1)">+1</button>
            <button onclick="updateScore(${idx}, 5)">+5</button>
            <button onclick="updateScore(${idx}, 10)">+10</button>
          </div>
          <div class="btn-group">
            <button onclick="updateScore(${idx}, -1)">-1</button>
            <button onclick="updateScore(${idx}, -5)">-5</button>
            <button onclick="updateScore(${idx}, -10)">-10</button>
          </div>
          <div class="btn-single">
            <button onclick="resetScore(${idx})">Reset (${name})</button>
          </div>
        </div>
        <div class="score-box">
          <div class="score">${scores[idx]}</div>
        </div>
      `;
      board.appendChild(card);
    });
  </script>
</body>
</html>
