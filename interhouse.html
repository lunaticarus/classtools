<!DOCTYPE html>
<html>
<head>
  <title>Scoreboard</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .scoreboard {
      display: flex;
      width: 100vw;
      height: 100vh;
      box-sizing: border-box;
    }

    .column {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      position: relative;
      box-sizing: border-box;
      background-size: 100% auto;
      background-position: bottom;
      background-repeat: no-repeat;
      transition: box-shadow 0.2s ease;
    }

    .column.red    { background-color: #c0524d; background-image: url('https://www.lstyoungkhl.edu.hk/sites/default/files/ExamTimer/score/1.png'); }
    .column.purple { background-color: #5a3275; background-image: url('https://www.lstyoungkhl.edu.hk/sites/default/files/ExamTimer/score/2.png'); }
    .column.yellow { background-color: #e1b970; background-image: url('https://www.lstyoungkhl.edu.hk/sites/default/files/ExamTimer/score/3.png'); }
    .column.green  { background-color: #588849; background-image: url('https://www.lstyoungkhl.edu.hk/sites/default/files/ExamTimer/score/4.png'); }

    .column.leader {
      box-shadow: inset 0 0 40px rgba(255, 255, 255, 0.25);
    }

    .buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
      opacity: 0.25;
      transition: opacity 0.15s ease;
    }

    .column:hover .buttons {
      opacity: 1;
    }

    body.hide-controls .buttons {
      opacity: 0 !important;
      pointer-events: none;
    }

    .button-row {
      display: flex;
      justify-content: center;
    }

    button {
      background-color: transparent;
      border: 1px solid white;
      color: white;
      padding: 6px 12px;
      margin: 5px;
      cursor: pointer;
      font-size: 16px;
      user-select: none;
      touch-action: manipulation; /* Eliminates 300ms tap delay */
      transition: background-color 0.1s, color 0.1s, transform 0.05s;
    }

    button:hover {
      background-color: white;
      color: black;
    }

    button:active {
      transform: scale(0.94); /* Instant tactile feedback */
    }

    .score-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding-bottom: 12vh;
      z-index: 1;
    }

    .crown {
      font-size: clamp(24px, 2.5vw, 42px);
      height: 1.2em;
      margin-bottom: 4px;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .column.leader .crown {
      opacity: 1;
      transform: translateY(0);
    }

    .score {
      font-size: clamp(48px, 6.5vw, 130px);
      font-weight: bold;
      color: white;
      text-align: center;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.35);
      user-select: none;
      will-change: transform; /* Promotes score to GPU layer */
    }

    .score-update {
      animation: scoreAnimation 0.22s ease-out;
    }

    @keyframes scoreAnimation {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="scoreboard">
    <div class="column red" id="col-red">
      <div class="buttons">
        <div class="button-row">
          <button data-team="red" data-pts="100">+100</button>
          <button data-team="red" data-pts="10">+10</button>
          <button data-team="red" data-pts="1">+1</button>
        </div>
        <div class="button-row">
          <button data-team="red" data-pts="-100">-100</button>
          <button data-team="red" data-pts="-10">-10</button>
          <button data-team="red" data-pts="-1">-1</button>
        </div>
        <div class="button-row">
          <button data-team="red" data-action="undo">Undo</button>
          <button data-team="red" data-action="reset">Reset</button>
        </div>
      </div>
      <div class="score-container">
        <div class="crown">👑</div>
        <div class="score" id="red-score">0</div>
      </div>
    </div>

    <div class="column purple" id="col-purple">
      <div class="buttons">
        <div class="button-row">
          <button data-team="purple" data-pts="100">+100</button>
          <button data-team="purple" data-pts="10">+10</button>
          <button data-team="purple" data-pts="1">+1</button>
        </div>
        <div class="button-row">
          <button data-team="purple" data-pts="-100">-100</button>
          <button data-team="purple" data-pts="-10">-10</button>
          <button data-team="purple" data-pts="-1">-1</button>
        </div>
        <div class="button-row">
          <button data-team="purple" data-action="undo">Undo</button>
          <button data-team="purple" data-action="reset">Reset</button>
        </div>
      </div>
      <div class="score-container">
        <div class="crown">👑</div>
        <div class="score" id="purple-score">0</div>
      </div>
    </div>

    <div class="column yellow" id="col-yellow">
      <div class="buttons">
        <div class="button-row">
          <button data-team="yellow" data-pts="100">+100</button>
          <button data-team="yellow" data-pts="10">+10</button>
          <button data-team="yellow" data-pts="1">+1</button>
        </div>
        <div class="button-row">
          <button data-team="yellow" data-pts="-100">-100</button>
          <button data-team="yellow" data-pts="-10">-10</button>
          <button data-team="yellow" data-pts="-1">-1</button>
        </div>
        <div class="button-row">
          <button data-team="yellow" data-action="undo">Undo</button>
          <button data-team="yellow" data-action="reset">Reset</button>
        </div>
      </div>
      <div class="score-container">
        <div class="crown">👑</div>
        <div class="score" id="yellow-score">0</div>
      </div>
    </div>

    <div class="column green" id="col-green">
      <div class="buttons">
        <div class="button-row">
          <button data-team="green" data-pts="100">+100</button>
          <button data-team="green" data-pts="10">+10</button>
          <button data-team="green" data-pts="1">+1</button>
        </div>
        <div class="button-row">
          <button data-team="green" data-pts="-100">-100</button>
          <button data-team="green" data-pts="-10">-10</button>
          <button data-team="green" data-pts="-1">-1</button>
        </div>
        <div class="button-row">
          <button data-team="green" data-action="undo">Undo</button>
          <button data-team="green" data-action="reset">Reset</button>
        </div>
      </div>
      <div class="score-container">
        <div class="crown">👑</div>
        <div class="score" id="green-score">0</div>
      </div>
    </div>
  </div>

  <script>
    const teams = ['red', 'purple', 'yellow', 'green'];
    const STORAGE_KEY = 'lst_scoreboard_v1';
    let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
      red: 0, purple: 0, yellow: 0, green: 0
    };
    const history = { red: [], purple: [], yellow: [], green: [] };

    // Cache DOM references once on load instead of querying on every click
    const scoreEls = {};
    const colEls = {};
    teams.forEach(t => {
      scoreEls[t] = document.getElementById(t + '-score');
      colEls[t] = document.getElementById('col-' + t);
    });

    // Debounce localStorage writes so rapid clicks never block the main thread
    let saveTimer = null;
    function scheduleSave() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }, 250);
    }

    // Non-blocking Web Audio chime
    let audioCtx = null;
    function playTone(type) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;
        if (type === 'up') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.1);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (type === 'down') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(329.63, now);
          osc.frequency.exponentialRampToValueAtTime(220.00, now + 0.12);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
          osc.start(now);
          osc.stop(now + 0.14);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(261.63, now);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          osc.start(now);
          osc.stop(now + 0.15);
        }
      } catch (e) {}
    }

    function updateDisplay(animateTeam = null) {
      const maxScore = Math.max(...teams.map(t => state[t]));

      teams.forEach(team => {
        scoreEls[team].textContent = state[team];
        colEls[team].classList.toggle('leader', maxScore > 0 && state[team] === maxScore);
      });

      if (animateTeam) {
        const el = scoreEls[animateTeam];
        el.classList.remove('score-update');
        // Schedule on next animation frame instead of forcing synchronous layout reflow
        requestAnimationFrame(() => el.classList.add('score-update'));
      }

      scheduleSave();
    }

    // Use pointerdown for instant 0ms response on both mouse and touchscreens
    document.querySelector('.scoreboard').addEventListener('pointerdown', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      e.preventDefault();

      const team = btn.dataset.team;
      if (btn.dataset.pts) {
        const points = parseInt(btn.dataset.pts, 10);
        history[team].push(state[team]);
        state[team] += points;
        updateDisplay(team);
        playTone(points > 0 ? 'up' : 'down');
      } else if (btn.dataset.action === 'undo') {
        if (history[team].length === 0) return;
        state[team] = history[team].pop();
        updateDisplay(team);
        playTone('reset');
      } else if (btn.dataset.action === 'reset') {
        if (state[team] === 0) return;
        // Defer confirm() by 1 frame so button active state renders cleanly first
        setTimeout(() => {
          if (confirm(`Reset ${team.toUpperCase()} score to 0?`)) {
            history[team].push(state[team]);
            state[team] = 0;
            updateDisplay(team);
            playTone('reset');
          }
        }, 0);
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'h') {
        document.body.classList.toggle('hide-controls');
      }
    });

    updateDisplay();
  </script>
</body>
</html>
