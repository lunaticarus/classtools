<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conditionals Challenge</title>
    <style>
        :root {
            --bg-color: #f5f5f7;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --accent-color: #007aff;
            --text-color: #1d1d1f;
            --error-color: #ff3b30;
            --success-color: #34c759;
            --secondary-text: #86868b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.4);
            text-align: center;
        }

        h1 { font-weight: 600; font-size: 22px; margin-bottom: 8px; }
        .sub-text { color: var(--secondary-text); font-size: 14px; margin-bottom: 24px; }

        .progress-container {
            height: 4px;
            background: #e5e5ea;
            border-radius: 2px;
            margin-bottom: 30px;
        }
        #progress-fill {
            height: 100%;
            background: var(--accent-color);
            width: 0%;
            transition: width 0.4s ease;
            border-radius: 2px;
        }

        .question-box { text-align: left; }
        .sentence { font-size: 19px; line-height: 1.5; margin-bottom: 20px; font-weight: 400; }
        
        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 1px solid #d2d2d7;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.5);
            font-size: 16px;
            margin-bottom: 12px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s;
        }

        input[type="text"]:focus { border-color: var(--accent-color); box-shadow: 0 0 0 3px rgba(0,122,255,0.1); }

        .feedback-msg {
            height: 20px;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: 600;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn:active { transform: scale(0.98); }

        .correct-flash { border-color: var(--success-color) !important; background: rgba(52, 199, 89, 0.1) !important; }
        .wrong-flash { border-color: var(--error-color) !important; background: rgba(255, 59, 48, 0.1) !important; }

        .hidden { display: none; }
        .code-box {
            background: #fff;
            padding: 15px;
            border-radius: 14px;
            border: 1px solid #d2d2d7;
            font-family: monospace;
            font-size: 18px;
            color: var(--accent-color);
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="quiz-ui">
        <h1 id="q-count">Question 1 of 30</h1>
        <div class="sub-text">Score: <span id="current-score">0</span></div>
        
        <div class="progress-container">
            <div id="progress-fill"></div>
        </div>

        <div class="question-box">
            <p id="sentence" class="sentence"></p>
            <div id="feedback" class="feedback-msg"></div>
            <input type="text" id="ans1" placeholder="First blank" autocomplete="off">
            <input type="text" id="ans2" placeholder="Second blank" autocomplete="off">
            <button class="btn" id="action-btn" onclick="handleSubmit()">Check Answer</button>
        </div>
    </div>

    <div id="result-ui" class="hidden">
        <h1>Challenge Complete</h1>
        <p id="final-stats"></p>
        <div id="pass-ui" class="hidden">
            <p style="color: var(--success-color); font-weight: 600;">Success! Here is your completion code:</p>
            <div class="code-box" id="unique-code"></div>
        </div>
        <div id="fail-ui" class="hidden">
            <p style="color: var(--error-color);">You need 80% to pass. Please try again.</p>
            <button class="btn" onclick="location.reload()">Restart</button>
        </div>
    </div>
</div>

<script>
    const pool = [
        { s: "If you ____ (drop) this glass, it _____ (break).", a1: "drop", a2: "breaks" },
        { s: "If you ____ (heat) ice, it ____ (melt).", a1: "heat", a2: "melts" },
        { s: "If it ____ (rain) tomorrow, we ____ (stay) home.", a1: "rains", a2: "will stay" },
        { s: "If I ____ (be) you, I ____ (see) a doctor.", a1: "were", a2: "would see" },
        { s: "If they ____ (arrive) earlier, they ____ (catch) the bus.", a1: "had arrived", a2: "would have caught" },
        { s: "Plants ____ (die) if they ____ (not get) water.", a1: "die", a2: "don't get" },
        { s: "If she ____ (study) more, she ____ (pass) the test next week.", a1: "studies", a2: "will pass" },
        { s: "If I ____ (have) a million dollars, I ____ (buy) a boat.", a1: "had", a2: "would buy" },
        { s: "If we ____ (not forget) the map, we ____ (not be) lost now.", a1: "hadn't forgotten", a2: "wouldn't be" },
        { s: "Water ____ (boil) if it ____ (reach) 100 degrees.", a1: "boils", a2: "reaches" },
        { s: "If you ____ (mix) blue and yellow, you ____ (get) green.", a1: "mix", a2: "get" },
        { s: "If he ____ (call) me, I ____ (tell) him the truth.", a1: "calls", a2: "will tell" },
        { s: "If I ____ (know) the answer, I ____ (tell) you.", a1: "knew", a2: "would tell" },
        { s: "If it ____ (be) sunny, we ____ (go) to the park.", a1: "is", a2: "will go" },
        { s: "If you ____ (not eat), you ____ (get) hungry.", a1: "don't eat", a2: "get" },
        { s: "If I ____ (speak) Japanese, I ____ (work) in Tokyo.", a1: "spoke", a2: "would work" },
        { s: "If she ____ (invite) me, I ____ (go) to the party.", a1: "had invited", a2: "would have gone" },
        { s: "If you ____ (touch) the oven, you ____ (get) burned.", a1: "touch", a2: "get" },
        { s: "If we ____ (win) the game, we ____ (celebrate).", a1: "win", a2: "will celebrate" },
        { s: "If he ____ (be) here, he ____ (help) us.", a1: "were", a2: "would help" },
        { s: "If they ____ (listen), they ____ (understand).", a1: "had listened", a2: "would have understood" },
        { s: "If you ____ (freeze) water, it ____ (become) solid.", a1: "freeze", a2: "becomes" },
        { s: "If I ____ (see) her, I ____ (say) hello.", a1: "see", a2: "will say" },
        { s: "If we ____ (have) more time, we ____ (finish) it.", a1: "had", a2: "would finish" },
        { s: "If you ____ (study) hard, you ____ (get) an A.", a1: "had studied", a2: "would have got" },
        { s: "If it ____ (snow), we ____ (make) a snowman.", a1: "snows", a2: "will make" },
        { s: "If I ____ (be) a bird, I ____ (fly) away.", a1: "were", a2: "would fly" },
        { s: "If she ____ (be) careful, she ____ (not break) the vase.", a1: "had been", a2: "wouldn't have broken" },
        { s: "If you ____ (not sleep), you ____ (feel) tired.", a1: "don't sleep", a2: "feel" },
        { s: "If they ____ (ask), I ____ (help) them.", a1: "ask", a2: "will help" }
    ];

    let currentQuestions = [];
    let idx = 0;
    let score = 0;
    let isLocked = false;

    function init() {
        currentQuestions = pool.sort(() => 0.5 - Math.random()).slice(0, 30);
        renderQuestion();
    }

    function renderQuestion() {
        isLocked = false;
        const q = currentQuestions[idx];
        document.getElementById('q-count').innerText = `Question ${idx + 1} of 30`;
        document.getElementById('sentence').innerText = q.s;
        document.getElementById('ans1').value = "";
        document.getElementById('ans2').value = "";
        document.getElementById('ans1').className = "";
        document.getElementById('ans2').className = "";
        document.getElementById('feedback').innerText = "";
        document.getElementById('action-btn').innerText = "Check Answer";
        document.getElementById('progress-fill').style.width = `${(idx / 30) * 100}%`;
    }

    function handleSubmit() {
        if (isLocked) {
            idx++;
            if (idx < 30) renderQuestion();
            else showFinalResult();
            return;
        }

        const q = currentQuestions[idx];
        const v1 = document.getElementById('ans1').value.trim().toLowerCase();
        const v2 = document.getElementById('ans2').value.trim().toLowerCase();
        
        const clean = (s) => s.replace("can't", "cannot").replace("don't", "do not").replace("doesn't", "does not").replace("won't", "will not").replace("didn't", "did not").replace("hadn't", "had not").replace("wouldn't", "would not").replace("haven't", "have not").replace("'d", " would");

        const isCorrect = clean(v1) === clean(q.a1.toLowerCase()) && clean(v2) === clean(q.a2.toLowerCase());

        isLocked = true;
        const f = document.getElementById('feedback');
        
        if (isCorrect) {
            score++;
            f.innerText = "Correct!";
            f.style.color = "var(--success-color)";
            document.getElementById('ans1').classList.add('correct-flash');
            document.getElementById('ans2').classList.add('correct-flash');
        } else {
            f.innerText = `Incorrect. Answers: ${q.a1}, ${q.a2}`;
            f.style.color = "var(--error-color)";
            document.getElementById('ans1').classList.add('wrong-flash');
            document.getElementById('ans2').classList.add('wrong-flash');
        }

        document.getElementById('current-score').innerText = score;
        document.getElementById('action-btn').innerText = "Next Question";
    }

    function showFinalResult() {
        document.getElementById('quiz-ui').classList.add('hidden');
        document.getElementById('result-ui').classList.remove('hidden');
        
        const percent = Math.round((score / 30) * 100);
        document.getElementById('final-stats').innerText = `You answered ${score} out of 30 questions correctly (${percent}%).`;

        if (percent >= 80) {
            document.getElementById('pass-ui').classList.remove('hidden');
            document.getElementById('unique-code').innerText = "COND-" + Math.random().toString(36).substring(2, 10).toUpperCase();
        } else {
            document.getElementById('fail-ui').classList.remove('hidden');
        }
    }

    // Allow "Enter" key to submit/next
    document.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') handleSubmit();
    });

    init();
</script>

</body>
</html>
