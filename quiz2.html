<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conditionals Challenge</title>
    <style>
        :root {
            --bg-color: #f5f5f7;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --accent-color: #007aff;
            --text-color: #1d1d1f;
            --error-color: #ff3b30;
            --success-color: #34c759;
            --secondary-text: #86868b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.4);
            text-align: center;
        }

        h1 { font-weight: 600; font-size: 20px; margin-bottom: 5px; }
        .type-badge {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(0, 122, 255, 0.1);
            color: var(--accent-color);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        .progress-container {
            height: 4px;
            background: #e5e5ea;
            border-radius: 2px;
            margin-bottom: 25px;
        }
        #progress-fill {
            height: 100%;
            background: var(--accent-color);
            width: 0%;
            transition: width 0.4s ease;
            border-radius: 2px;
        }

        .question-box { text-align: left; }
        .sentence { font-size: 18px; line-height: 1.6; margin-bottom: 20px; font-weight: 400; }
        
        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 1px solid #d2d2d7;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.5);
            font-size: 16px;
            margin-bottom: 12px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s;
        }

        input[type="text"]:focus { border-color: var(--accent-color); }

        .feedback-msg {
            height: 24px;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.2s;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        .correct-flash { border-color: var(--success-color) !important; background: rgba(52, 199, 89, 0.05) !important; }
        .wrong-flash { border-color: var(--error-color) !important; background: rgba(255, 59, 48, 0.05) !important; }

        .hidden { display: none; }
        .code-box {
            background: #fff;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #d2d2d7;
            font-family: 'SF Mono', monospace;
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-color);
            margin: 20px 0;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="quiz-ui">
        <div id="type-display" class="type-badge">TYPE 0</div>
        <h1 id="q-count">Question 1 of 50</h1>
        <p style="color: var(--secondary-text); font-size: 13px; margin-bottom: 15px;">Target: 80% Accuracy</p>
        
        <div class="progress-container">
            <div id="progress-fill"></div>
        </div>

        <div class="question-box">
            <p id="sentence" class="sentence"></p>
            <div id="feedback" class="feedback-msg"></div>
            <input type="text" id="ans1" placeholder="First blank" autocomplete="off">
            <input type="text" id="ans2" placeholder="Second blank" autocomplete="off">
            <button class="btn" id="action-btn" onclick="handleSubmit()">Check Answer</button>
        </div>
    </div>

    <div id="result-ui" class="hidden">
        <h1>Task Complete</h1>
        <p id="final-stats"></p>
        <div id="pass-ui" class="hidden">
            <p style="color: var(--success-color); font-weight: 600;">Verification Code:</p>
            <div class="code-box" id="unique-code"></div>
            <p style="font-size: 12px; color: var(--secondary-text);">Screenshot this for your teacher.</p>
        </div>
        <div id="fail-ui" class="hidden">
            <p style="color: var(--error-color);">You scored below 80%. Please refresh to try again.</p>
            <button class="btn" onclick="location.reload()">Retry Quiz</button>
        </div>
    </div>
</div>

<script>
    const pool = [
        // Type 0
        { s: "If you ____ (drop) this glass, it _____ (break).", a1: "drop", a2: "breaks", t: "TYPE 0" },
        { s: "If you ____ (heat) ice, it ____ (melt).", a1: "heat", a2: "melts", t: "TYPE 0" },
        { s: "Plants ____ (die) if they ____ (not get) water.", a1: "die", a2: "don't get", t: "TYPE 0" },
        { s: "If you ____ (mix) red and blue, you ____ (get) purple.", a1: "mix", a2: "get", t: "TYPE 0" },
        { s: "Water ____ (boil) if it ____ (reach) 100 degrees.", a1: "boils", a2: "reaches", t: "TYPE 0" },
        { s: "If you ____ (not eat), you ____ (get) hungry.", a1: "don't eat", a2: "get", t: "TYPE 0" },
        { s: "If you ____ (freeze) water, it ____ (become) ice.", a1: "freeze", a2: "becomes", t: "TYPE 0" },
        { s: "If people ____ (eat) too much, they ____ (get) fat.", a1: "eat", a2: "get", t: "TYPE 0" },
        { s: "If you ____ (touch) a fire, you ____ (get) burned.", a1: "touch", a2: "get", t: "TYPE 0" },
        { s: "Snakes ____ (bite) if they ____ (be) scared.", a1: "bite", a2: "are", t: "TYPE 0" },
        
        // Type 1
        { s: "If it ____ (rain) tomorrow, we ____ (stay) home.", a1: "rains", a2: "will stay", t: "TYPE 1" },
        { s: "If she ____ (study) hard, she ____ (pass) the exam.", a1: "studies", a2: "will pass", t: "TYPE 1" },
        { s: "If I ____ (see) him, I ____ (give) him your message.", a1: "see", a2: "will give", t: "TYPE 1" },
        { s: "They ____ (be) late if the train ____ (not arrive) soon.", a1: "will be", a2: "doesn't arrive", t: "TYPE 1" },
        { s: "If we ____ (go) to the park, we ____ (have) a picnic.", a1: "go", a2: "will have", t: "TYPE 1" },
        { s: "If he ____ (call) me, I ____ (tell) him the news.", a1: "calls", a2: "will tell", t: "TYPE 1" },
        { s: "If you ____ (not hurry), you ____ (miss) the bus.", a1: "don't hurry", a2: "will miss", t: "TYPE 1" },
        { s: "I ____ (buy) a new phone if I ____ (save) enough money.", a1: "will buy", a2: "save", t: "TYPE 1" },
        { s: "If they ____ (practice) every day, they ____ (win).", a1: "practice", a2: "will win", t: "TYPE 1" },
        { s: "If she ____ (come) to the party, she ____ (bring) a cake.", a1: "comes", a2: "will bring", t: "TYPE 1" },

        // Type 2
        { s: "If I ____ (be) you, I ____ (see) a doctor.", a1: "were", a2: "would see", t: "TYPE 2" },
        { s: "If I ____ (have) a million dollars, I ____ (buy) a boat.", a1: "had", a2: "would buy", t: "TYPE 2" },
        { s: "If he ____ (be) taller, he ____ (play) basketball.", a1: "were", a2: "would play", t: "TYPE 2" },
        { s: "If we ____ (live) in France, we ____ (speak) French.", a1: "lived", a2: "would speak", t: "TYPE 2" },
        { s: "I ____ (travel) more if I ____ (have) more time.", a1: "would travel", a2: "had", t: "TYPE 2" },
        { s: "If she ____ (know) his number, she ____ (call) him.", a1: "knew", a2: "would call", t: "TYPE 2" },
        { s: "If they ____ (invite) us, we ____ (go).", a1: "invited", a2: "would go", t: "TYPE 2" },
        { s: "If I ____ (be) the President, I ____ (change) the law.", a1: "were", a2: "would change", t: "TYPE 2" },
        { s: "We ____ (be) happy if we ____ (win) the lottery.", a1: "would be", a2: "won", t: "TYPE 2" },
        { s: "If you ____ (start) now, you ____ (finish) by tomorrow.", a1: "started", a2: "would finish", t: "TYPE 2" },

        // Type 3
        { s: "If they ____ (arrive) earlier, they ____ (catch) the bus.", a1: "had arrived", a2: "would have caught", t: "TYPE 3" },
        { s: "If we ____ (not forget) the map, we ____ (not be) lost.", a1: "hadn't forgotten", a2: "wouldn't have been", t: "TYPE 3" },
        { s: "If she ____ (study) harder, she ____ (pass) the test.", a1: "had studied", a2: "would have passed", t: "TYPE 3" },
        { s: "If I ____ (know) about the meeting, I ____ (attend).", a1: "had known", a2: "would have attended", t: "TYPE 3" },
        { s: "They ____ (win) if they ____ (play) better.", a1: "would have won", a2: "had played", t: "TYPE 3" },
        { s: "If he ____ (not be) sick, he ____ (come).", a1: "hadn't been", a2: "would have come", t: "TYPE 3" },
        { s: "If you ____ (ask) me, I ____ (help) you.", a1: "had asked", a2: "would have helped", t: "TYPE 3" },
        { s: "If we ____ (take) a taxi, we ____ (arrive) on time.", a1: "had taken", a2: "would have arrived", t: "TYPE 3" },
        { s: "I ____ (call) you if I ____ (not lose) my phone.", a1: "would have called", a2: "hadn't lost", t: "TYPE 3" },
        { s: "If they ____ (book) earlier, they ____ (get) a seat.", a1: "had booked", a2: "would have got", t: "TYPE 3" },

        // Extra Mix to reach 50+
        { s: "If you ____ (heat) water to 100 degrees, it ____ (boil).", a1: "heat", a2: "boils", t: "TYPE 0" },
        { s: "If she ____ (finish) her work, she ____ (go) out.", a1: "finishes", a2: "will go", t: "TYPE 1" },
        { s: "If I ____ (be) a bird, I ____ (fly) to you.", a1: "were", a2: "would fly", t: "TYPE 2" },
        { s: "If you ____ (be) there, you ____ (see) him.", a1: "had been", a2: "would have seen", t: "TYPE 3" },
        { s: "If it ____ (snow), we ____ (make) a snowman.", a1: "snows", a2: "will make", t: "TYPE 1" },
        { s: "If I ____ (know) his address, I ____ (send) a card.", a1: "knew", a2: "would send", t: "TYPE 2" },
        { s: "If she ____ (not fall), she ____ (not hurt) herself.", a1: "hadn't fallen", a2: "wouldn't have hurt", t: "TYPE 3" },
        { s: "If you ____ (add) sugar, the tea ____ (taste) sweet.", a1: "add", a2: "tastes", t: "TYPE 0" },
        { s: "If he ____ (try) harder, he ____ (succeed).", a1: "tries", a2: "will succeed", t: "TYPE 1" },
        { s: "If they ____ (have) more money, they ____ (buy) a house.", a1: "had", a2: "would buy", t: "TYPE 2" },
        { s: "If we ____ (leave) earlier, we ____ (not miss) the flight.", a1: "had left", a2: "wouldn't have missed", t: "TYPE 3" }
    ];

    let currentQuestions = [];
    let idx = 0;
    let score = 0;
    let isLocked = false;

    function init() {
        currentQuestions = pool.sort(() => 0.5 - Math.random()).slice(0, 50);
        renderQuestion();
    }

    function renderQuestion() {
        isLocked = false;
        const q = currentQuestions[idx];
        document.getElementById('type-display').innerText = q.t;
        document.getElementById('q-count').innerText = `Question ${idx + 1} of 50`;
        document.getElementById('sentence').innerText = q.s;
        document.getElementById('ans1').value = "";
        document.getElementById('ans2').value = "";
        document.getElementById('ans1').className = "";
        document.getElementById('ans2').className = "";
        document.getElementById('feedback').innerText = "";
        document.getElementById('action-btn').innerText = "Check Answer";
        document.getElementById('progress-fill').style.width = `${(idx / 50) * 100}%`;
    }

    function handleSubmit() {
        if (isLocked) {
            idx++;
            if (idx < 50) renderQuestion();
            else showFinalResult();
            return;
        }

        const q = currentQuestions[idx];
        const v1 = document.getElementById('ans1').value.trim().toLowerCase();
        const v2 = document.getElementById('ans2').value.trim().toLowerCase();
        
        const clean = (s) => s.replace("can't", "cannot").replace("don't", "do not").replace("doesn't", "does not").replace("won't", "will not").replace("didn't", "did not").replace("hadn't", "had not").replace("wouldn't", "would not").replace("'d", " would");

        const isCorrect = clean(v1) === clean(q.a1.toLowerCase()) && clean(v2) === clean(q.a2.toLowerCase());

        isLocked = true;
        const f = document.getElementById('feedback');
        
        if (isCorrect) {
            score++;
            f.innerText = "Correct!";
            f.style.color = "var(--success-color)";
            document.getElementById('ans1').classList.add('correct-flash');
            document.getElementById('ans2').classList.add('correct-flash');
        } else {
            f.innerText = `Incorrect. Answers: ${q.a1} | ${q.a2}`;
            f.style.color = "var(--error-color)";
            document.getElementById('ans1').classList.add('wrong-flash');
            document.getElementById('ans2').classList.add('wrong-flash');
        }

        document.getElementById('action-btn').innerText = "Next Question";
    }

    function showFinalResult() {
        document.getElementById('quiz-ui').classList.add('hidden');
        document.getElementById('result-ui').classList.remove('hidden');
        
        const percent = Math.round((score / 50) * 100);
        document.getElementById('final-stats').innerText = `Final Score: ${score}/50 (${percent}%)`;

        if (percent >= 80) {
            document.getElementById('pass-ui').classList.remove('hidden');
            const randomID = Math.random().toString(36).substring(2, 8).toUpperCase();
            document.getElementById('unique-code').innerText = `PASS-${score}-${randomID}`;
        } else {
            document.getElementById('fail-ui').classList.remove('hidden');
        }
    }

    document.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSubmit(); });
    init();
</script>
</body>
</html>
