<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conditionals Mastery Challenge</title>
    <style>
        :root {
            --bg-color: #f5f5f7;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --accent-color: #007aff;
            --text-color: #1d1d1f;
            --error-color: #ff3b30;
            --success-color: #34c759;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: center;
        }

        h1 { font-weight: 600; font-size: 24px; margin-bottom: 20px; }
        
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 14px; margin-bottom: 5px; color: #86868b; }
        
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #d2d2d7;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.8);
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s;
            width: 100%;
            margin-top: 10px;
        }

        .btn:hover { opacity: 0.8; }

        .hidden { display: none; }

        .question-box { text-align: left; margin-bottom: 20px; }
        .sentence { font-size: 18px; line-height: 1.6; margin-bottom: 15px; }
        .progress-bar {
            height: 6px;
            background: #e5e5ea;
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        #progress-fill {
            height: 100%;
            background: var(--accent-color);
            width: 0%;
            transition: width 0.3s;
        }

        .feedback { margin-top: 10px; font-weight: 500; }
        .pass { color: var(--success-color); }
        .fail { color: var(--error-color); }

        .cert-box {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            border: 2px dashed #d2d2d7;
            margin-top: 20px;
        }
        .unique-code { font-family: monospace; font-size: 20px; font-weight: bold; color: var(--accent-color); }
    </style>
</head>
<body>

<div class="container" id="app">
    <!-- Landing Page -->
    <div id="landing">
        <h1>Conditionals Challenge</h1>
        <p style="color: #86868b; margin-bottom: 30px;">Complete 30 questions with 80% accuracy to pass.</p>
        <div class="input-group">
            <label>Class (e.g., 4A)</label>
            <input type="text" id="studentClass" placeholder="Enter class" required>
        </div>
        <div class="input-group">
            <label>Class Number</label>
            <input type="number" id="studentNo" placeholder="Enter number" required>
        </div>
        <div class="input-group">
            <label>English Name</label>
            <input type="text" id="studentName" placeholder="Enter name" required>
        </div>
        <button class="btn" onclick="startQuiz()">Start Quiz</button>
    </div>

    <!-- Quiz Page -->
    <div id="quiz" class="hidden">
        <div class="progress-bar"><div id="progress-fill"></div></div>
        <div class="question-box">
            <p id="question-text" class="sentence"></p>
            <input type="text" id="answer1" placeholder="First blank" style="margin-bottom: 10px;">
            <input type="text" id="answer2" placeholder="Second blank">
        </div>
        <button class="btn" id="submit-btn" onclick="checkAnswer()">Submit Answer</button>
    </div>

    <!-- Result Page -->
    <div id="result" class="hidden">
        <h1 id="result-title">Results</h1>
        <p id="score-text"></p>
        <div id="pass-content" class="hidden">
            <div class="cert-box">
                <p>Completion Certificate</p>
                <p id="cert-info"></p>
                <p class="unique-code" id="unique-code"></p>
            </div>
            <p style="font-size: 12px; color: #86868b; margin-top: 10px;">Show this screen to your teacher.</p>
        </div>
        <div id="fail-content" class="hidden">
            <p class="fail">You did not reach the 80% threshold.</p>
            <button class="btn" onclick="location.reload()">Try Again</button>
        </div>
    </div>
</div>

<script>
    const questionPool = [
        { s: "If you ____ (drop) this glass, it _____ (break).", a1: "drop", a2: "breaks", t: 0 },
        { s: "If it ____ (rain), the grass ____ (get) wet.", a1: "rains", a2: "gets", t: 0 },
        { s: "If plants ____ (not get) water, they ____ (die).", a1: "do not get", a2: "die", t: 0 },
        { s: "If you ____ (mix) red and blue, you ____ (get) purple.", a1: "mix", a2: "get", t: 0 },
        { s: "If I ____ (be) late for work, my boss ____ (get) angry.", a1: "am", a2: "gets", t: 0 },
        { s: "If you ____ (finish) your homework, we ____ (go) to the cinema.", a1: "finish", a2: "will go", t: 1 },
        { s: "If she ____ (study) hard, she ____ (pass) the exam.", a1: "studies", a2: "will pass", t: 1 },
        { s: "If they ____ (not hurry), they ____ (miss) the bus.", a1: "don't hurry", a2: "will miss", t: 1 },
        { s: "If I ____ (win) the lottery, I ____ (travel) around the world.", a1: "won", a2: "would travel", t: 2 },
        { s: "If he ____ (be) taller, he ____ (play) basketball.", a1: "were", a2: "would play", t: 2 },
        { s: "If we ____ (have) a car, we ____ (drive) to the beach.", a1: "had", a2: "would drive", t: 2 },
        { s: "If they ____ (know) her address, they ____ (send) her an invitation.", a1: "knew", a2: "would send", t: 2 },
        { s: "If you ____ (study) for the test, you ____ (pass) it.", a1: "had studied", a2: "would have passed", t: 3 },
        { s: "If I ____ (see) him, I ____ (tell) him the news.", a1: "had seen", a2: "would have told", t: 3 },
        { s: "If we ____ (not take) a taxi, we ____ (be) late.", a1: "hadn't taken", a2: "would have been", t: 3 },
        // ... (Remaining 85 questions would be populated here)
        // Adding more samples to ensure 30 logic works for this demo
        { s: "If you ____ (freeze) water, it ____ (become) ice.", a1: "freeze", a2: "becomes", t: 0 },
        { s: "If she ____ (have) time, she ____ (call) you later.", a1: "has", a2: "will call", t: 1 },
        { s: "If I ____ (know) his number, I ____ (call) him.", a1: "knew", a2: "would call", t: 2 },
        { s: "If they ____ (invite) us, we ____ (go) to the party.", a1: "had invited", a2: "would have gone", t: 3 },
        { s: "If you ____ (touch) a fire, you ____ (get) burned.", a1: "touch", a2: "get", t: 0 },
        { s: "If he ____ (eat) all that, he ____ (be) ill.", a1: "eats", a2: "will be", t: 1 },
        { s: "If I ____ (be) a bird, I ____ (fly) to you.", a1: "were", a2: "would fly", t: 2 },
        { s: "If she ____ (be) more careful, she ____ (not fall).", a1: "had been", a2: "wouldn't have fallen", t: 3 },
        { s: "If you ____ (not eat), you ____ (get) hungry.", a1: "don't eat", a2: "get", t: 0 },
        { s: "If we ____ (leave) now, we ____ (arrive) on time.", a1: "leave", a2: "will arrive", t: 1 },
        { s: "If I ____ (speak) French, I ____ (live) in Paris.", a1: "spoke", a2: "would live", t: 2 },
        { s: "If you ____ (ask) me, I ____ (help) you.", a1: "had asked", a2: "would have helped", t: 3 },
        { s: "If wood ____ (not get) oxygen, it ____ (not burn).", a1: "doesn't get", a2: "doesn't burn", t: 0 },
        { s: "If they ____ (practice), they ____ (win).", a1: "practice", a2: "will win", t: 1 },
        { s: "If I ____ (be) rich, I ____ (buy) an island.", a1: "were", a2: "would buy", t: 2 },
        { s: "If we ____ (book) earlier, it ____ (be) cheaper.", a1: "had booked", a2: "would have been", t: 3 }
    ];

    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let studentData = {};

    function startQuiz() {
        const sClass = document.getElementById('studentClass').value;
        const sNo = document.getElementById('studentNo').value;
        const sName = document.getElementById('studentName').value;

        if (!sClass || !sNo || !sName) {
            alert("Please fill in all details.");
            return;
        }

        studentData = { sClass, sNo, sName };
        currentQuestions = questionPool.sort(() => 0.5 - Math.random()).slice(0, 30);
        
        document.getElementById('landing').classList.add('hidden');
        document.getElementById('quiz').classList.remove('hidden');
        showQuestion();
    }

    function showQuestion() {
        const q = currentQuestions[currentIndex];
        document.getElementById('question-text').innerText = `Q${currentIndex + 1}: ${q.s}`;
        document.getElementById('answer1').value = "";
        document.getElementById('answer2').value = "";
        document.getElementById('progress-fill').style.width = `${(currentIndex / 30) * 100}%`;
    }

    function checkAnswer() {
        const q = currentQuestions[currentIndex];
        const ans1 = document.getElementById('answer1').value.trim().toLowerCase();
        const ans2 = document.getElementById('answer2').value.trim().toLowerCase();

        // Simple validation: check if user inputs match expected answers
        // Normalizing common contractions for Type 1-3
        const normalize = (str) => str.replace("can't", "cannot").replace("don't", "do not").replace("doesn't", "does not").replace("won't", "will not").replace("didn't", "did not").replace("hadn't", "had not").replace("wouldn't", "would not");

        if (normalize(ans1) === normalize(q.a1.toLowerCase()) && normalize(ans2) === normalize(q.a2.toLowerCase())) {
            score++;
        }

        currentIndex++;
        if (currentIndex < 30) {
            showQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('quiz').classList.add('hidden');
        document.getElementById('result').classList.remove('hidden');
        
        const percent = Math.round((score / 30) * 100);
        document.getElementById('score-text').innerText = `You scored ${score}/30 (${percent}%).`;

        if (percent >= 80) {
            document.getElementById('pass-content').classList.remove('hidden');
            document.getElementById('cert-info').innerText = `${studentData.sClass} (${studentData.sNo}) ${studentData.sName}`;
            document.getElementById('unique-code').innerText = generateCode();
        } else {
            document.getElementById('fail-content').classList.remove('hidden');
        }
    }

    function generateCode() {
        const prefix = studentData.sClass.substring(0,2).toUpperCase();
        const random = Math.random().toString(36).substring(2, 7).toUpperCase();
        return `${prefix}-${studentData.sNo}-${random}`;
    }
</script>

</body>
</html>
