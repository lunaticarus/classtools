<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoreboard Pro</title>
    <style>
        :root {
            /* Persistent Light Aesthetic */
            --system-blue: #007aff;
            --system-red: #ff3b30;
            --system-gray-bg: #f5f5f7;
            --system-card-bg: #ffffff;
            --system-border: rgba(0,0,0,0.08);
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --text-tertiary: #a1a1a6;
            --mode-active: #1d1d1f;
            --radius: 14px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            background-color: var(--system-gray-bg);
            color: var(--text-primary);
            margin: 0;
            padding: 100px 20px 140px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }

        h1 {
            font-weight: 600; font-size: 22px; letter-spacing: -0.5px;
            position: fixed; top: 20px; left: 30px; margin: 0; z-index: 100;
        }

        .top-nav {
            position: fixed; top: 25px; right: 30px;
            display: flex; gap: 24px; z-index: 100;
        }

        .minimal-btn {
            background: none; border: none;
            color: var(--text-tertiary); font-size: 13px;
            cursor: pointer; padding: 5px; transition: all 0.2s ease;
            font-weight: 500;
        }
        .minimal-btn:hover { color: var(--text-primary); }

        .container { width: 100%; max-width: 650px; }

        .setup-area {
            background: var(--system-card-bg);
            border-radius: 20px;
            padding: 0;
            margin-bottom: 20px;
            overflow: hidden;
            max-height: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--system-border);
            width: 100%;
        }
        .setup-area.open { padding: 24px; max-height: 500px; margin-bottom: 40px; }
        
        input, textarea {
            width: 100%; margin-bottom: 12px;
            background: var(--system-gray-bg);
            border: 1px solid var(--system-border);
            border-radius: 10px; padding: 12px;
            color: var(--text-primary); font-family: inherit; font-size: 15px;
            box-sizing: border-box; outline: none;
        }

        .toolbar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; width: 100%; flex-wrap: wrap; gap: 12px;
        }
        
        .apple-btn {
            background: var(--text-primary); color: white; border: none;
            padding: 8px 16px; border-radius: 18px; font-weight: 600; 
            cursor: pointer; font-size: 13px; transition: all 0.2s;
            display: flex; align-items: center; gap: 4px;
        }
        .apple-btn:active { opacity: 0.7; transform: scale(0.98); }
        .apple-btn.secondary { background: rgba(120, 120, 128, 0.16); color: var(--text-primary); }

        .student-row {
            display: grid; grid-template-columns: 44px 1fr 140px;
            background: var(--system-card-bg); margin-bottom: 8px;
            border-radius: var(--radius); border: 1px solid var(--system-border);
            align-items: center; padding: 8px; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .student-row.highlighted { 
            transform: scale(1.05); 
            border-color: var(--system-blue); 
            box-shadow: 0 12px 30px rgba(0,0,0,0.1); 
            z-index: 10;
        }
        .student-row.absent { opacity: 0.3; filter: grayscale(1); }

        .attendance-toggle { 
            font-size: 18px; cursor: pointer; border: none; background: none; color: var(--text-tertiary);
        }

        .student-info { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
        .student-name { font-weight: 500; font-size: 16px; }
        .medal { font-size: 18px; width: 24px; text-align: center; }

        .score-box { display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
        .score-display {
            font-size: 18px; font-weight: 700; width: 45px; text-align: center;
            font-variant-numeric: tabular-nums; cursor: pointer;
        }
        .points-btn {
            width: 32px; height: 32px; border-radius: 50%; border: none;
            background: rgba(120, 120, 128, 0.12); color: var(--text-primary);
            font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .points-btn:hover { background: rgba(120, 120, 128, 0.25); }

        .mode-hub {
            position: fixed; bottom: 30px; left: 30px;
            display: flex; flex-direction: column-reverse; align-items: flex-start; z-index: 1000;
        }
        .mode-trigger {
            font-weight: 700; color: var(--mode-active); cursor: pointer; font-size: 14px;
            padding: 5px 0; user-select: none;
        }
        .mode-options {
            display: none; flex-direction: column; background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 8px; border-radius: 14px; border: 1px solid var(--system-border);
            box-shadow: 0 8px 32px rgba(0,0,0,0.12); margin-bottom: 12px; min-width: 180px;
        }
        .mode-options.show { display: flex; }
        .mode-link {
            font-size: 13px; color: var(--text-primary); cursor: pointer; 
            padding: 8px 12px; border-radius: 8px; transition: 0.2s;
            display: flex; justify-content: space-between; align-items: center;
        }
        .mode-link:hover { background: var(--system-blue); color: white; }

        .status-counter {
            position: fixed; bottom: 35px; right: 30px;
            font-weight: 700; color: var(--mode-active); font-size: 14px;
            z-index: 100; pointer-events: none;
        }

        .hidden { display: none; }
        .empty-state { text-align: center; color: var(--text-tertiary); padding: 60px; font-size: 15px; }
    </style>
</head>
<body>

    <h1>Scoreboard</h1>

    <nav class="top-nav">
        <button class="minimal-btn" onclick="toggleSetup()">Add Class</button>
        <button class="minimal-btn" onclick="downloadData()">Backup</button>
        <button class="minimal-btn" onclick="document.getElementById('fileInput').click()">Load</button>
        <input type="file" id="fileInput" class="hidden" accept=".json" onchange="uploadData(event)">
    </nav>

    <div class="container">
        <div id="setupArea" class="setup-area">
            <h3 style="margin-top:0; font-size: 14px; color: var(--text-secondary); margin-bottom: 15px;">NEW CLASS</h3>
            <input type="text" id="className" placeholder="Class Name (e.g. Science 7B)">
            <textarea id="studentList" rows="5" placeholder="Paste student names (one per line)..."></textarea>
            <button onclick="addClass()" class="apple-btn" style="width:100%; padding:14px; justify-content: center;">Create Class</button>
        </div>

        <div id="scoreboardActions" class="toolbar hidden">
            <div style="display:flex; gap:8px;">
                <button class="apple-btn secondary" id="sort-original" onclick="setSort('original')">Order</button>
                <button class="apple-btn secondary" id="sort-alpha" onclick="setSort('alpha')">A-Z</button>
                <button class="apple-btn secondary" id="sort-score" onclick="setSort('score')">Rank</button>
            </div>
            <div style="display:flex; gap:8px;">
                <button class="apple-btn" onclick="pickRandom()">🎲 Random</button>
                <button class="apple-btn" id="noRepeatBtn" onclick="pickRandomNoRepeat()">♻️ Cycle 0/0</button>
                <button class="apple-btn" onclick="awardAll(1)">+1 All</button>
                <button class="minimal-btn" style="color:var(--system-red)" onclick="resetScores()">Reset</button>
            </div>
        </div>

        <div id="studentContainer"></div>
    </div>

    <div class="mode-hub">
        <div class="mode-trigger" id="currentClassLabel" onclick="toggleModeMenu()">Select Class</div>
        <div class="mode-options" id="tabsContainer"></div>
    </div>

    <div class="status-counter" id="presenceCounter">0 Present</div>

    <script>
        let state = { classes: [], lastSelectedIndex: null, lastSortMode: 'original' };
        const STORE_KEY = 'teacherApp_v7_light_only';

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if (type === 'up') {
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            } else {
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(150, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            }
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        }

        function sync() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
        
        function init() {
            const saved = localStorage.getItem(STORE_KEY);
            if (saved) { state = JSON.parse(saved); renderTabs(); }
        }

        function toggleSetup() { document.getElementById('setupArea').classList.toggle('open'); }
        function toggleModeMenu() { document.getElementById('tabsContainer').classList.toggle('show'); }

        function addClass() {
            const nameField = document.getElementById('className');
            const listField = document.getElementById('studentList');
            const names = listField.value.split('\n').map(n => n.trim()).filter(n => n !== "");
            if (!nameField.value || names.length === 0) return;
            
            state.classes.push({
                name: nameField.value,
                students: names.map((s, i) => ({ id: Date.now() + i, name: s, score: 0, order: i, absent: false })),
                pickedIds: []
            });
            
            nameField.value = ""; listField.value = "";
            state.lastSelectedIndex = state.classes.length - 1;
            toggleSetup(); sync(); renderTabs();
        }

        function setSort(mode) { 
            state.lastSortMode = mode; 
            sync(); renderStudents(); 
        }

        function renderStudents() {
            const container = document.getElementById('studentContainer');
            const activeClass = state.classes[state.lastSelectedIndex];
            if(!activeClass) return;

            // Sort UI feedback
            document.querySelectorAll('.apple-btn.secondary').forEach(btn => {
                btn.style.background = 'rgba(120, 120, 128, 0.16)';
                btn.style.color = 'var(--text-primary)';
            });
            const activeSort = document.getElementById(`sort-${state.lastSortMode}`);
            if(activeSort) {
                activeSort.style.background = 'var(--system-blue)';
                activeSort.style.color = 'white';
            }

            const presentStudents = activeClass.students.filter(s => !s.absent);
            const pickedCount = (activeClass.pickedIds || []).length;
            document.getElementById('noRepeatBtn').innerText = `♻️ Cycle ${pickedCount}/${presentStudents.length}`;
            document.getElementById('presenceCounter').innerText = `${presentStudents.length} Present`;
            document.getElementById('currentClassLabel').innerText = activeClass.name;

            const uniquePositiveScores = [...new Set(activeClass.students.map(s => s.score))].filter(s => s > 0).sort((a,b) => b-a);
            const getMedal = (score) => {
                if (score <= 0) return ""; 
                if (score === uniquePositiveScores[0]) return "🥇";
                if (score === uniquePositiveScores[1]) return "🥈";
                if (score === uniquePositiveScores[2]) return "🥉";
                return "";
            };

            let students = [...activeClass.students];
            if (state.lastSortMode === 'score') students.sort((a, b) => b.score - a.score);
            else if (state.lastSortMode === 'alpha') students.sort((a, b) => a.name.localeCompare(b.name));
            else students.sort((a, b) => a.order - b.order);

            container.innerHTML = students.map(s => `
                <div id="student-${s.id}" class="student-row ${s.absent ? 'absent' : ''}">
                    <button class="attendance-toggle" onclick="toggleAbsent(${s.id}, event)">${s.absent ? '◦' : '●'}</button>
                    <div class="student-info" onclick="updateScore(${s.id}, 1)">
                        <span class="medal">${getMedal(s.score)}</span>
                        <span class="student-name">${s.name}</span>
                    </div>
                    <div class="score-box">
                        <button class="points-btn" onclick="updateScore(${s.id}, -1, event)">−</button>
                        <span class="score-display" onclick="editScore(${s.id}, event)">${s.score}</span>
                        <button class="points-btn" onclick="updateScore(${s.id}, 1, event)">+</button>
                    </div>
                </div>
            `).join('');
        }

        function updateScore(studentId, delta, event = null) {
            if(event) event.stopPropagation();
            const student = state.classes[state.lastSelectedIndex].students.find(s => s.id === studentId);
            if (student) { 
                student.score += delta; 
                playSound(delta > 0 ? 'up' : 'down');
                sync(); renderStudents(); 
            }
        }

        function editScore(studentId, event) {
            event.stopPropagation();
            const student = state.classes[state.lastSelectedIndex].students.find(s => s.id === studentId);
            const val = prompt(`Update score for ${student.name}:`, student.score);
            if (val !== null && !isNaN(val)) {
                student.score = parseInt(val);
                sync(); renderStudents();
            }
        }

        function toggleAbsent(studentId, event) {
            event.stopPropagation();
            const activeClass = state.classes[state.lastSelectedIndex];
            const student = activeClass.students.find(s => s.id === studentId);
            if (student) { 
                student.absent = !student.absent; 
                activeClass.pickedIds = (activeClass.pickedIds || []).filter(id => id !== studentId);
                sync(); renderStudents(); 
            }
        }

        function pickRandom() {
            const activeClass = state.classes[state.lastSelectedIndex];
            const present = activeClass.students.filter(s => !s.absent);
            if (present.length === 0) return;
            const winner = present[Math.floor(Math.random() * present.length)];
            highlightStudent(winner.id);
        }

        function pickRandomNoRepeat() {
            const activeClass = state.classes[state.lastSelectedIndex];
            const present = activeClass.students.filter(s => !s.absent);
            if (present.length === 0) return;
            
            if (!activeClass.pickedIds) activeClass.pickedIds = [];
            let available = present.filter(s => !activeClass.pickedIds.includes(s.id));
            
            if (available.length === 0) {
                activeClass.pickedIds = [];
                available = present;
            }
            
            const winner = available[Math.floor(Math.random() * available.length)];
            activeClass.pickedIds.push(winner.id);
            sync(); renderStudents(); highlightStudent(winner.id);
        }

        function highlightStudent(id) {
            const row = document.getElementById(`student-${id}`);
            document.querySelectorAll('.student-row').forEach(r => r.classList.remove('highlighted'));
            row.scrollIntoView({ behavior: 'smooth', block: 'center' });
            row.classList.add('highlighted');
            setTimeout(() => row.classList.remove('highlighted'), 3000);
        }

        function awardAll(delta) {
            state.classes[state.lastSelectedIndex].students.forEach(s => { if(!s.absent) s.score += delta; });
            playSound('up'); sync(); renderStudents();
        }

        function resetScores() {
            if (confirm("Reset all scores for this class?")) {
                const activeClass = state.classes[state.lastSelectedIndex];
                activeClass.students.forEach(s => s.score = 0);
                activeClass.pickedIds = []; 
                sync(); renderStudents();
            }
        }

        function renderTabs() {
            const container = document.getElementById('tabsContainer');
            container.innerHTML = "";
            if (state.classes.length === 0) {
                document.getElementById('studentContainer').innerHTML = '<div class="empty-state">No classes found.<br>Tap "Add Class" to start.</div>';
                document.getElementById('scoreboardActions').classList.add('hidden');
                document.getElementById('currentClassLabel').innerText = "No Classes";
                return;
            }
            state.classes.forEach((cls, i) => {
                const link = document.createElement('div');
                link.className = `mode-link`;
                link.innerHTML = `<span>${cls.name}</span> <span onclick="deleteClass(${i}, event)" style="opacity:0.3; padding:5px;">×</span>`;
                link.onclick = (e) => { if (e.target.innerText !== '×') selectClass(i); };
                container.appendChild(link);
            });
            if (state.lastSelectedIndex !== null && state.classes[state.lastSelectedIndex]) {
                selectClass(state.lastSelectedIndex);
            }
        }

        function selectClass(index) { 
            state.lastSelectedIndex = index; 
            document.getElementById('tabsContainer').classList.remove('show');
            document.getElementById('scoreboardActions').classList.remove('hidden');
            sync(); renderStudents(); 
        }

        function deleteClass(index, event) {
            event.stopPropagation();
            if (confirm("Delete this class?")) {
                state.classes.splice(index, 1);
                state.lastSelectedIndex = state.classes.length > 0 ? 0 : null;
                sync(); renderTabs();
            }
        }

        function downloadData() {
            const blob = new Blob([JSON.stringify(state)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `Scoreboard_Backup.json`;
            a.click();
        }

        function uploadData(event) {
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => { 
                state = JSON.parse(e.target.result); 
                state.lastSelectedIndex = state.classes.length > 0 ? 0 : null;
                sync(); renderTabs(); 
            };
            reader.readAsText(file);
        }

        window.onload = init;
    </script>
</body>
</html>
