<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scoreboard</title>
    <style>
        :root {
            --system-blue: #007aff;
            --system-green: #34c759;
            --system-red: #ff3b30;
            --system-gray-bg: #f5f5f7;
            --system-card-bg: #ffffff;
            --system-btn-grey: #efeff4;
            --system-btn-active: #e5e5ea;
            --system-border: rgba(0,0,0,0.06);
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --text-tertiary: #a1a1a6;
            --radius: 20px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            background-color: var(--system-gray-bg);
            color: var(--text-primary);
            margin: 0;
            padding: 95px 20px 120px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* Clean Glassmorphic Fixed Header */
        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 74px;
            background: rgba(245, 245, 247, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 900;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            border-bottom: 1px solid rgba(0,0,0,0.04);
        }

        header::after {
            content: "";
            position: absolute;
            bottom: -20px; left: 0; right: 0;
            height: 20px;
            background: linear-gradient(to bottom, rgba(245, 245, 247, 0.85), transparent);
            pointer-events: none;
        }

        h1 { font-weight: 600; font-size: 24px; margin: 0; letter-spacing: -0.5px; }

        .top-nav { display: flex; gap: 12px; align-items: center; }

        .minimal-btn {
            background: none; border: none; color: var(--text-secondary);
            font-size: 14px; font-weight: 500; cursor: pointer; padding: 6px 10px;
            border-radius: 8px; transition: all 0.2s ease;
        }
        .minimal-btn:hover { color: var(--text-primary); background: rgba(0,0,0,0.04); }

        .container { width: 100%; max-width: 600px; animation: fadeIn 0.4s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Frosted Glass Bottom Blur Bar */
        .footer-blur-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 80px;
            background: rgba(245, 245, 247, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 850;
            pointer-events: none;
            border-top: 1px solid rgba(0,0,0,0.04);
        }

        .footer-blur-bar::before {
            content: "";
            position: absolute;
            top: -20px; left: 0; right: 0;
            height: 20px;
            background: linear-gradient(to top, rgba(245, 245, 247, 0.85), transparent);
            pointer-events: none;
        }

        /* Desktop Floating Bottom Dock */
        .bottom-dock {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 6px 8px;
            border-radius: 28px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 12px 36px rgba(0,0,0,0.12);
        }

        .dock-btn {
            background: transparent;
            color: var(--text-primary);
            border: none;
            padding: 10px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            outline: none;
        }
        .dock-btn:hover { background: rgba(0, 0, 0, 0.05); }
        .dock-btn:active { transform: scale(0.95); }
        .dock-btn.primary { background: var(--system-blue); color: white; }
        .dock-btn.primary:hover { background: #0062cc; }

        .dock-divider {
            width: 1px;
            height: 20px;
            background: rgba(0, 0, 0, 0.1);
            margin: 0 2px;
        }

        /* Mobile Actions Hub */
        .mobile-actions-hub {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1050;
        }

        .mobile-actions-trigger {
            background: var(--system-blue);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 22px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(0, 122, 255, 0.3);
            display: flex;
            align-items: center;
            gap: 6px;
            outline: none;
            transition: transform 0.1s ease;
        }
        .mobile-actions-trigger:active { transform: scale(0.95); }

        .mobile-actions-menu {
            display: none;
            position: absolute;
            bottom: 48px;
            left: 50%;
            transform: translateX(-50%);
            flex-direction: column;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 6px;
            border-radius: 18px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 12px 36px rgba(0,0,0,0.15);
            min-width: 160px;
        }
        .mobile-actions-menu.show { display: flex; animation: fadeIn 0.2s ease; }

        .mobile-menu-item {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
            padding: 10px 14px;
            border-radius: 12px;
            transition: 0.15s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .mobile-menu-item:hover { background: var(--system-blue); color: white; }

        /* Class Selector Floating Menu (Bottom-Left) */
        .mode-hub {
            position: fixed; bottom: 20px; left: 24px;
            z-index: 1100;
        }
        .mode-trigger {
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 8px 16px; border-radius: 18px; border: 1px solid rgba(0,0,0,0.08);
            box-shadow: 0 4px 16px rgba(0,0,0,0.08); font-weight: 600; color: var(--text-primary);
            cursor: pointer; font-size: 13px; user-select: none; transition: transform 0.1s ease;
        }
        .mode-trigger:active { transform: scale(0.96); }
        .mode-options {
            display: none; position: absolute; bottom: 48px; left: 0;
            flex-direction: column; background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 6px; border-radius: 16px; border: 1px solid rgba(0,0,0,0.08);
            box-shadow: 0 8px 32px rgba(0,0,0,0.12); min-width: 180px;
        }
        .mode-options.show { display: flex; animation: fadeIn 0.2s ease; }
        .mode-link {
            font-size: 13px; font-weight: 500; color: var(--text-primary);
            cursor: pointer; padding: 10px 12px; border-radius: 10px; transition: 0.15s;
            display: flex; justify-content: space-between; align-items: center;
        }
        .mode-link:hover { background: var(--system-blue); color: white; }

        /* Setup Accordion Card */
        .setup-area {
            background: var(--system-card-bg);
            border-radius: var(--radius);
            padding: 0;
            margin-bottom: 0;
            overflow: hidden;
            max-height: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 24px rgba(0,0,0,0.04);
            width: 100%;
        }
        .setup-area.open { padding: 24px; max-height: 500px; margin-bottom: 20px; }
        
        input, textarea {
            width: 100%; margin-bottom: 12px;
            background: #fafafa;
            border: 1px solid #d2d2d7;
            border-radius: 12px; padding: 12px 14px;
            color: var(--text-primary); font-family: inherit; font-size: 15px;
            box-sizing: border-box; outline: none; transition: all 0.2s;
        }
        input:focus, textarea:focus { border-color: var(--system-blue); background: #ffffff; }

        /* Student Card Row */
        .student-row {
            display: grid; grid-template-columns: 36px 1fr 130px;
            background: var(--system-card-bg); margin-bottom: 10px;
            border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.03);
            align-items: center; padding: 12px 16px; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .student-row.highlighted { 
            transform: scale(1.03); 
            border: 2px solid var(--system-blue); 
            box-shadow: 0 12px 30px rgba(0,122,255,0.18); 
            z-index: 10;
        }
        .student-row.absent { opacity: 0.35; filter: grayscale(1); }

        .attendance-toggle { 
            font-size: 18px; cursor: pointer; border: none; background: none; color: var(--text-tertiary);
            transition: color 0.2s; padding: 4px; display: flex; align-items: center; justify-content: center;
        }
        .attendance-toggle:hover { color: var(--text-primary); }

        .student-info { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
        .student-name { font-weight: 500; font-size: 16px; color: var(--text-primary); }
        .medal { font-size: 18px; width: 22px; text-align: center; }

        .score-box { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
        .score-display {
            font-size: 18px; font-weight: 700; width: 40px; text-align: center;
            font-variant-numeric: tabular-nums; cursor: pointer; color: var(--text-primary);
        }
        .points-btn {
            width: 32px; height: 32px; border-radius: 50%; border: none;
            background: var(--system-btn-grey); color: var(--text-primary);
            font-size: 18px; font-weight: 600; cursor: pointer; display: flex;
            align-items: center; justify-content: center; transition: all 0.2s;
        }
        .points-btn:hover { background: var(--system-btn-active); }
        .points-btn:active { transform: scale(0.92); }

        .status-counter {
            position: fixed; bottom: 25px; right: 24px;
            font-weight: 600; color: var(--text-secondary); font-size: 13px;
            z-index: 900; pointer-events: none;
        }

        .hidden { display: none !important; }
        .empty-state {
            text-align: center; color: var(--text-secondary); padding: 60px 20px;
            font-size: 15px; background: var(--system-card-bg); border-radius: var(--radius);
            box-shadow: 0 4px 24px rgba(0,0,0,0.03); margin-top: 20px;
        }

        .apple-btn-full {
            background: var(--system-blue); color: white; border: none;
            padding: 14px; border-radius: 24px; font-weight: 600; cursor: pointer;
            font-size: 15px; width: 100%; transition: all 0.2s;
        }
        .apple-btn-full:hover { background: #0062cc; }

        #appVersion { position: fixed; right: 8px; bottom: 4px; font-size: 9px; color: rgba(0,0,0,0.25); pointer-events: none; z-index: 2000; }

        /* Media Query: Narrow Screens / Phones */
        @media (max-width: 600px) {
            body { padding-left: 12px; padding-right: 12px; }
            header { padding: 0 18px; }
            header h1 { font-size: 20px; }
            .mode-hub { left: 16px; bottom: 18px; }
            .status-counter { right: 16px; bottom: 23px; }
            
            /* Hide wide desktop dock and show compact mobile actions menu */
            .bottom-dock { display: none !important; }
            .mobile-actions-hub { display: block; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Scoreboard</h1>
        <nav class="top-nav">
            <button class="minimal-btn" onclick="toggleSetup()">Add Class</button>
            <button class="minimal-btn" onclick="downloadData()">Backup</button>
            <button class="minimal-btn" onclick="document.getElementById('fileInput').click()">Load</button>
            <input type="file" id="fileInput" class="hidden" accept=".json" onchange="uploadData(event)">
        </nav>
    </header>

    <div class="container">
        <div id="setupArea" class="setup-area">
            <h3 style="margin-top:0; font-size: 14px; font-weight:600; color: var(--text-secondary); margin-bottom: 15px;">NEW CLASS</h3>
            <input type="text" id="className" placeholder="Class Name (e.g. Science 7B)">
            <textarea id="studentList" rows="5" placeholder="Paste student names (one per line)..."></textarea>
            <button onclick="addClass()" class="apple-btn-full">Create Class</button>
        </div>

        <div id="studentContainer"></div>
    </div>

    <!-- Frosted Glass Bottom Blur Overlay -->
    <div class="footer-blur-bar"></div>

    <!-- Wide Desktop Dock -->
    <div id="scoreboardActions" class="bottom-dock hidden">
        <button class="dock-btn primary" onclick="pickRandomNoRepeat()">
            🎲 <span id="noRepeatBtn">Cycle 0/0</span>
        </button>
        <button class="dock-btn" onclick="pickRandom()">Random</button>
        <div class="dock-divider"></div>
        <button class="dock-btn" id="sortBtn" onclick="cycleSort()">Order ⇅</button>
        <button class="dock-btn" onclick="awardAll(1)">+1 All</button>
        <button class="dock-btn" style="color:var(--system-red)" onclick="resetScores()">Reset</button>
    </div>

    <!-- Mobile Compact Actions Menu -->
    <div id="mobileActionsHub" class="mobile-actions-hub hidden">
        <button class="mobile-actions-trigger" onclick="toggleMobileActions()">Actions ⚡</button>
        <div class="mobile-actions-menu" id="mobileActionsMenu">
            <div class="mobile-menu-item" onclick="pickRandomNoRepeat(); toggleMobileActions();">
                <span>🎲 Cycle</span> <span id="noRepeatMobileBtn" style="opacity:0.6; font-size:11px;">0/0</span>
            </div>
            <div class="mobile-menu-item" onclick="pickRandom(); toggleMobileActions();">Random</div>
            <div class="mobile-menu-item" id="sortMobileBtn" onclick="cycleSort(); toggleMobileActions();">Order ⇅</div>
            <div class="mobile-menu-item" onclick="awardAll(1); toggleMobileActions();">+1 All</div>
            <div class="mobile-menu-item" style="color:var(--system-red)" onclick="resetScores(); toggleMobileActions();">Reset</div>
        </div>
    </div>

    <!-- Class Switcher (Bottom-Left) -->
    <div class="mode-hub">
        <div class="mode-trigger" id="currentClassLabel" onclick="toggleModeMenu()">Select Class</div>
        <div class="mode-options" id="tabsContainer"></div>
    </div>

    <div class="status-counter" id="presenceCounter">0 Present</div>
    <div id="appVersion">v1.0 | Made with ❤️ by Icarus Lai</div>

    <script>
        let state = { classes: [], lastSelectedIndex: null, lastSortMode: 'original' };
        const STORE_KEY = 'teacherApp_v7_light_only';

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                if (type === 'up') {
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                } else {
                    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(150, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                }
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } catch(e) {}
        }

        function sync() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
        
        function init() {
            const saved = localStorage.getItem(STORE_KEY);
            if (saved) { state = JSON.parse(saved); renderTabs(); }
        }

        function toggleSetup() { document.getElementById('setupArea').classList.toggle('open'); }
        function toggleModeMenu() { 
            document.getElementById('tabsContainer').classList.toggle('show'); 
            document.getElementById('mobileActionsMenu').classList.remove('show');
        }
        function toggleMobileActions() { 
            document.getElementById('mobileActionsMenu').classList.toggle('show'); 
            document.getElementById('tabsContainer').classList.remove('show');
        }

        function addClass() {
            const nameField = document.getElementById('className');
            const listField = document.getElementById('studentList');
            const names = listField.value.split('\n').map(n => n.trim()).filter(n => n !== "");
            if (!nameField.value || names.length === 0) return;
            
            state.classes.push({
                name: nameField.value,
                students: names.map((s, i) => ({ id: Date.now() + i, name: s, score: 0, order: i, absent: false })),
                pickedIds: []
            });
            
            nameField.value = ""; listField.value = "";
            state.lastSelectedIndex = state.classes.length - 1;
            toggleSetup(); sync(); renderTabs();
        }

        function cycleSort() {
            const modes = ['original', 'alpha', 'score'];
            const nextIdx = (modes.indexOf(state.lastSortMode) + 1) % modes.length;
            state.lastSortMode = modes[nextIdx];
            sync(); renderStudents();
        }

        function renderStudents() {
            const container = document.getElementById('studentContainer');
            const activeClass = state.classes[state.lastSelectedIndex];
            if(!activeClass) return;

            // Sort button label update
            const sortBtn = document.getElementById('sortBtn');
            const sortMobileBtn = document.getElementById('sortMobileBtn');
            let sortLabel = "Order ⇅";
            if(state.lastSortMode === 'alpha') sortLabel = "A-Z ⇅";
            else if(state.lastSortMode === 'score') sortLabel = "Rank ⇅";
            
            if(sortBtn) sortBtn.innerText = sortLabel;
            if(sortMobileBtn) sortMobileBtn.innerText = sortLabel;

            const presentStudents = activeClass.students.filter(s => !s.absent);
            const pickedCount = (activeClass.pickedIds || []).length;
            
            document.getElementById('noRepeatBtn').innerText = `Cycle ${pickedCount}/${presentStudents.length}`;
            document.getElementById('noRepeatMobileBtn').innerText = `${pickedCount}/${presentStudents.length}`;
            document.getElementById('presenceCounter').innerText = `${presentStudents.length} Present`;
            document.getElementById('currentClassLabel').innerText = activeClass.name;

            const uniquePositiveScores = [...new Set(activeClass.students.map(s => s.score))].filter(s => s > 0).sort((a,b) => b-a);
            const getMedal = (score) => {
                if (score <= 0) return ""; 
                if (score === uniquePositiveScores[0]) return "🥇";
                if (score === uniquePositiveScores[1]) return "🥈";
                if (score === uniquePositiveScores[2]) return "🥉";
                return "";
            };

            let students = [...activeClass.students];
            if (state.lastSortMode === 'score') students.sort((a, b) => b.score - a.score);
            else if (state.lastSortMode === 'alpha') students.sort((a, b) => a.name.localeCompare(b.name));
            else students.sort((a, b) => a.order - b.order);

            container.innerHTML = students.map(s => `
                <div id="student-${s.id}" class="student-row ${s.absent ? 'absent' : ''}">
                    <button class="attendance-toggle" onclick="toggleAbsent(${s.id}, event)">${s.absent ? '◦' : '●'}</button>
                    <div class="student-info" onclick="updateScore(${s.id}, 1)">
                        <span class="medal">${getMedal(s.score)}</span>
                        <span class="student-name">${s.name}</span>
                    </div>
                    <div class="score-box">
                        <button class="points-btn" onclick="updateScore(${s.id}, -1, event)">−</button>
                        <span class="score-display" onclick="editScore(${s.id}, event)">${s.score}</span>
                        <button class="points-btn" onclick="updateScore(${s.id}, 1, event)">+</button>
                    </div>
                </div>
            `).join('');
        }

        function updateScore(studentId, delta, event = null) {
            if(event) event.stopPropagation();
            const student = state.classes[state.lastSelectedIndex].students.find(s => s.id === studentId);
            if (student) { 
                student.score += delta; 
                playSound(delta > 0 ? 'up' : 'down');
                sync(); renderStudents(); 
            }
        }

        function editScore(studentId, event) {
            event.stopPropagation();
            const student = state.classes[state.lastSelectedIndex].students.find(s => s.id === studentId);
            const val = prompt(`Update score for ${student.name}:`, student.score);
            if (val !== null && !isNaN(val)) {
                student.score = parseInt(val);
                sync(); renderStudents();
            }
        }

        function toggleAbsent(studentId, event) {
            event.stopPropagation();
            const activeClass = state.classes[state.lastSelectedIndex];
            const student = activeClass.students.find(s => s.id === studentId);
            if (student) { 
                student.absent = !student.absent; 
                activeClass.pickedIds = (activeClass.pickedIds || []).filter(id => id !== studentId);
                sync(); renderStudents(); 
            }
        }

        function pickRandom() {
            const activeClass = state.classes[state.lastSelectedIndex];
            const present = activeClass.students.filter(s => !s.absent);
            if (present.length === 0) return;
            const winner = present[Math.floor(Math.random() * present.length)];
            highlightStudent(winner.id);
        }

        function pickRandomNoRepeat() {
            const activeClass = state.classes[state.lastSelectedIndex];
            const present = activeClass.students.filter(s => !s.absent);
            if (present.length === 0) return;
            
            if (!activeClass.pickedIds) activeClass.pickedIds = [];
            let available = present.filter(s => !activeClass.pickedIds.includes(s.id));
            
            if (available.length === 0) {
                activeClass.pickedIds = [];
                available = present;
            }
            
            const winner = available[Math.floor(Math.random() * available.length)];
            activeClass.pickedIds.push(winner.id);
            sync(); renderStudents(); highlightStudent(winner.id);
        }

        function highlightStudent(id) {
            const row = document.getElementById(`student-${id}`);
            if(!row) return;
            document.querySelectorAll('.student-row').forEach(r => r.classList.remove('highlighted'));
            row.scrollIntoView({ behavior: 'smooth', block: 'center' });
            row.classList.add('highlighted');
            setTimeout(() => row.classList.remove('highlighted'), 3000);
        }

        function awardAll(delta) {
            state.classes[state.lastSelectedIndex].students.forEach(s => { if(!s.absent) s.score += delta; });
            playSound('up'); sync(); renderStudents();
        }

        function resetScores() {
            if (confirm("Reset all scores for this class?")) {
                const activeClass = state.classes[state.lastSelectedIndex];
                activeClass.students.forEach(s => s.score = 0);
                activeClass.pickedIds = []; 
                sync(); renderStudents();
            }
        }

        function renderTabs() {
            const container = document.getElementById('tabsContainer');
            container.innerHTML = "";
            if (state.classes.length === 0) {
                document.getElementById('studentContainer').innerHTML = '<div class="empty-state">No classes found.<br>Tap "Add Class" in the top bar to start.</div>';
                document.getElementById('scoreboardActions').classList.add('hidden');
                document.getElementById('mobileActionsHub').classList.add('hidden');
                document.getElementById('currentClassLabel').innerText = "No Classes";
                return;
            }
            state.classes.forEach((cls, i) => {
                const link = document.createElement('div');
                link.className = `mode-link`;
                link.innerHTML = `<span>${cls.name}</span> <span onclick="deleteClass(${i}, event)" style="opacity:0.4; padding:2px 6px;">×</span>`;
                link.onclick = (e) => { if (e.target.innerText !== '×') selectClass(i); };
                container.appendChild(link);
            });
            if (state.lastSelectedIndex !== null && state.classes[state.lastSelectedIndex]) {
                selectClass(state.lastSelectedIndex);
            } else if(state.classes.length > 0) {
                selectClass(0);
            }
        }

        function selectClass(index) { 
            state.lastSelectedIndex = index; 
            document.getElementById('tabsContainer').classList.remove('show');
            document.getElementById('scoreboardActions').classList.remove('hidden');
            document.getElementById('mobileActionsHub').classList.remove('hidden');
            sync(); renderStudents(); 
        }

        function deleteClass(index, event) {
            event.stopPropagation();
            if (confirm("Delete this class?")) {
                state.classes.splice(index, 1);
                state.lastSelectedIndex = state.classes.length > 0 ? 0 : null;
                sync(); renderTabs();
            }
        }

        function downloadData() {
            const blob = new Blob([JSON.stringify(state)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `Scoreboard_Backup.json`;
            a.click();
        }

        function uploadData(event) {
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => { 
                state = JSON.parse(e.target.result); 
                state.lastSelectedIndex = state.classes.length > 0 ? 0 : null;
                sync(); renderTabs(); 
            };
            reader.readAsText(file);
        }

        window.onload = init;
    </script>
</body>
</html>
