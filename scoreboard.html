<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scoreboard — Liquid Glass</title>
    <style>
        /* Liquid Glass Tokens & Principles */
        :root {
            /* Translucent overlays & subtle glass fills */
            --glass-bg-primary: rgba(255, 255, 255, 0.08);
            --glass-bg-card: rgba(255, 255, 255, 0.06);
            --glass-bg-hover: rgba(255, 255, 255, 0.18);
            --glass-bg-input: rgba(255, 255, 255, 0.12);
            
            /* Glass border highlights */
            --glass-border-light: rgba(255, 255, 255, 0.18);
            --glass-border-strong: rgba(255, 255, 255, 0.3);
            
            /* Depth shadows */
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --glass-shadow-sm: 0 4px 16px 0 rgba(0, 0, 0, 0.25);
            
            /* Typography & High-Contrast Colors */
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.85);
            --text-muted: rgba(255, 255, 255, 0.65);
            --accent-red: #ff453a;
            
            /* System Border Radius */
            --radius-container: 20px;
            --radius-element: 12px;
            --radius-full: 9999px;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1f1c2c;
            color: var(--text-main);
            min-height: 100vh;
            padding: 100px 20px 120px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        /* Fixed Background Container for Mobile Safari compatibility */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #1f1c2c 0%, #928dab 50%, #2c3e50 100%);
            z-index: -2;
            pointer-events: none;
            transform: translateZ(0);
        }

        /* Ambient Dynamic Background Canvas */
        #liquidCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            filter: blur(50px);
            opacity: 0.75;
            transform: translateZ(0);
        }

        /* Glass Header Container */
        header {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%) translateZ(0);
            width: calc(100% - 32px);
            max-width: 760px;
            height: 64px;
            background: var(--glass-bg-primary);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border-light);
            border-radius: var(--radius-container);
            box-shadow: var(--glass-shadow-sm);
            z-index: 900;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            letter-spacing: -0.3px;
        }

        .top-nav { 
            display: flex; 
            gap: 8px; 
            align-items: center; 
        }

        /* Glass Button Component Specification */
        .glass-btn {
            background: var(--glass-bg-primary);
            border: 1px solid var(--glass-border-light);
            color: var(--text-main);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 14px;
            border-radius: var(--radius-element);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transform: translateZ(0);
            transition: all 0.2s ease;
            outline: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .glass-btn:hover {
            background: var(--glass-bg-hover);
            border-color: var(--glass-border-strong);
        }

        .glass-btn:active {
            transform: scale(0.96) translateZ(0);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .glass-btn.btn-full {
            width: 100%;
            justify-content: center;
            padding: 12px;
            font-size: 15px;
            border-radius: var(--radius-element);
        }

        /* Container Component Specification */
        .glass-container {
            width: 100%;
            max-width: 620px;
        }

        /* Setup Accordion Container */
        .setup-area {
            background: var(--glass-bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transform: translateZ(0);
            border: 1px solid var(--glass-border-light);
            border-radius: var(--radius-container);
            box-shadow: var(--glass-shadow);
            overflow: hidden;
            max-height: 0;
            padding: 0 20px;
            margin-bottom: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0;
        }

        .setup-area.open {
            padding: 20px;
            max-height: 520px;
            margin-bottom: 20px;
            opacity: 1;
        }

        /* Controls Specification (Inputs & Textareas) */
        input[type="text"], textarea {
            width: 100%;
            margin-bottom: 12px;
            background: var(--glass-bg-input);
            border: 1px solid var(--glass-border-light);
            border-radius: var(--radius-element);
            padding: 12px 16px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transform: translateZ(0);
            transition: all 0.2s ease;
        }

        input[type="text"]::placeholder, textarea::placeholder {
            color: var(--text-muted);
        }

        input[type="text"]:focus, textarea:focus {
            background: rgba(255, 255, 255, 0.25);
            border-color: var(--glass-border-strong);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        /* Student Glass Card Container */
        .student-row {
            display: grid;
            grid-template-columns: 36px 1fr 130px;
            background: var(--glass-bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transform: translateZ(0);
            margin-bottom: 10px;
            border-radius: var(--radius-element);
            border: 1px solid var(--glass-border-light);
            box-shadow: var(--glass-shadow-sm);
            align-items: center;
            padding: 10px 16px;
            transition: all 0.25s ease;
        }

        .student-row:hover {
            background: var(--glass-bg-hover);
            border-color: var(--glass-border-strong);
        }

        .student-row.highlighted {
            border: 1.5px solid var(--glass-border-strong);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
            transform: scale(1.02) translateZ(0);
            background: rgba(255, 255, 255, 0.3);
            z-index: 10;
        }

        .student-row.absent {
            opacity: 0.4;
            filter: grayscale(1);
        }

        .attendance-toggle {
            font-size: 16px;
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--text-muted);
            transition: transform 0.2s ease;
        }

        .attendance-toggle:hover {
            color: var(--text-main);
            transform: scale(1.2);
        }

        .student-info {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .student-name {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-main);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        .medal {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }

        .score-box {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
        }

        .score-display {
            font-size: 17px;
            font-weight: 700;
            width: 36px;
            text-align: center;
            color: var(--text-main);
            cursor: pointer;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            transition: transform 0.15s ease;
        }

        .score-display:hover {
            transform: scale(1.15);
        }

        .points-btn {
            width: 30px;
            height: 30px;
            border-radius: var(--radius-full);
            border: 1px solid var(--glass-border-light);
            background: var(--glass-bg-primary);
            color: var(--text-main);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transform: translateZ(0);
            transition: all 0.2s ease;
        }

        .points-btn:hover {
            background: var(--glass-bg-hover);
            border-color: var(--glass-border-strong);
        }

        .points-btn:active {
            transform: scale(0.92) translateZ(0);
        }

        /* Bottom Floating Dock Bar */
        .bottom-dock {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateZ(0);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--glass-bg-primary);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 8px 14px;
            border-radius: var(--radius-full);
            border: 1px solid var(--glass-border-light);
            box-shadow: var(--glass-shadow);
        }

        .dock-btn {
            background: transparent;
            color: var(--text-main);
            border: 1px solid transparent;
            padding: 8px 14px;
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .dock-btn:hover {
            background: var(--glass-bg-hover);
            border-color: var(--glass-border-light);
        }

        .dock-btn:active {
            transform: scale(0.95);
        }

        .dock-btn.danger {
            color: var(--accent-red);
        }

        .dock-btn.danger:hover {
            background: rgba(255, 69, 58, 0.22);
            border-color: rgba(255, 69, 58, 0.4);
        }

        .dock-divider {
            width: 1px;
            height: 20px;
            background: var(--glass-border-light);
            margin: 0 2px;
        }

        /* Mobile Actions Hub */
        .mobile-actions-hub {
            display: none;
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateZ(0);
            z-index: 1050;
        }

        .mobile-actions-trigger {
            background: var(--glass-bg-primary);
            color: var(--text-main);
            border: 1px solid var(--glass-border-light);
            padding: 10px 20px;
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: var(--glass-shadow);
        }

        .mobile-actions-menu {
            display: none;
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%) translateZ(0);
            flex-direction: column;
            background: rgba(30, 30, 40, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 8px;
            border-radius: var(--radius-container);
            border: 1px solid var(--glass-border-light);
            box-shadow: var(--glass-shadow);
            min-width: 180px;
            gap: 4px;
        }

        .mobile-actions-menu.show { display: flex; }

        .mobile-menu-item {
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: var(--radius-element);
            cursor: pointer;
            transition: background 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .mobile-menu-item:hover {
            background: var(--glass-bg-hover);
        }

        .mobile-menu-item.danger {
            color: var(--accent-red);
        }

        .mobile-menu-item.danger:hover {
            background: rgba(255, 69, 58, 0.22);
        }

        /* Class Switcher Hub */
        .mode-hub {
            position: fixed; 
            bottom: 24px; 
            left: 24px;
            z-index: 1100;
        }

        .mode-trigger {
            background: var(--glass-bg-primary);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transform: translateZ(0);
            padding: 10px 18px;
            border-radius: var(--radius-full);
            border: 1px solid var(--glass-border-light);
            box-shadow: var(--glass-shadow-sm);
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            font-size: 13.5px;
            transition: all 0.2s ease;
        }

        .mode-trigger:hover {
            background: var(--glass-bg-hover);
            border-color: var(--glass-border-strong);
        }

        .mode-options {
            display: none;
            position: absolute;
            bottom: 50px;
            left: 0;
            flex-direction: column;
            background: rgba(30, 30, 40, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transform: translateZ(0);
            padding: 8px;
            border-radius: var(--radius-container);
            border: 1px solid var(--glass-border-light);
            box-shadow: var(--glass-shadow);
            min-width: 180px;
            gap: 4px;
        }

        .mode-options.show { display: flex; }

        .mode-link {
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: var(--radius-element);
            cursor: pointer;
            transition: background 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mode-link:hover {
            background: var(--glass-bg-hover);
        }

        .status-counter {
            position: fixed; 
            bottom: 28px; 
            right: 24px;
            font-weight: 600; 
            color: var(--text-sub); 
            font-size: 13px;
            z-index: 900; 
            pointer-events: none;
            background: var(--glass-bg-primary);
            padding: 6px 14px; 
            border-radius: var(--radius-full);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transform: translateZ(0);
            border: 1px solid var(--glass-border-light);
            box-shadow: var(--glass-shadow-sm);
        }

        .hidden { display: none !important; }

        .empty-state {
            text-align: center;
            color: var(--text-sub);
            padding: 60px 20px;
            font-size: 15px;
            font-weight: 500;
            background: var(--glass-bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transform: translateZ(0);
            border: 1px solid var(--glass-border-light);
            border-radius: var(--radius-container);
            box-shadow: var(--glass-shadow);
            line-height: 1.6;
        }

        #appVersion { 
            position: fixed; 
            right: 12px; 
            bottom: 6px; 
            font-size: 10px; 
            font-weight: 500; 
            color: var(--text-muted); 
            pointer-events: none; 
            z-index: 2000; 
        }

        @media (max-width: 600px) {
            body { padding-left: 12px; padding-right: 12px; padding-top: 90px; }
            header { width: calc(100% - 24px); padding: 0 14px; top: 12px; }
            header h1 { font-size: 18px; }
            .mode-hub { left: 16px; bottom: 20px; }
            .status-counter { right: 16px; bottom: 22px; }
            .bottom-dock { display: none !important; }
            .mobile-actions-hub { display: block; }
        }
    </style>
</head>
<body>

    <!-- Ambient Dynamic Background Canvas -->
    <canvas id="liquidCanvas"></canvas>

    <!-- Glass Header Wrapper -->
    <header>
        <h1>Scoreboard</h1>
        <nav class="top-nav">
            <button class="glass-btn" onclick="toggleSetup()">Add Class</button>
            <button class="glass-btn" onclick="saveDataToScript()">Save</button>
            <button class="glass-btn" onclick="loadDataFromScript()">Load</button>
        </nav>
    </header>

    <div class="glass-container">
        <!-- Glass Accordion Container -->
        <div id="setupArea" class="setup-area">
            <h3 style="margin-top:0; font-size: 12px; font-weight:700; color: var(--text-muted); margin-bottom: 12px; letter-spacing: 0.5px;">NEW CLASS SETUP</h3>
            <input type="text" id="className" placeholder="Class Name (e.g. Science 7B)">
            <textarea id="studentList" rows="5" placeholder="Paste student names (one per line)..."></textarea>
            <button onclick="addClass()" class="glass-btn btn-full">Create Class</button>
        </div>

        <div id="studentContainer"></div>
    </div>

    <!-- Desktop Floating Glass Dock -->
    <div id="scoreboardActions" class="bottom-dock hidden">
        <button class="dock-btn" onclick="pickRandomNoRepeat()">
            🎲 <span id="noRepeatBtn">0/0</span>
        </button>
        <button class="dock-btn" onclick="pickRandom()">🎲 Random</button>
        <div class="dock-divider"></div>
        <button class="dock-btn" id="sortBtn" onclick="cycleSort()">Order ⇅</button>
        <button class="dock-btn" onclick="awardAll(1)">+1 All</button>
        <button class="dock-btn danger" onclick="resetScores()">Reset</button>
    </div>

    <!-- Mobile Compact Actions Menu -->
    <div id="mobileActionsHub" class="mobile-actions-hub hidden">
        <button class="mobile-actions-trigger" onclick="toggleMobileActions()">Actions ⚡</button>
        <div class="mobile-actions-menu" id="mobileActionsMenu">
            <div class="mobile-menu-item" onclick="pickRandomNoRepeat(); toggleMobileActions();">
                <span>🎲 Cycle</span>
                <span id="noRepeatMobileBtn" style="opacity:0.7; font-size:12px; font-weight:500;">0/0</span>
            </div>
            <div class="mobile-menu-item" onclick="pickRandom(); toggleMobileActions();">🎲 Random</div>
            <div class="mobile-menu-item" id="sortMobileBtn" onclick="cycleSort(); toggleMobileActions();">Order ⇅</div>
            <div class="mobile-menu-item" onclick="awardAll(1); toggleMobileActions();">+1 All</div>
            <div class="mobile-menu-item danger" onclick="resetScores(); toggleMobileActions();">Reset</div>
        </div>
    </div>

    <!-- Class Switcher Hub (Bottom-Left) -->
    <div class="mode-hub">
        <div class="mode-trigger" id="currentClassLabel" onclick="toggleModeMenu()">Select Class</div>
        <div class="mode-options" id="tabsContainer"></div>
    </div>

    <div class="status-counter" id="presenceCounter">0 Present</div>
    <div id="appVersion">v3.0 | GAS Cloud Sync</div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyBmq-YXH01cMTE3-pmgZvKl9iojmE15KCeZFBqETHKoJELsROZ-p-Ihk9WmFbD09i3/exec";

        /* Mobile-Optimized Ambient Canvas Background Engine */
        const canvas = document.getElementById('liquidCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, dpr;
        
        function resizeCanvas() {
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
        }
        
        window.addEventListener('resize', () => {
            if (canvas.width !== window.innerWidth * (window.devicePixelRatio || 1)) {
                resizeCanvas();
            }
        });
        resizeCanvas();

        const blobs = [
            { x: 0.2, y: 0.3, r: 0.45, color: 'rgba(100, 140, 255, 0.6)', vx: 0.0005, vy: 0.0004 },
            { x: 0.8, y: 0.2, r: 0.5, color: 'rgba(180, 100, 255, 0.55)', vx: -0.0004, vy: 0.0005 },
            { x: 0.5, y: 0.8, r: 0.4, color: 'rgba(255, 120, 180, 0.5)', vx: 0.0003, vy: -0.0004 }
        ];

        function animateBlobs() {
            ctx.clearRect(0, 0, width, height);
            blobs.forEach(b => {
                b.x += b.vx; b.y += b.vy;
                if (b.x < 0 || b.x > 1) b.vx *= -1;
                if (b.y < 0 || b.y > 1) b.vy *= -1;

                const grad = ctx.createRadialGradient(
                    b.x * width, b.y * height, 0,
                    b.x * width, b.y * height, b.r * Math.max(width, height)
                );
                grad.addColorStop(0, b.color);
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(b.x * width, b.y * height, b.r * Math.max(width, height), 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(animateBlobs);
        }
        animateBlobs();

        /* Scoreboard Application Logic */
        let state = { classes: [], lastSelectedIndex: null, lastSortMode: 'original' };
        const STORE_KEY = 'teacherApp_v7_light_only';

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                if (type === 'up') {
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                } else {
                    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(150, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                }
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } catch(e) {}
        }

        function sync() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
        
        function init() {
            const saved = localStorage.getItem(STORE_KEY);
            if (saved) { state = JSON.parse(saved); renderTabs(); }
        }

        function toggleSetup() { document.getElementById('setupArea').classList.toggle('open'); }
        function toggleModeMenu() { 
            document.getElementById('tabsContainer').classList.toggle('show'); 
            document.getElementById('mobileActionsMenu').classList.remove('show');
        }
        function toggleMobileActions() { 
            document.getElementById('mobileActionsMenu').classList.toggle('show'); 
            document.getElementById('tabsContainer').classList.remove('show');
        }

        function addClass() {
            const nameField = document.getElementById('className');
            const listField = document.getElementById('studentList');
            const names = listField.value.split('\n').map(n => n.trim()).filter(n => n !== "");
            if (!nameField.value || names.length === 0) return;
            
            state.classes.push({
                name: nameField.value,
                students: names.map((s, i) => ({ id: Date.now() + i, name: s, score: 0, order: i, absent: false })),
                pickedIds: []
            });
            
            nameField.value = ""; listField.value = "";
            state.lastSelectedIndex = state.classes.length - 1;
            toggleSetup(); sync(); renderTabs();
        }

        function cycleSort() {
            const modes = ['original', 'alpha', 'score'];
            const nextIdx = (modes.indexOf(state.lastSortMode) + 1) % modes.length;
            state.lastSortMode = modes[nextIdx];
            sync(); renderStudents();
        }

        function renderStudents() {
            const container = document.getElementById('studentContainer');
            const activeClass = state.classes[state.lastSelectedIndex];
            if(!activeClass) return;

            const sortBtn = document.getElementById('sortBtn');
            const sortMobileBtn = document.getElementById('sortMobileBtn');
            let sortLabel = "Order ⇅";
            if(state.lastSortMode === 'alpha') sortLabel = "A-Z ⇅";
            else if(state.lastSortMode === 'score') sortLabel = "Rank ⇅";
            
            if(sortBtn) sortBtn.innerText = sortLabel;
            if(sortMobileBtn) sortMobileBtn.innerText = sortLabel;

            const presentStudents = activeClass.students.filter(s => !s.absent);
            const pickedCount = (activeClass.pickedIds || []).length;
            
            document.getElementById('noRepeatBtn').innerText = `${pickedCount}/${presentStudents.length}`;
            document.getElementById('noRepeatMobileBtn').innerText = `${pickedCount}/${presentStudents.length}`;
            document.getElementById('presenceCounter').innerText = `${presentStudents.length} Present`;
            document.getElementById('currentClassLabel').innerText = activeClass.name;

            const uniquePositiveScores = [...new Set(activeClass.students.map(s => s.score))].filter(s => s > 0).sort((a,b) => b-a);
            const getMedal = (score) => {
                if (score <= 0) return ""; 
                if (score === uniquePositiveScores[0]) return "🥇";
                if (score === uniquePositiveScores[1]) return "🥈";
                if (score === uniquePositiveScores[2]) return "🥉";
                return "";
            };

            let students = [...activeClass.students];
            if (state.lastSortMode === 'score') students.sort((a, b) => b.score - a.score);
            else if (state.lastSortMode === 'alpha') students.sort((a, b) => a.name.localeCompare(b.name));
            else students.sort((a, b) => a.order - b.order);

            container.innerHTML = students.map(s => `
                <div id="student-${s.id}" class="student-row ${s.absent ? 'absent' : ''}">
                    <button class="attendance-toggle" onclick="toggleAbsent(${s.id}, event)">${s.absent ? '◦' : '●'}</button>
                    <div class="student-info" onclick="updateScore(${s.id}, 1)">
                        <span class="medal">${getMedal(s.score)}</span>
                        <span class="student-name">${s.name}</span>
                    </div>
                    <div class="score-box">
                        <button class="points-btn" onclick="updateScore(${s.id}, -1, event)">−</button>
                        <span class="score-display" onclick="editScore(${s.id}, event)">${s.score}</span>
                        <button class="points-btn" onclick="updateScore(${s.id}, 1, event)">+</button>
                    </div>
                </div>
            `).join('');
        }

        function updateScore(studentId, delta, event = null) {
            if(event) event.stopPropagation();
            const student = state.classes[state.lastSelectedIndex].students.find(s => s.id === studentId);
            if (student) { 
                student.score += delta; 
                playSound(delta > 0 ? 'up' : 'down');
                sync(); renderStudents(); 
            }
        }

        function editScore(studentId, event) {
            event.stopPropagation();
            const student = state.classes[state.lastSelectedIndex].students.find(s => s.id === studentId);
            const val = prompt(`Update score for ${student.name}:`, student.score);
            if (val !== null && !isNaN(val)) {
                student.score = parseInt(val);
                sync(); renderStudents();
            }
        }

        function toggleAbsent(studentId, event) {
            event.stopPropagation();
            const activeClass = state.classes[state.lastSelectedIndex];
            const student = activeClass.students.find(s => s.id === studentId);
            if (student) { 
                student.absent = !student.absent; 
                activeClass.pickedIds = (activeClass.pickedIds || []).filter(id => id !== studentId);
                sync(); renderStudents(); 
            }
        }

        function pickRandom() {
            const activeClass = state.classes[state.lastSelectedIndex];
            const present = activeClass.students.filter(s => !s.absent);
            if (present.length === 0) return;
            const winner = present[Math.floor(Math.random() * present.length)];
            highlightStudent(winner.id);
        }

        function pickRandomNoRepeat() {
            const activeClass = state.classes[state.lastSelectedIndex];
            const present = activeClass.students.filter(s => !s.absent);
            if (present.length === 0) return;
            
            if (!activeClass.pickedIds) activeClass.pickedIds = [];
            let available = present.filter(s => !activeClass.pickedIds.includes(s.id));
            
            if (available.length === 0) {
                activeClass.pickedIds = [];
                available = present;
            }
            
            const winner = available[Math.floor(Math.random() * available.length)];
            activeClass.pickedIds.push(winner.id);
            sync(); renderStudents(); highlightStudent(winner.id);
        }

        function highlightStudent(id) {
            const row = document.getElementById(`student-${id}`);
            if(!row) return;
            document.querySelectorAll('.student-row').forEach(r => r.classList.remove('highlighted'));
            row.scrollIntoView({ behavior: 'smooth', block: 'center' });
            row.classList.add('highlighted');
            setTimeout(() => row.classList.remove('highlighted'), 8000);
        }

        function awardAll(delta) {
            state.classes[state.lastSelectedIndex].students.forEach(s => { if(!s.absent) s.score += delta; });
            playSound('up'); sync(); renderStudents();
        }

        function resetScores() {
            if (confirm("Reset all scores for this class?")) {
                const activeClass = state.classes[state.lastSelectedIndex];
                activeClass.students.forEach(s => s.score = 0);
                activeClass.pickedIds = []; 
                sync(); renderStudents();
            }
        }

        function renderTabs() {
            const container = document.getElementById('tabsContainer');
            container.innerHTML = "";
            if (state.classes.length === 0) {
                document.getElementById('studentContainer').innerHTML = '<div class="empty-state">No classes found.<br>Tap "Add Class" in the top bar to start.</div>';
                document.getElementById('scoreboardActions').classList.add('hidden');
                document.getElementById('mobileActionsHub').classList.add('hidden');
                document.getElementById('currentClassLabel').innerText = "No Classes";
                return;
            }
            state.classes.forEach((cls, i) => {
                const link = document.createElement('div');
                link.className = `mode-link`;
                link.innerHTML = `<span>${cls.name}</span> <span onclick="deleteClass(${i}, event)" style="opacity:0.5; padding:2px 6px;">×</span>`;
                link.onclick = (e) => { if (e.target.innerText !== '×') selectClass(i); };
                container.appendChild(link);
            });
            if (state.lastSelectedIndex !== null && state.classes[state.lastSelectedIndex]) {
                selectClass(state.lastSelectedIndex);
            } else if(state.classes.length > 0) {
                selectClass(0);
            }
        }

        function selectClass(index) { 
            state.lastSelectedIndex = index; 
            document.getElementById('tabsContainer').classList.remove('show');
            document.getElementById('scoreboardActions').classList.remove('hidden');
            document.getElementById('mobileActionsHub').classList.remove('hidden');
            sync(); renderStudents(); 
        }

        function deleteClass(index, event) {
            event.stopPropagation();
            if (confirm("Delete this class?")) {
                state.classes.splice(index, 1);
                state.lastSelectedIndex = state.classes.length > 0 ? 0 : null;
                sync(); renderTabs();
            }
        }

        /* Google Apps Script Save / Load Functions */
        function saveDataToScript() {
            let teacherId = localStorage.getItem('teacherApp_teacherId') || '';
            teacherId = prompt("Enter Teacher ID to save:", teacherId);
            if (!teacherId) return;
            localStorage.setItem('teacherApp_teacherId', teacherId);

            const payload = { teacherId: teacherId, state: state };

            fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(payload)
            })
            .then(() => alert("Save request submitted to cloud!"))
            .catch(err => alert("Error saving data: " + err));
        }

        function loadDataFromScript() {
            let teacherId = localStorage.getItem('teacherApp_teacherId') || '';
            teacherId = prompt("Enter Teacher ID to load:", teacherId);
            if (!teacherId) return;
            localStorage.setItem('teacherApp_teacherId', teacherId);

            fetch(`${SCRIPT_URL}?teacherId=${encodeURIComponent(teacherId)}`)
            .then(res => res.json())
            .then(resData => {
                if (resData.status === "success" && resData.data) {
                    state = resData.data;
                    state.lastSelectedIndex = state.classes.length > 0 ? 0 : null;
                    sync(); 
                    renderTabs();
                    alert("Data successfully loaded!");
                } else {
                    alert("Load failed: " + (resData.message || "Teacher ID not found"));
                }
            })
            .catch(err => alert("Error loading data: " + err));
        }

        window.onload = init;
    </script>
</body>
</html>
