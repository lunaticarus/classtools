<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Hub Launcher</title>

  <!-- Phosphor Icons CDN -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <style>
    /* ==========================================
       RESET & LIQUID GLASS BACKGROUND
       ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      min-height: 100vh;
      width: 100vw;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0b1120;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Subtle Background Orbs */
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.22;
      animation: float 25s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #38bdf8, #1e3a8a);
      top: -150px;
      left: -150px;
    }

    .orb-2 {
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, #818cf8, #312e81);
      bottom: -200px;
      right: -150px;
      animation-delay: -8s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(50px, 30px) scale(1.05); }
      100% { transform: translate(-30px, 60px) scale(0.95); }
    }

    /* ==========================================
       CONTAINER & HEADER
       ========================================== */
    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1080px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
      color: #ffffff;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 40%, rgba(255, 255, 255, 0.5));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Controls Bar: Search + Category Filters */
    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
    }

    /* Quick Search Bar */
    .search-wrapper {
      position: relative;
      width: 100%;
      max-width: 320px;
    }

    .search-input {
      width: 100%;
      padding: 8px 16px 8px 38px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 0.88rem;
      outline: none;
      backdrop-filter: blur(10px);
      transition: all 0.25s ease;
    }

    .search-input:focus {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.05);
    }

    .search-wrapper i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.4);
      font-size: 16px;
    }

    .search-shortcut {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 10px;
      color: rgba(255, 255, 255, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 1px 5px;
      border-radius: 4px;
    }

    /* Category Filter Pills */
    .filter-pills {
      display: flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .pill-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.5);
      padding: 6px 14px;
      font-size: 0.82rem;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .pill-btn:hover {
      color: rgba(255, 255, 255, 0.8);
    }

    .pill-btn.active {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    /* ==========================================
       DRAGGABLE GRID & GLASS CARDS
       ========================================== */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      width: 100%;
    }

    .glass-card {
      position: relative;
      border-radius: 20px;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: grab;
      overflow: hidden;
      
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px) saturate(140%);
      -webkit-backdrop-filter: blur(16px) saturate(140%);
      
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 
        0 12px 30px rgba(0, 0, 0, 0.25),
        inset 0 1px 1px rgba(255, 255, 255, 0.15);

      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                  box-shadow 0.25s ease,
                  background 0.25s ease,
                  border-color 0.25s ease,
                  opacity 0.2s ease;
    }

    .glass-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(
        circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
        rgba(255, 255, 255, 0.1) 0%,
        transparent 60%
      );
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .glass-card:hover::before {
      opacity: 1;
    }

    .glass-card:hover {
      transform: translateY(-4px);
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.35),
        inset 0 1px 1px rgba(255, 255, 255, 0.25);
    }

    .glass-card.dragging {
      opacity: 0.3;
      cursor: grabbing;
      transform: scale(0.96);
    }

    .glass-card.drag-over {
      border-color: rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.1);
      transform: scale(1.02);
    }

    /* Icon Capsule with Status Dot */
    .app-icon {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      position: relative;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      transition: background 0.25s ease, border-color 0.25s ease;
    }

    .glass-card:hover .app-icon {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .app-icon i {
      font-size: 26px;
      color: rgba(255, 255, 255, 0.85);
    }

    /* Ping Status Dot */
    .status-dot {
      position: absolute;
      top: -2px;
      right: -2px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #9ca3af;
      border: 2px solid #0b1120;
      transition: background 0.3s ease;
    }

    .status-dot.online {
      background: #10b981;
      box-shadow: 0 0 6px rgba(16, 185, 129, 0.6);
    }

    .status-dot.offline {
      background: #f59e0b;
    }

    .app-title {
      font-size: 0.9rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.85);
      text-align: center;
      letter-spacing: -0.1px;
      line-height: 1.3;
    }

    @media (max-width: 600px) {
      body {
        padding: 24px 16px;
      }
      header h1 {
        font-size: 1.8rem;
      }
      .controls-bar {
        flex-direction: column;
      }
      .search-wrapper {
        max-width: 100%;
      }
      .app-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
      }
      .glass-card {
        padding: 18px 12px;
        border-radius: 16px;
      }
      .app-icon {
        width: 50px;
        height: 50px;
        margin-bottom: 10px;
      }
      .app-icon i {
        font-size: 22px;
      }
      .app-title {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>

  <div class="ambient-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div class="container">
    <header>
      <h1>App Hub</h1>
      
      <div class="controls-bar">
        <div class="search-wrapper">
          <i class="ph ph-magnifying-glass"></i>
          <input type="text" id="searchInput" class="search-input" placeholder="Search apps..." autocomplete="off">
          <span class="search-shortcut">⌘K</span>
        </div>

        <div class="filter-pills">
          <button class="pill-btn active" onclick="setCategory('all', this)">All</button>
          <button class="pill-btn" onclick="setCategory('classroom', this)">Classroom</button>
          <button class="pill-btn" onclick="setCategory('school', this)">School</button>
        </div>
      </div>
    </header>

    <main class="app-grid" id="app-grid"></main>
  </div>

  <script>
    /* ==========================================
       APP REGISTRY (Updated Categories & Names)
       ========================================== */
    const DEFAULT_APPS = [
      // Classroom Tools
      {
        id: 'notepad',
        name: 'Notepad',
        category: 'classroom',
        iconClass: 'ph-note-pencil',
        url: 'https://script.google.com/a/macros/lstyoungkhl.edu.hk/s/AKfycbwzSbCzx6xiE02v5FGYVa02RbukLjMXLTBN4FqMjj6Eyk4dqPUptoeld7lyHGV3c4RB7g/exec',
        windowSize: 'width=900,height=700'
      },
      {
        id: 'scoreboard',
        name: 'Scoreboard',
        category: 'classroom',
        iconClass: 'ph-trophy',
        url: 'https://lunaticarus.github.io/classtools/scoreboard.html',
        windowSize: 'width=1000,height=700'
      },
      {
        id: 'vocab',
        name: 'Vocab',
        category: 'classroom',
        iconClass: 'ph-book-open-text',
        url: 'https://lunaticarus.github.io/classtools/vocab.html',
        windowSize: 'width=1100,height=750'
      },
      {
        id: 'timer',
        name: 'Timer',
        category: 'classroom',
        iconClass: 'ph-timer',
        url: 'https://lunaticarus.github.io/classtools/timer.html',
        windowSize: 'width=800,height=600'
      },
      {
        id: 'readaloud',
        name: 'ReadAloud',
        category: 'classroom',
        iconClass: 'ph-microphone',
        url: 'https://lunaticarus.github.io/ReadAloud/',
        windowSize: 'width=1000,height=700'
      },
      {
        id: 'vocabquest',
        name: 'VocabQuest',
        category: 'classroom',
        iconClass: 'ph-sword',
        url: 'https://lunaticarus.github.io/VocabQuest/',
        windowSize: 'width=1100,height=750'
      },

      // School Platforms
      {
        id: 'photoservice',
        name: 'Photo Service Booking',
        category: 'school',
        iconClass: 'ph-camera',
        url: 'https://script.google.com/a/macros/lstyoungkhl.edu.hk/s/AKfycbyy2tgpqQz82rqPVNtWhrSEYzRP-LfBkX3cKZuQkkZsMjf6nhdpKaYgvkxUFiRrETgf/exec',
        windowSize: 'width=1000,height=750'
      },
      {
        id: 'parentsday',
        name: '家長日報到平台',
        category: 'school',
        iconClass: 'ph-clipboard-text',
        url: 'https://lunaticarus.github.io/ParentsDay/',
        windowSize: 'width=1100,height=800'
      },
      {
        id: 's1briefing',
        name: '中一入學簡介會報名',
        category: 'school',
        iconClass: 'ph-buildings',
        url: 'https://lunaticarus.github.io/s1briefing/',
        windowSize: 'width=1100,height=800'
      },
      {
        id: 'openday',
        name: '開放日集章平台',
        category: 'school',
        iconClass: 'ph-target',
        url: 'https://lunaticarus.github.io/ykhl_openday/',
        windowSize: 'width=1100,height=800'
      }
    ];

    let apps = [];
    let activeCategory = 'all';
    let draggedItem = null;

    /* ==========================================
       POPUP WINDOW LAUNCHER (Centered)
       ========================================== */
    function openInNewWindow(url, sizeSpecs = 'width=1024,height=768') {
      const dualScreenLeft = window.screenLeft !== undefined ? window.screenLeft : window.screenX;
      const dualScreenTop = window.screenTop !== undefined ? window.screenTop : window.screenY;

      const screenWidth = window.innerWidth ? window.innerWidth : document.documentElement.clientWidth ? document.documentElement.clientWidth : screen.width;
      const screenHeight = window.innerHeight ? window.innerHeight : document.documentElement.clientHeight ? document.documentElement.clientHeight : screen.height;

      const defaultWidth = 1024;
      const defaultHeight = 768;
      const left = (screenWidth / 2) - (defaultWidth / 2) + dualScreenLeft;
      const top = (screenHeight / 2) - (defaultHeight / 2) + dualScreenTop;

      const windowFeatures = `${sizeSpecs},top=${top},left=${left},resizable=yes,scrollbars=yes,status=yes,toolbar=no,menubar=no,location=no`;
      window.open(url, '_blank', windowFeatures);
    }

    /* ==========================================
       PRE-FLIGHT HOST STATUS CHECK
       ========================================== */
    function checkAppStatus(appId, url) {
      const dot = document.getElementById(`status-${appId}`);
      if (!dot) return;

      fetch(url, { mode: 'no-cors', cache: 'no-cache' })
        .then(() => {
          dot.classList.remove('offline');
          dot.classList.add('online');
        })
        .catch(() => {
          dot.classList.remove('online');
          dot.classList.add('offline');
        });
    }

    /* ==========================================
       LOCALSTORAGE ORDER MANAGEMENT
       ========================================== */
    function loadAppOrder() {
      const savedOrder = localStorage.getItem('app_hub_order');
      if (savedOrder) {
        try {
          const orderedIds = JSON.parse(savedOrder);
          const appMap = new Map(DEFAULT_APPS.map(app => [app.id, app]));
          
          apps = orderedIds
            .map(id => appMap.get(id))
            .filter(Boolean);

          DEFAULT_APPS.forEach(app => {
            if (!apps.some(a => a.id === app.id)) {
              apps.push(app);
            }
          });
        } catch (e) {
          apps = [...DEFAULT_APPS];
        }
      } else {
        apps = [...DEFAULT_APPS];
      }
    }

    function saveAppOrder() {
      const orderIds = apps.map(app => app.id);
      localStorage.setItem('app_hub_order', JSON.stringify(orderIds));
    }

    /* ==========================================
       FILTER & CATEGORY SELECTION
       ========================================== */
    function setCategory(category, btnElement) {
      activeCategory = category;
      document.querySelectorAll('.pill-btn').forEach(btn => btn.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');
      renderLauncher(document.getElementById('searchInput').value);
    }

    /* ==========================================
       RENDER LAUNCHER GRID
       ========================================== */
    function renderLauncher(filterQuery = '') {
      const grid = document.getElementById('app-grid');
      grid.innerHTML = '';

      const query = filterQuery.toLowerCase().trim();

      apps.forEach((app, index) => {
        if (activeCategory !== 'all' && app.category !== activeCategory) {
          return;
        }

        if (query && !app.name.toLowerCase().includes(query)) {
          return;
        }

        const card = document.createElement('div');
        card.className = 'glass-card';
        card.draggable = true;
        card.dataset.index = index;

        card.innerHTML = `
          <div class="app-icon">
            <span class="status-dot" id="status-${app.id}"></span>
            <i class="ph ${app.iconClass}"></i>
          </div>
          <div class="app-title">${app.name}</div>
        `;

        let isDragging = false;
        
        card.addEventListener('mousedown', () => { isDragging = false; });
        card.addEventListener('mousemove', (e) => {
          isDragging = true;
          const rect = card.getBoundingClientRect();
          const x = ((e.clientX - rect.left) / rect.width) * 100;
          const y = ((e.clientY - rect.top) / rect.height) * 100;
          card.style.setProperty('--mouse-x', `${x}%`);
          card.style.setProperty('--mouse-y', `${y}%`);
        });

        card.addEventListener('click', () => {
          if (!isDragging) {
            openInNewWindow(app.url, app.windowSize);
          }
        });

        /* Drag Events */
        card.addEventListener('dragstart', (e) => {
          draggedItem = index;
          card.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });

        card.addEventListener('dragend', () => {
          card.classList.remove('dragging');
          document.querySelectorAll('.glass-card').forEach(c => c.classList.remove('drag-over'));
          draggedItem = null;
        });

        card.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          card.classList.add('drag-over');
        });

        card.addEventListener('dragleave', () => {
          card.classList.remove('drag-over');
        });

        card.addEventListener('drop', (e) => {
          e.preventDefault();
          card.classList.remove('drag-over');

          const targetIndex = parseInt(card.dataset.index, 10);
          if (draggedItem !== null && draggedItem !== targetIndex) {
            const movedApp = apps.splice(draggedItem, 1)[0];
            apps.splice(targetIndex, 0, movedApp);
            saveAppOrder();
            renderLauncher(document.getElementById('searchInput').value);
          }
        });

        grid.appendChild(card);

        checkAppStatus(app.id, app.url);
      });
    }

    /* ==========================================
       KEYBOARD SHORTCUTS & SEARCH
       ========================================== */
    function initSearchAndShortcuts() {
      const searchInput = document.getElementById('searchInput');

      searchInput.addEventListener('input', (e) => {
        renderLauncher(e.target.value);
      });

      window.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
          e.preventDefault();
          searchInput.focus();
        } else if (e.key === '/' && document.activeElement !== searchInput) {
          e.preventDefault();
          searchInput.focus();
        } else if (e.key === 'Escape' && document.activeElement === searchInput) {
          searchInput.value = '';
          searchInput.blur();
          renderLauncher();
        }
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadAppOrder();
      renderLauncher();
      initSearchAndShortcuts();
    });
  </script>
</body>
</html>
