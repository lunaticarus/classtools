<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Hub Launcher</title>

  <!-- Phosphor Icons CDN -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      min-height: 100vh;
      width: 100vw;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0b1120;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Hardware Accelerated Orbs */
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      transform: translateZ(0);
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.22;
      animation: float 25s ease-in-out infinite alternate;
      will-change: transform;
    }

    .orb-1 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #38bdf8, #1e3a8a);
      top: -150px;
      left: -150px;
    }

    .orb-2 {
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, #818cf8, #312e81);
      bottom: -200px;
      right: -150px;
      animation-delay: -8s;
    }

    @keyframes float {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(50px, 30px, 0) scale(1.05); }
      100% { transform: translate3d(-30px, 60px, 0) scale(0.95); }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1080px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
      color: #ffffff;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 40%, rgba(255, 255, 255, 0.5));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
    }

    .search-wrapper {
      position: relative;
      width: 100%;
      max-width: 320px;
    }

    .search-input {
      width: 100%;
      padding: 8px 16px 8px 38px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 0.88rem;
      outline: none;
      backdrop-filter: blur(10px);
      transition: all 0.25s ease;
    }

    .search-input:focus {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .search-wrapper i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.4);
      font-size: 16px;
    }

    .search-shortcut {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 10px;
      color: rgba(255, 255, 255, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 1px 5px;
      border-radius: 4px;
    }

    .filter-pills {
      display: flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.03);
      padding: 5px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
    }

    .pill-btn {
      position: relative;
      background: transparent;
      border: 1px solid transparent;
      color: rgba(255, 255, 255, 0.55);
      padding: 7px 18px;
      font-size: 0.85rem;
      font-weight: 500;
      border-radius: 12px;
      cursor: pointer;
      outline: none;
      transition: color 0.2s ease, transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .pill-btn:hover {
      color: rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .pill-btn.active {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.28);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }

    .pill-btn:active {
      transform: scale(0.95);
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      width: 100%;
    }

    .glass-card {
      position: relative;
      border-radius: 20px;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: grab;
      overflow: hidden;
      
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);

      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
    }

    .glass-card:hover {
      transform: translateY(-4px);
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .glass-card.dragging {
      opacity: 0.3;
      cursor: grabbing;
      transform: scale(0.96);
    }

    .glass-card.drag-over {
      border-color: rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.1);
    }

    .app-icon {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      position: relative;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .app-icon i {
      font-size: 26px;
      color: rgba(255, 255, 255, 0.85);
    }

    .status-dot {
      position: absolute;
      top: -2px;
      right: -2px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #9ca3af;
      border: 2px solid #0b1120;
    }

    .status-dot.online {
      background: #10b981;
      box-shadow: 0 0 6px rgba(16, 185, 129, 0.6);
    }

    .status-dot.offline {
      background: #f59e0b;
    }

    .app-title {
      font-size: 0.9rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.85);
      text-align: center;
      line-height: 1.3;
    }
  </style>
</head>
<body>

  <div class="ambient-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div class="container">
    <header>
      <h1>App Hub</h1>
      
      <div class="controls-bar">
        <div class="search-wrapper">
          <i class="ph ph-magnifying-glass"></i>
          <input type="text" id="searchInput" class="search-input" placeholder="Search apps..." autocomplete="off">
          <span class="search-shortcut">⌘K</span>
        </div>

        <div class="filter-pills">
          <button class="pill-btn active" onclick="setCategory('all', this)">All</button>
          <button class="pill-btn" onclick="setCategory('classroom', this)">Classroom</button>
          <button class="pill-btn" onclick="setCategory('school', this)">School</button>
        </div>
      </div>
    </header>

    <main class="app-grid" id="app-grid"></main>
  </div>

  <script>
    const DEFAULT_APPS = [
      { id: 'notepad', name: 'Notepad', category: 'classroom', iconClass: 'ph-note-pencil', url: 'https://script.google.com/a/macros/lstyoungkhl.edu.hk/s/AKfycbwzSbCzx6xiE02v5FGYVa02RbukLjMXLTBN4FqMjj6Eyk4dqPUptoeld7lyHGV3c4RB7g/exec', windowSize: 'width=900,height=700' },
      { id: 'scoreboard', name: 'Scoreboard', category: 'classroom', iconClass: 'ph-trophy', url: 'https://lunaticarus.github.io/classtools/scoreboard.html', windowSize: 'width=1000,height=700' },
      { id: 'vocab', name: 'Vocab', category: 'classroom', iconClass: 'ph-book-open-text', url: 'https://lunaticarus.github.io/classtools/vocab.html', windowSize: 'width=1100,height=750' },
      { id: 'timer', name: 'Timer', category: 'classroom', iconClass: 'ph-timer', url: 'https://lunaticarus.github.io/classtools/timer.html', windowSize: 'width=800,height=600' },
      { id: 'readaloud', name: 'ReadAloud', category: 'classroom', iconClass: 'ph-microphone', url: 'https://lunaticarus.github.io/ReadAloud/', windowSize: 'width=1000,height=700' },
      { id: 'vocabquest', name: 'VocabQuest', category: 'classroom', iconClass: 'ph-sword', url: 'https://lunaticarus.github.io/VocabQuest/', windowSize: 'width=1100,height=750' },
      { id: 'photoservice', name: 'Photo Service Booking', category: 'school', iconClass: 'ph-camera', url: 'https://script.google.com/a/macros/lstyoungkhl.edu.hk/s/AKfycbyy2tgpqQz82rqPVNtWhrSEYzRP-LfBkX3cKZuQkkZsMjf6nhdpKaYgvkxUFiRrETgf/exec', windowSize: 'width=1000,height=750' },
      { id: 'parentsday', name: '家長日報到平台', category: 'school', iconClass: 'ph-clipboard-text', url: 'https://lunaticarus.github.io/ParentsDay/', windowSize: 'width=1100,height=800' },
      { id: 's1briefing', name: '中一入學簡介會報名', category: 'school', iconClass: 'ph-buildings', url: 'https://lunaticarus.github.io/s1briefing/', windowSize: 'width=1100,height=800' },
      { id: 'openday', name: '開放日集章平台', category: 'school', iconClass: 'ph-target', url: 'https://lunaticarus.github.io/ykhl_openday/', windowSize: 'width=1100,height=800' }
    ];

    let apps = [];
    let activeCategory = 'all';
    let draggedItem = null;
    const statusCache = {}; // Cache host status across renders

    function openInNewWindow(url, sizeSpecs) {
      const dualLeft = window.screenLeft ?? window.screenX;
      const dualTop = window.screenTop ?? window.screenY;
      const width = window.innerWidth ?? screen.width;
      const height = window.innerHeight ?? screen.height;

      const left = (width / 2) - 512 + dualLeft;
      const top = (height / 2) - 384 + dualTop;

      window.open(url, '_blank', `${sizeSpecs},top=${top},left=${left},resizable=yes,scrollbars=yes,status=yes`);
    }

    /* Single-run status check per session */
    function checkAppStatusOnce(appId, url) {
      if (statusCache[appId] !== undefined) {
        updateStatusUI(appId, statusCache[appId]);
        return;
      }

      fetch(url, { mode: 'no-cors', cache: 'force-cache' })
        .then(() => {
          statusCache[appId] = 'online';
          updateStatusUI(appId, 'online');
        })
        .catch(() => {
          statusCache[appId] = 'offline';
          updateStatusUI(appId, 'offline');
        });
    }

    function updateStatusUI(appId, state) {
      const dot = document.getElementById(`status-${appId}`);
      if (dot) {
        dot.className = `status-dot ${state}`;
      }
    }

    function loadAppOrder() {
      const savedOrder = localStorage.getItem('app_hub_order');
      if (savedOrder) {
        try {
          const orderedIds = JSON.parse(savedOrder);
          const appMap = new Map(DEFAULT_APPS.map(app => [app.id, app]));
          apps = orderedIds.map(id => appMap.get(id)).filter(Boolean);
          DEFAULT_APPS.forEach(app => {
            if (!apps.some(a => a.id === app.id)) apps.push(app);
          });
        } catch {
          apps = [...DEFAULT_APPS];
        }
      } else {
        apps = [...DEFAULT_APPS];
      }
    }

    function saveAppOrder() {
      localStorage.setItem('app_hub_order', JSON.stringify(apps.map(app => app.id)));
    }

    function setCategory(category, btnElement) {
      activeCategory = category;
      document.querySelectorAll('.pill-btn').forEach(btn => btn.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');
      renderLauncher(document.getElementById('searchInput').value);
    }

    function renderLauncher(filterQuery = '') {
      const grid = document.getElementById('app-grid');
      grid.innerHTML = '';
      const query = filterQuery.toLowerCase().trim();

      apps.forEach((app, index) => {
        if (activeCategory !== 'all' && app.category !== activeCategory) return;
        if (query && !app.name.toLowerCase().includes(query)) return;

        const card = document.createElement('div');
        card.className = 'glass-card';
        card.draggable = true;
        card.dataset.index = index;

        const cachedState = statusCache[app.id] || '';

        card.innerHTML = `
          <div class="app-icon">
            <span class="status-dot ${cachedState}" id="status-${app.id}"></span>
            <i class="ph ${app.iconClass}"></i>
          </div>
          <div class="app-title">${app.name}</div>
        `;

        let isDragging = false;
        card.addEventListener('mousedown', () => { isDragging = false; });
        card.addEventListener('mousemove', () => { isDragging = true; });

        card.addEventListener('click', () => {
          if (!isDragging) openInNewWindow(app.url, app.windowSize);
        });

        card.addEventListener('dragstart', () => {
          draggedItem = index;
          card.classList.add('dragging');
        });

        card.addEventListener('dragend', () => {
          card.classList.remove('dragging');
          document.querySelectorAll('.glass-card').forEach(c => c.classList.remove('drag-over'));
          draggedItem = null;
        });

        card.addEventListener('dragover', (e) => {
          e.preventDefault();
          card.classList.add('drag-over');
        });

        card.addEventListener('dragleave', () => {
          card.classList.remove('drag-over');
        });

        card.addEventListener('drop', (e) => {
          e.preventDefault();
          card.classList.remove('drag-over');
          const targetIndex = parseInt(card.dataset.index, 10);
          if (draggedItem !== null && draggedItem !== targetIndex) {
            const movedApp = apps.splice(draggedItem, 1)[0];
            apps.splice(targetIndex, 0, movedApp);
            saveAppOrder();
            renderLauncher(document.getElementById('searchInput').value);
          }
        });

        grid.appendChild(card);
        checkAppStatusOnce(app.id, app.url);
      });
    }

    function initSearchAndShortcuts() {
      const searchInput = document.getElementById('searchInput');
      searchInput.addEventListener('input', (e) => renderLauncher(e.target.value));

      window.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
          e.preventDefault();
          searchInput.focus();
        } else if (e.key === '/' && document.activeElement !== searchInput) {
          e.preventDefault();
          searchInput.focus();
        } else if (e.key === 'Escape' && document.activeElement === searchInput) {
          searchInput.value = '';
          searchInput.blur();
          renderLauncher();
        }
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadAppOrder();
      renderLauncher();
      initSearchAndShortcuts();
    });
  </script>
</body>
</html>
