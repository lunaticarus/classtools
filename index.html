<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Scoreboard Pro</title>
    <style>
        :root { 
            --primary: #2563eb; 
            --bg: #f1f5f9; 
            --card: #ffffff; 
            --text: #0f172a; 
            --border: #e2e8f0; 
            --subtle: #64748b; 
            --highlight: #fef08a;
        }

        @media (prefers-color-scheme: dark) {
            :root { 
                --bg: #0f172a; 
                --card: #1e293b; 
                --text: #f1f5f9; 
                --border: #334155; 
                --subtle: #94a3b8; 
                --highlight: #854d0e;
            }
            input, textarea { background: #0f172a; color: white; border-color: #334155; }
            .btn { background: #334155; color: #f1f5f9; border-color: #475569; }
            .setup-area { background: #1e293b; }
            .student-row.absent { opacity: 0.2; }
            .minus { background: #475569; color: #cbd5e1; }
            .tab { background: rgba(255,255,255,0.05) !important; }
        }

        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 10px; margin: 0; transition: background 0.3s; }
        .container { max-width: 750px; margin: 0 auto; background: var(--card); border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); overflow: hidden; }
        
        /* Header */
        .header { padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .header-actions { display: flex; gap: 15px; align-items: center; }
        .icon-btn { background: none; border: none; font-size: 1.3rem; cursor: pointer; padding: 4px; transition: transform 0.1s; display: flex; align-items: center; }
        .icon-btn:hover { transform: scale(1.2); }
        
        /* Drawer */
        .setup-area { background: #f8fafc; padding: 0; max-height: 0; overflow: hidden; transition: all 0.3s ease-out; }
        .setup-area.open { padding: 20px; max-height: 500px; border-bottom: 1px solid var(--border); }
        input, textarea { width: 100%; margin: 5px 0 12px 0; border: 1px solid var(--border); border-radius: 8px; padding: 10px; box-sizing: border-box; font-size: 14px; }
        
        /* Tabs */
        .tabs-wrapper { padding: 10px 20px 0 20px; background: var(--card); }
        .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
        .tab { padding: 8px 16px; background: rgba(0,0,0,0.05); border: 1px solid var(--border); border-radius: 8px 8px 0 0; cursor: pointer; white-space: nowrap; font-size: 0.9rem; border-bottom: none; display: flex; align-items: center; }
        .tab.active { background: var(--card); color: var(--primary); font-weight: 700; border-top: 3px solid var(--primary); margin-top: -2px; }
        .tab-delete { margin-left: 8px; color: var(--subtle); padding: 2px 6px; border-radius: 4px; transition: 0.2s; }
        .tab-delete:hover { background: #fee2e2; color: #ef4444; }
        
        /* Toolbar */
        .toolbar { padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 12px; background: rgba(0,0,0,0.02); border-bottom: 1px solid var(--border); justify-content: space-between; align-items: center; }
        .btn-group { display: flex; gap: 5px; align-items: center; }
        .btn { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); cursor: pointer; font-size: 0.8rem; font-weight: 600; color: var(--subtle); background: var(--card); }
        .btn.active-sort { background: var(--subtle); color: white; }
        .btn-action { background: #e0e7ff; color: var(--primary); border-color: #c7d2fe; }
        .btn-danger.confirming { background: #fee2e2; color: #dc2626; }
        
        .toggle-label { font-size: 0.75rem; font-weight: bold; color: var(--subtle); display: flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }

        /* List Rows */
        #studentContainer { padding: 0; min-height: 200px; }
        .student-row { display: flex; align-items: center; padding: 10px 20px; border-bottom: 1px solid var(--border); transition: all 0.2s; }
        .student-row.absent { opacity: 0.3; filter: grayscale(1); }
        .student-row.highlighted { background: var(--highlight); transform: scale(1.02); z-index: 10; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        .attendance-toggle { cursor: pointer; margin-right: 12px; font-size: 1.2rem; background: none; border: none; }
        .student-info { flex-grow: 1; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 5px 0; }
        .student-name { font-weight: 500; font-size: 1.05rem; user-select: none; }
        .medal { font-size: 1.2rem; width: 24px; text-align: center; }
        
        .score-box { display: flex; align-items: center; gap: 10px; }
        .score-display { font-size: 1.4rem; font-weight: 800; min-width: 45px; text-align: center; }
        .points-btn { width: 34px; height: 34px; border-radius: 8px; font-size: 1.2rem; color: white; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .minus { background: #cbd5e1; color: #475569; }
        .plus { background: #4ade80; }
        
        .empty-state { text-align: center; padding: 40px; color: var(--subtle); font-style: italic; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 style="margin:0; font-size: 1.2rem;">Scoreboard Pro</h2>
        <div class="header-actions">
            <input type="file" id="fileInput" class="hidden" accept=".json" onchange="uploadData(event)">
            <button class="icon-btn" onclick="downloadData()" title="Backup Data">💾</button>
            <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="Load Data">📂</button>
            <button class="icon-btn" onclick="toggleSetup()" title="New Class">➕</button>
        </div>
    </div>

    <div id="setupArea" class="setup-area">
        <h3 style="margin-top:0; font-size: 0.9rem; color: var(--subtle);">ADD NEW CLASS</h3>
        <input type="text" id="className" placeholder="e.g. History 101">
        <textarea id="studentList" rows="5" placeholder="Paste student names (one per line)..."></textarea>
        <button onclick="addClass()" style="background:var(--primary); color:white; border:none; padding:12px; border-radius:8px; cursor:pointer; width:100%; font-weight:bold; font-size: 1rem;">Create Class</button>
    </div>

    <div class="tabs-wrapper"><div id="tabsContainer" class="tabs"></div></div>
    
    <div id="scoreboardActions" class="toolbar hidden">
        <div class="btn-group">
            <button id="sort-original" class="btn" onclick="setSort('original')">Org</button>
            <button id="sort-alpha" class="btn" onclick="setSort('alpha')">A-Z</button>
            <button id="sort-score" class="btn" onclick="setSort('score')">Rank</button>
        </div>
        
        <div class="btn-group">
            <label class="toggle-label">
                <input type="checkbox" id="noRepeatToggle" onchange="toggleNoRepeat(this.checked)"> No-Repeat
            </label>
            <button class="btn btn-action" onclick="pickRandom()">🎲 Random</button>
            <button class="btn btn-action" onclick="awardAll(1)">🌟 +1 All</button>
            <button class="btn btn-danger" onclick="resetScores(this)">Reset</button>
        </div>
    </div>

    <div id="studentContainer">
        <div class="empty-state">Click ➕ to add a class or 📂 to load a backup.</div>
    </div>
</div>

<script>
    let state = { 
        classes: [], 
        lastSelectedIndex: null, 
        lastSortMode: 'original',
        noRepeatMode: false,
        pickedIds: [] 
    };
    const STORE_KEY = 'teacherApp_v8_final';

    // --- Audio Engine (Web Audio API) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        if (type === 'up') {
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        } else {
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(150, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        }
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    }

    function sync() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

    function init() {
        const saved = localStorage.getItem(STORE_KEY);
        if (saved) { 
            state = JSON.parse(saved);
            // Patch for old versions
            if (state.noRepeatMode === undefined) state.noRepeatMode = false;
            if (state.pickedIds === undefined) state.pickedIds = [];
            
            document.getElementById('noRepeatToggle').checked = state.noRepeatMode;
            renderTabs(); 
        }
    }

    // --- Actions ---
    function toggleSetup() { document.getElementById('setupArea').classList.toggle('open'); }

    function addClass() {
        const nameField = document.getElementById('className');
        const listField = document.getElementById('studentList');
        const names = listField.value.split('\n').map(n => n.trim()).filter(n => n !== "");
        if (!nameField.value || names.length === 0) return;
        state.classes.push({
            name: nameField.value,
            students: names.map((s, i) => ({ id: Date.now() + i, name: s, score: 0, order: i, absent: false }))
        });
        nameField.value = ""; listField.value = "";
        state.lastSelectedIndex = state.classes.length - 1;
        toggleSetup(); sync(); renderTabs();
    }

    function editStudentName(studentId, event) {
        event.stopPropagation();
        const student = state.classes[state.lastSelectedIndex].students.find(s => s.id === studentId);
        const newName = prompt("Rename student:", student.name);
        if (newName && newName.trim() !== "") {
            student.name = newName.trim();
            sync(); renderStudents();
        }
    }

    function toggleNoRepeat(val) {
        state.noRepeatMode = val;
        state.pickedIds = []; 
        sync();
    }

    function updateScore(studentId, delta, event = null) {
        if(event) event.stopPropagation();
        const student = state.classes[state.lastSelectedIndex].students.find(s => s.id === studentId);
        if (student) { 
            student.score += delta; 
            playSound(delta > 0 ? 'up' : 'down');
            sync(); renderStudents(); 
        }
    }

    function pickRandom() {
        const activeClass = state.classes[state.lastSelectedIndex];
        const presentStudents = activeClass.students.filter(s => !s.absent);
        if (presentStudents.length === 0) return;

        let pool = presentStudents;
        if (state.noRepeatMode) {
            pool = presentStudents.filter(s => !state.pickedIds.includes(s.id));
            if (pool.length === 0) { // Reset cycle
                state.pickedIds = [];
                pool = presentStudents;
            }
        }

        const winner = pool[Math.floor(Math.random() * pool.length)];
        if (state.noRepeatMode) state.pickedIds.push(winner.id);
        
        sync();
        
        const row = document.getElementById(`student-${winner.id}`);
        document.querySelectorAll('.student-row').forEach(r => r.classList.remove('highlighted'));
        row.scrollIntoView({ behavior: 'smooth', block: 'center' });
        row.classList.add('highlighted');
        playSound('up');
        setTimeout(() => row.classList.remove('highlighted'), 3000);
    }

    // --- Rendering ---
    function renderTabs() {
        const container = document.getElementById('tabsContainer');
        container.innerHTML = "";
        if (state.classes.length === 0) {
            document.getElementById('studentContainer').innerHTML = '<div class="empty-state">No classes found. Click ➕ to begin.</div>';
            document.getElementById('scoreboardActions').classList.add('hidden');
            return;
        }
        state.classes.forEach((cls, i) => {
            const btn = document.createElement('div');
            btn.className = `tab ${state.lastSelectedIndex === i ? 'active' : ''}`;
            btn.innerHTML = `${cls.name} <span class="tab-delete" onclick="deleteClass(${i}, event, this)">×</span>`;
            btn.onclick = (e) => { if (e.target.className !== 'tab-delete') selectClass(i); };
            container.appendChild(btn);
        });
        if (state.lastSelectedIndex !== null && state.classes[state.lastSelectedIndex]) {
            renderStudents();
            document.getElementById('scoreboardActions').classList.remove('hidden');
        }
    }

    function renderStudents() {
        const container = document.getElementById('studentContainer');
        const activeClass = state.classes[state.lastSelectedIndex];
        if(!activeClass) return;

        document.querySelectorAll('.btn').forEach(b => b.classList.remove('active-sort'));
        const sortBtn = document.getElementById(`sort-${state.lastSortMode}`);
        if(sortBtn) sortBtn.classList.add('active-sort');

        // Medal Logic: Only positive scores
        const uniquePositiveScores = [...new Set(activeClass.students.map(s => s.score))]
            .filter(s => s > 0)
            .sort((a,b) => b-a);

        const getMedal = (score) => {
            if (score <= 0) return "";
            if (score === uniquePositiveScores[0]) return "🥇";
            if (score === uniquePositiveScores[1]) return "🥈";
            if (score === uniquePositiveScores[2]) return "🥉";
            return "";
        };

        let students = [...activeClass.students];
        if (state.lastSortMode === 'alpha') students.sort((a, b) => a.name.localeCompare(b.name));
        else if (state.lastSortMode === 'score') students.sort((a, b) => b.score - a.score);
        else students.sort((a, b) => a.order - b.order);

        container.innerHTML = students.map(s => `
            <div id="student-${s.id}" class="student-row ${s.absent ? 'absent' : ''}">
                <button class="attendance-toggle" onclick="toggleAbsent(${s.id}, event)">${s.absent ? '😴' : '👀'}</button>
                <div class="student-info" onclick="updateScore(${s.id}, 1)" ondblclick="editStudentName(${s.id}, event)">
                    <span class="medal">${getMedal(s.score)}</span>
                    <span class="student-name">${s.name}</span>
                </div>
                <div class="score-box">
                    <button class="points-btn minus" onclick="updateScore(${s.id}, -1, event)">−</button>
                    <span class="score-display">${s.score}</span>
                    <button class="points-btn plus" onclick="updateScore(${s.id}, 1, event)">+</button>
                </div>
            </div>
        `).join('');
    }

    // --- Helpers ---
    function selectClass(index) { 
        state.lastSelectedIndex = index; 
        state.pickedIds = []; // Reset picker pool when switching classes
        sync(); 
        renderTabs(); 
    }
    
    function setSort(mode) { state.lastSortMode = mode; sync(); renderStudents(); }

    function toggleAbsent(studentId, event) {
        event.stopPropagation();
        const student = state.classes[state.lastSelectedIndex].students.find(s => s.id === studentId);
        if (student) { student.absent = !student.absent; sync(); renderStudents(); }
    }

    function awardAll(delta) {
        state.classes[state.lastSelectedIndex].students.forEach(s => { if(!s.absent) s.score += delta; });
        playSound('up'); sync(); renderStudents();
    }

    function resetScores(btn) {
        if (!btn.classList.contains('confirming')) {
            btn.innerText = "Sure?"; btn.classList.add('confirming');
            setTimeout(() => { btn.innerText = "Reset"; btn.classList.remove('confirming'); }, 3000);
        } else {
            state.classes[state.lastSelectedIndex].students.forEach(s => s.score = 0);
            state.pickedIds = []; sync(); renderStudents();
            btn.innerText = "Reset"; btn.classList.remove('confirming');
        }
    }

    function deleteClass(index, event, btn) {
        event.stopPropagation();
        if (btn.innerText === "×") {
            btn.innerText = "Sure?"; btn.style.color = "#dc2626";
            setTimeout(() => { btn.innerText = "×"; btn.style.color = ""; }, 3000);
        } else {
            state.classes.splice(index, 1);
            state.lastSelectedIndex = state.classes.length > 0 ? 0 : null;
            sync(); renderTabs();
        }
    }

    function downloadData() {
        const now = new Date();
        const dateStr = now.toISOString().split('T')[0];
        const timeStr = now.getHours().toString().padStart(2, '0') + '-' + now.getMinutes().toString().padStart(2, '0');
        const fileName = `Scoreboard_${dateStr}_${timeStr}.json`;
        
        const blob = new Blob([JSON.stringify(state)], { type: 'application/json' });
        const a = document.createElement('a'); 
        a.href = URL.createObjectURL(blob);
        a.download = fileName; 
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }
    
    function uploadData(event) {
        const file = event.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => { 
            try {
                state = JSON.parse(e.target.result); 
                sync(); renderTabs();
            } catch(err) { alert("Invalid file format."); }
        };
        reader.readAsText(file);
    }

    window.onload = init;
</script>
</body>
</html>
