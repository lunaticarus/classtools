<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>APP_HUB // TERMINAL_v4.0</title>

  <!-- Lucide Icons Vanilla JS UMD Bundle -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <!-- Cyberpunk Fonts: Orbitron (Headings), Share Tech Mono (Labels/HUD), JetBrains Mono (Body/Terminal) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       CYBERPUNK DESIGN SYSTEM TOKENS & BASE STYLES
       ========================================================================== */
    :root {
      --bg-void: #0a0a0f;
      --bg-card: #12121a;
      --bg-muted: #1c1c2e;
      
      --text-main: #e0e0e0;
      --text-muted: #6b7280;
      
      --accent-green: #00ff88;     /* Matrix Primary Neon */
      --accent-magenta: #ff00ff;   /* Secondary Cyber Neon */
      --accent-cyan: #00d4ff;      /* Tertiary Data Neon */
      --accent-amber: #ff9f0a;     /* Warning Status */
      
      --border-subtle: #2a2a3a;
      
      --font-heading: "Orbitron", sans-serif;
      --font-body: "JetBrains Mono", monospace;
      --font-tech: "Share Tech Mono", monospace;
      
      --shadow-neon: 0 0 8px #00ff88, 0 0 20px rgba(0, 255, 136, 0.35);
      --shadow-neon-magenta: 0 0 8px #ff00ff, 0 0 20px rgba(255, 0, 255, 0.35);
      --shadow-neon-cyan: 0 0 8px #00d4ff, 0 0 20px rgba(0, 212, 255, 0.35);

      /* Chamfer clip-path definitions */
      --clip-chamfer-lg: polygon(0 14px, 14px 0, calc(100% - 14px) 0, 100% 14px, 100% calc(100% - 14px), calc(100% - 14px) 100%, 14px 100%, 0 calc(100% - 14px));
      --clip-chamfer-sm: polygon(0 8px, 8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px));
      --clip-banner: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      min-height: 100vh;
      overflow-x: hidden;
      background-color: var(--bg-void);
      color: var(--text-main);
      font-family: var(--font-body);
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 20px 80px 20px;
      -webkit-font-smoothing: antialiased;
      position: relative;
    }

    /* --------------------------------------------------------------------------
       TEXTURES: SCANLINES, CIRCUIT GRID & GLITCH KEYFRAMES
       -------------------------------------------------------------------------- */
    /* Fullscreen CRT Scanlines Overlay */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.35) 2px,
        rgba(0, 0, 0, 0.35) 4px
      );
      pointer-events: none;
      z-index: 999;
      opacity: 0.85;
    }

    /* Tech PCB Circuit Grid Background */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 255, 136, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 136, 0.035) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* Corner Radial Glows */
    .bg-glow-magenta {
      position: fixed;
      top: -150px;
      left: -150px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(255, 0, 255, 0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .bg-glow-cyan {
      position: fixed;
      bottom: -150px;
      right: -150px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(0, 212, 255, 0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* --------------------------------------------------------------------------
       CONTAINER & HEADER
       -------------------------------------------------------------------------- */
    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 36px;
      gap: 24px;
    }

    /* Glitch Title Container */
    .glitch-wrapper {
      position: relative;
      display: inline-block;
    }

    .cyber-title {
      font-family: var(--font-heading);
      font-size: 3rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: var(--accent-green);
      text-shadow: var(--shadow-neon);
      position: relative;
    }

    /* Chromatic Aberration RGB Splitting Animations */
    .cyber-title::before,
    .cyber-title::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      clip: rect(0, 0, 0, 0);
    }

    .cyber-title::before {
      left: -2px;
      text-shadow: 2px 0 var(--accent-magenta);
      animation: glitch-anim-1 2.5s infinite linear alternate-reverse;
    }

    .cyber-title::after {
      left: 2px;
      text-shadow: -2px 0 var(--accent-cyan);
      animation: glitch-anim-2 3s infinite linear alternate-reverse;
    }

    @keyframes glitch-anim-1 {
      0% { clip: rect(20px, 9999px, 40px, 0); }
      10% { clip: rect(80px, 9999px, 100px, 0); }
      20% { clip: rect(10px, 9999px, 50px, 0); }
      30% { clip: rect(60px, 9999px, 70px, 0); }
      40% { clip: rect(30px, 9999px, 90px, 0); }
      50% { clip: rect(0px, 0px, 0px, 0); }
      100% { clip: rect(0px, 0px, 0px, 0); }
    }

    @keyframes glitch-anim-2 {
      0% { clip: rect(50px, 9999px, 80px, 0); }
      15% { clip: rect(10px, 9999px, 30px, 0); }
      35% { clip: rect(70px, 9999px, 90px, 0); }
      55% { clip: rect(20px, 9999px, 60px, 0); }
      75% { clip: rect(0px, 0px, 0px, 0); }
      100% { clip: rect(0px, 0px, 0px, 0); }
    }

    /* Subtitle Terminal Header */
    .hud-subtext {
      font-family: var(--font-tech);
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hud-subtext .status-pulse {
      width: 8px;
      height: 8px;
      background: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    /* --------------------------------------------------------------------------
       CONTROLS BAR (SEARCH & FILTERS)
       -------------------------------------------------------------------------- */
    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
    }

    /* Cyber Input Field */
    .search-wrapper {
      position: relative;
      width: 100%;
      max-width: 360px;
    }

    .search-prefix {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--accent-green);
      font-family: var(--font-tech);
      font-weight: 700;
      font-size: 1rem;
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 10px 42px 10px 30px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      clip-path: var(--clip-chamfer-sm);
      color: var(--text-main);
      font-family: var(--font-body);
      font-size: 0.88rem;
      outline: none;
      transition: all 0.15s ease;
    }

    .search-input::placeholder {
      color: var(--text-muted);
      font-family: var(--font-tech);
      letter-spacing: 1px;
    }

    .search-input:focus {
      border-color: var(--accent-green);
      box-shadow: var(--shadow-neon);
      background: rgba(0, 255, 136, 0.05);
    }

    .search-shortcut {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-family: var(--font-tech);
      font-size: 10px;
      color: var(--accent-cyan);
      border: 1px solid var(--accent-cyan);
      padding: 1px 5px;
      background: rgba(0, 212, 255, 0.1);
      letter-spacing: 1px;
    }

    /* Cyber Pill Filters */
    .filter-pills {
      display: flex;
      gap: 8px;
    }

    .pill-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-family: var(--font-tech);
      font-size: 0.85rem;
      padding: 8px 18px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      clip-path: var(--clip-chamfer-sm);
      transition: all 0.15s ease;
      position: relative;
    }

    .pill-btn:hover {
      color: var(--text-main);
      border-color: var(--accent-cyan);
      box-shadow: 0 0 8px rgba(0, 212, 255, 0.3);
    }

    .pill-btn.active {
      color: var(--bg-void);
      background: var(--accent-green);
      border-color: var(--accent-green);
      font-weight: 700;
      box-shadow: var(--shadow-neon);
    }

    .pill-btn:active {
      transform: scale(0.96);
    }

    /* --------------------------------------------------------------------------
       APP GRID & CYBER CARDS
       -------------------------------------------------------------------------- */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 20px;
      width: 100%;
    }

    .glass-card {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      clip-path: var(--clip-chamfer-lg);
      padding: 24px 16px 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: grab;
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Tech Corner Accent Lines */
    .glass-card::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 16px;
      height: 2px;
      background: var(--border-subtle);
      transition: background 0.15s ease;
    }

    .glass-card::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 16px;
      height: 2px;
      background: var(--border-subtle);
      transition: background 0.15s ease;
    }

    .glass-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-green);
      box-shadow: var(--shadow-neon);
      background: rgba(18, 18, 26, 0.95);
    }

    .glass-card:hover::before,
    .glass-card:hover::after {
      background: var(--accent-green);
    }

    /* Drag states */
    .glass-card.dragging {
      opacity: 0.3;
      cursor: grabbing;
      transform: scale(0.95);
    }

    .glass-card.drag-over {
      border-color: var(--accent-magenta);
      box-shadow: var(--shadow-neon-magenta);
      background: rgba(255, 0, 255, 0.08);
    }

    /* App Icon Frame */
    .app-icon-container {
      width: 60px;
      height: 60px;
      background: var(--bg-void);
      border: 1px solid var(--border-subtle);
      clip-path: var(--clip-chamfer-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      position: relative;
      transition: all 0.15s ease;
    }

    .glass-card:hover .app-icon-container {
      border-color: var(--accent-green);
      box-shadow: inset 0 0 10px rgba(0, 255, 136, 0.2);
    }

    .app-icon-container svg {
      width: 28px;
      height: 28px;
      stroke: var(--text-main);
      stroke-width: 1.5;
      fill: none;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), stroke 0.2s ease;
    }

    .glass-card:hover .app-icon-container svg {
      stroke: var(--accent-green);
      filter: drop-shadow(0 0 4px var(--accent-green));
    }

    /* Animate-UI Spring Animations on Hover */
    .glass-card:hover .app-icon-container svg[data-lucide="square-pen"],
    .glass-card:hover .app-icon-container svg[data-lucide="camera"] {
      transform: rotate(-12deg) scale(1.18);
    }

    .glass-card:hover .app-icon-container svg[data-lucide="trophy"],
    .glass-card:hover .app-icon-container svg[data-lucide="target"] {
      transform: scale(1.22) translateY(-2px);
    }

    .glass-card:hover .app-icon-container svg[data-lucide="timer"] {
      transform: rotate(45deg) scale(1.15);
    }

    .glass-card:hover .app-icon-container svg[data-lucide="mic"] {
      animation: pulseMic 0.6s ease infinite alternate;
    }

    .glass-card:hover .app-icon-container svg[data-lucide="swords"],
    .glass-card:hover .app-icon-container svg[data-lucide="book-open-text"] {
      transform: scale(1.18) rotate(8deg);
    }

    .glass-card:hover .app-icon-container svg[data-lucide="clipboard-list"],
    .glass-card:hover .app-icon-container svg[data-lucide="building"] {
      transform: translateY(-3px) scale(1.12);
    }

    @keyframes pulseMic {
      from { transform: scale(1.1); }
      to { transform: scale(1.25); }
    }

    /* Cyber Status Indicator Dot */
    .status-dot {
      position: absolute;
      top: -3px;
      right: -3px;
      width: 8px;
      height: 8px;
      background: var(--text-muted);
      border: 1px solid var(--bg-void);
      z-index: 2;
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .status-dot.online {
      background: var(--accent-green);
      box-shadow: 0 0 6px var(--accent-green);
    }

    .status-dot.offline {
      background: var(--accent-amber);
      box-shadow: 0 0 6px var(--accent-amber);
    }

    /* App Title */
    .app-title {
      font-family: var(--font-tech);
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-main);
      text-align: center;
      line-height: 1.3;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .glass-card:hover .app-title {
      color: var(--accent-green);
    }

    /* Category Tag Badge */
    .card-category-tag {
      position: absolute;
      top: 6px;
      left: 8px;
      font-family: var(--font-tech);
      font-size: 9px;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* --------------------------------------------------------------------------
       FOOTER HUD & RESPONSIVE
       -------------------------------------------------------------------------- */
    #appVersion {
      position: fixed;
      right: 16px;
      bottom: 12px;
      font-family: var(--font-tech);
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      pointer-events: none;
      z-index: 2000;
      background: var(--bg-card);
      padding: 4px 8px;
      border: 1px solid var(--border-subtle);
    }

    @media (max-width: 650px) {
      body {
        padding: 24px 12px 60px 12px;
      }
      .cyber-title {
        font-size: 2rem;
        letter-spacing: 2px;
      }
      .controls-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .search-wrapper {
        max-width: 100%;
      }
      .filter-pills {
        justify-content: center;
      }
      .app-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- Tech PCB Grid & Background Ambient Glows -->
  <div class="bg-grid"></div>
  <div class="bg-glow-magenta"></div>
  <div class="bg-glow-cyan"></div>

  <div class="container">
    <header>
      <div class="glitch-wrapper">
        <h1 class="cyber-title" data-text="APP_HUB //">APP_HUB //</h1>
      </div>
      
      <div class="hud-subtext">
        <span class="status-pulse"></span>
        SYSTEM_READY // NODES_ACTIVE: <span id="nodeCount">0</span>
      </div>

      <div class="controls-bar">
        <div class="search-wrapper">
          <span class="search-prefix">&gt;</span>
          <input type="text" id="searchInput" class="search-input" placeholder="SEARCH_NODE..." autocomplete="off">
          <span class="search-shortcut">CMD+K</span>
        </div>

        <div class="filter-pills">
          <button class="pill-btn active" onclick="setCategory('all', this)">[ALL]</button>
          <button class="pill-btn" onclick="setCategory('classroom', this)">[CLASSROOM]</button>
          <button class="pill-btn" onclick="setCategory('school', this)">[SCHOOL]</button>
        </div>
      </div>
    </header>

    <main class="app-grid" id="app-grid"></main>
  </div>

  <div id="appVersion">SYS_VER 4.0 // CYBER_GLITCH</div>

  <script>
    /* --------------------------------------------------------------------------
       APP HUBLAUNCHER LOGIC & DATA
       -------------------------------------------------------------------------- */
    const DEFAULT_APPS = [
      { id: 'notepad', name: 'Notepad', category: 'classroom', iconName: 'square-pen', url: 'https://script.google.com/a/macros/lstyoungkhl.edu.hk/s/AKfycbwzSbCzx6xiE02v5FGYVa02RbukLjMXLTBN4FqMjj6Eyk4dqPUptoeld7lyHGV3c4RB7g/exec', windowSize: 'width=900,height=700' },
      { id: 'scoreboard', name: 'Scoreboard', category: 'classroom', iconName: 'trophy', url: 'https://lunaticarus.github.io/classtools/scoreboard.html', windowSize: 'width=1000,height=700' },
      { id: 'vocab', name: 'Vocab', category: 'classroom', iconName: 'book-open-text', url: 'https://lunaticarus.github.io/classtools/vocab.html', windowSize: 'width=1100,height=750' },
      { id: 'timer', name: 'Timer', category: 'classroom', iconName: 'timer', url: 'https://lunaticarus.github.io/classtools/timer.html', windowSize: 'width=800,height=600' },
      { id: 'readaloud', name: 'ReadAloud', category: 'classroom', iconName: 'mic', url: 'https://lunaticarus.github.io/ReadAloud/', windowSize: 'width=1000,height=700' },
      { id: 'vocabquest', name: 'VocabQuest', category: 'classroom', iconName: 'swords', url: 'https://lunaticarus.github.io/VocabQuest/', windowSize: 'width=1100,height=750' },
      { id: 'photoservice', name: 'Photo Booking', category: 'school', iconName: 'camera', url: 'https://script.google.com/a/macros/lstyoungkhl.edu.hk/s/AKfycbyy2tgpqQz82rqPVNtWhrSEYzRP-LfBkX3cKZuQkkZsMjf6nhdpKaYgvkxUFiRrETgf/exec', windowSize: 'width=1000,height=750' },
      { id: 'parentsday', name: '家長日報到', category: 'school', iconName: 'clipboard-list', url: 'https://lunaticarus.github.io/ParentsDay/', windowSize: 'width=1100,height=800' },
      { id: 's1briefing', name: '中一簡介會', category: 'school', iconName: 'building', url: 'https://lunaticarus.github.io/s1briefing/', windowSize: 'width=1100,height=800' },
      { id: 'openday', name: '開放日集章', category: 'school', iconName: 'target', url: 'https://lunaticarus.github.io/ykhl_openday/', windowSize: 'width=1100,height=800' }
    ];

    let apps = [];
    let activeCategory = 'all';
    let draggedItem = null;
    const statusCache = {};

    function openInNewWindow(url, sizeSpecs) {
      const dualLeft = window.screenLeft ?? window.screenX;
      const dualTop = window.screenTop ?? window.screenY;
      const width = window.innerWidth ?? screen.width;
      const height = window.innerHeight ?? screen.height;

      const left = (width / 2) - 512 + dualLeft;
      const top = (height / 2) - 384 + dualTop;

      window.open(url, '_blank', `${sizeSpecs},top=${top},left=${left},resizable=yes,scrollbars=yes,status=yes`);
    }

    function checkAppStatusOnce(appId, url) {
      if (statusCache[appId] !== undefined) {
        updateStatusUI(appId, statusCache[appId]);
        return;
      }

      fetch(url, { mode: 'no-cors', cache: 'force-cache' })
        .then(() => {
          statusCache[appId] = 'online';
          updateStatusUI(appId, 'online');
        })
        .catch(() => {
          statusCache[appId] = 'offline';
          updateStatusUI(appId, 'offline');
        });
    }

    function updateStatusUI(appId, state) {
      const dot = document.getElementById(`status-${appId}`);
      if (dot) {
        dot.className = `status-dot ${state}`;
      }
    }

    function loadAppOrder() {
      const savedOrder = localStorage.getItem('app_hub_order');
      if (savedOrder) {
        try {
          const orderedIds = JSON.parse(savedOrder);
          const appMap = new Map(DEFAULT_APPS.map(app => [app.id, app]));
          apps = orderedIds.map(id => appMap.get(id)).filter(Boolean);
          DEFAULT_APPS.forEach(app => {
            if (!apps.some(a => a.id === app.id)) apps.push(app);
          });
        } catch {
          apps = [...DEFAULT_APPS];
        }
      } else {
        apps = [...DEFAULT_APPS];
      }
    }

    function saveAppOrder() {
      localStorage.setItem('app_hub_order', JSON.stringify(apps.map(app => app.id)));
    }

    function setCategory(category, btnElement) {
      activeCategory = category;
      document.querySelectorAll('.pill-btn').forEach(btn => btn.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');
      renderLauncher(document.getElementById('searchInput').value);
    }

    function renderLauncher(filterQuery = '') {
      const grid = document.getElementById('app-grid');
      grid.innerHTML = '';
      const query = filterQuery.toLowerCase().trim();

      let visibleCount = 0;

      apps.forEach((app, index) => {
        if (activeCategory !== 'all' && app.category !== activeCategory) return;
        if (query && !app.name.toLowerCase().includes(query)) return;

        visibleCount++;

        const card = document.createElement('div');
        card.className = 'glass-card';
        card.draggable = true;
        card.dataset.index = index;

        const cachedState = statusCache[app.id] || '';

        card.innerHTML = `
          <span class="card-category-tag">${app.category}</span>
          <div class="app-icon-container">
            <span class="status-dot ${cachedState}" id="status-${app.id}"></span>
            <i data-lucide="${app.iconName}"></i>
          </div>
          <div class="app-title">${app.name}</div>
        `;

        let isDragging = false;
        card.addEventListener('mousedown', () => { isDragging = false; });
        card.addEventListener('mousemove', () => { isDragging = true; });

        card.addEventListener('click', () => {
          if (!isDragging) openInNewWindow(app.url, app.windowSize);
        });

        card.addEventListener('dragstart', () => {
          draggedItem = index;
          card.classList.add('dragging');
        });

        card.addEventListener('dragend', () => {
          card.classList.remove('dragging');
          document.querySelectorAll('.glass-card').forEach(c => c.classList.remove('drag-over'));
          draggedItem = null;
        });

        card.addEventListener('dragover', (e) => {
          e.preventDefault();
          card.classList.add('drag-over');
        });

        card.addEventListener('dragleave', () => {
          card.classList.remove('drag-over');
        });

        card.addEventListener('drop', (e) => {
          e.preventDefault();
          card.classList.remove('drag-over');
          const targetIndex = parseInt(card.dataset.index, 10);
          if (draggedItem !== null && draggedItem !== targetIndex) {
            const movedApp = apps.splice(draggedItem, 1)[0];
            apps.splice(targetIndex, 0, movedApp);
            saveAppOrder();
            renderLauncher(document.getElementById('searchInput').value);
          }
        });

        grid.appendChild(card);
        checkAppStatusOnce(app.id, app.url);
      });

      // Update Node Counter
      document.getElementById('nodeCount').innerText = visibleCount;

      // Render Lucide SVG Icons
      if (window.lucide) {
        lucide.createIcons();
      }
    }

    function initSearchAndShortcuts() {
      const searchInput = document.getElementById('searchInput');
      searchInput.addEventListener('input', (e) => renderLauncher(e.target.value));

      window.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
          e.preventDefault();
          searchInput.focus();
        } else if (e.key === '/' && document.activeElement !== searchInput) {
          e.preventDefault();
          searchInput.focus();
        } else if (e.key === 'Escape' && document.activeElement === searchInput) {
          searchInput.value = '';
          searchInput.blur();
          renderLauncher();
        }
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadAppOrder();
      renderLauncher();
      initSearchAndShortcuts();
    });
  </script>
</body>
</html>
